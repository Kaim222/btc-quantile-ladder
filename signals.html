<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>BTC Signals</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23020817'/%3E%3Cpath d='M14 48 L14 42 L20 42 L20 22 L14 22 L14 16 L22 16 L22 10 L28 10 L28 16 L32 16 L32 10 L38 10 L38 16.5 Q46 17.5 46 24 Q46 29 42 30.5 Q48 32 48 38.5 Q48 46 38 47.5 L38 54 L32 54 L32 48 L28 48 L28 54 L22 54 L22 48 Z M26 22 L26 28 L34 28 Q38 28 38 25 Q38 22 34 22 Z M26 34 L26 42 L35 42 Q40 42 40 38 Q40 34 35 34 Z' fill='%23facc15'/%3E%3C/svg%3E"
    />
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap");
      * {
        box-sizing: border-box;
      }
      :root {
        --bg: #020817;
        --card: #070f1f;
        --inner: #040c1a;
        --border: #0f2035;
        --text: #e2e8f0;
        --muted: #8aaac8;
        --dim: #6b8fb3;
        --cyan: #22d3ee;
        --gold: #facc15;
        --red: #ef4444;
        --green: #34d399;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "JetBrains Mono", "Courier New", monospace;
        font-variant-numeric: tabular-nums;
      }
      button,
      select,
      input {
        font: inherit;
      }
      .shell {
        max-width: 1300px;
        margin: auto;
        padding: 22px;
      }
      .nav {
        display: flex;
        gap: 22px;
        margin-bottom: 22px;
        border-bottom: 1px solid var(--border);
      }
      .nav a {
        padding: 9px 2px;
        text-decoration: none;
        font-size: 11px;
        letter-spacing: 0.16em;
        color: var(--muted);
      }
      .nav .active {
        color: var(--gold);
        border-bottom: 2px solid var(--gold);
      }
      a {
        color: var(--cyan);
      }
      .grid {
        display: grid;
        gap: 12px;
      }
      .g2 {
        grid-template-columns: 1fr 1fr;
      }
      .g3 {
        grid-template-columns: repeat(3, 1fr);
      }
      .g4 {
        grid-template-columns: repeat(4, 1fr);
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 15px;
      }
      .inner {
        background: var(--inner);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 10px;
      }
      .section {
        margin-top: 20px;
      }
      .section h2,
      details > summary {
        font-size: 11px;
        color: var(--muted);
        letter-spacing: 0.14em;
        margin: 0 0 10px;
      }
      .label {
        font-size: 10px;
        color: var(--dim);
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .badge {
        display: inline-block;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 3px 7px;
        font-size: 9px;
        white-space: nowrap;
      }
      .gold {
        color: var(--gold);
        border-color: #6a5b15;
      }
      .cyan {
        color: var(--cyan);
        border-color: #15566a;
      }
      .green {
        color: var(--green);
      }
      .red {
        color: var(--red);
      }
      .muted {
        color: var(--muted);
      }
      .stale {
        border: 1px solid var(--gold);
        padding: 8px;
        color: var(--gold);
        font-size: 10px;
        margin-top: 10px;
      }
      .placeholder {
        color: var(--dim);
        padding: 18px;
        text-align: center;
      }
      .tabs {
        display: flex;
        gap: 6px;
        margin: 8px 0;
      }
      .tabs button,
      .tabs select,
      button {
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--border);
        padding: 8px 12px;
        min-height: 44px;
      }
      .tabs .on {
        color: var(--gold);
        border-color: var(--gold);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 10px;
      }
      th,
      td {
        text-align: left;
        padding: 8px;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
      }
      th {
        color: var(--dim);
      }
      .scroll {
        overflow: auto;
      }
      details summary {
        cursor: pointer;
      }
      .footer {
        font-size: 10px;
        line-height: 1.7;
        color: var(--muted);
      }
      .card,
      .inner {
        transition: border-color 0.15s;
      }
      .marker-g {
        transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
      }
      @keyframes pulseGold {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(250, 204, 21, 0.35);
        }
        50% {
          box-shadow: 0 0 0 7px rgba(250, 204, 21, 0);
        }
      }
      .armed {
        animation: pulseGold 2s ease-in-out infinite;
        border-color: #6a5b15;
      }
      @keyframes pulseLive {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.55;
        }
      }
      .livepulse {
        animation: pulseLive 1.6s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .armed,
        .livepulse {
          animation: none;
        }
        .marker-g {
          transition: none;
        }
      }
      @media (max-width: 700px) {
        .g3,
        .g4,
        .g2 {
          grid-template-columns: 1fr !important;
        }
        .shell {
          padding: 10px;
        }
        .card {
          padding: 10px;
        }
        th,
        td {
          white-space: nowrap;
        }
        .section {
          margin-top: 14px;
        }
        .verdict-word {
          font-size: 26px !important;
        }
        .levels-rail {
          display: none;
        }
        .level-chip {
          flex: 1 1 45% !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      /* Color contract: green/red measured outcomes and direction only; gold caution/neutral verdict; cyan data/interaction; capped probability stays muted. */
      const { useEffect, useRef, useState } = React,
        H = { h24: "24H", d7: "7D", d30: "30D" },
        HK = { h24: "weight_24h", d7: "weight_7d", d30: "weight_30d" },
        CAP = { h24: 0.575, d7: 0.625, d30: 0.65 };
      const fmt = (x, d = 0) => (x == null ? "—" : Number(x).toFixed(d)),
        pc = (x) =>
          x == null ? "—" : `${(100 * x).toFixed(1).replace(".0", "")}%`,
        money = (x) => (x == null ? "—" : `$${Math.round(x).toLocaleString()}`),
        signed = (x, d = 1) =>
          x == null ? "—" : `${x >= 0 ? "+" : "−"}${Math.abs(x).toFixed(d)}`;
      const SHORT = {
        funding_extreme: "FUNDING",
        oi_purge_flush: "OI FLUSH",
        breakout_20d: "20D BREAK",
        box_position: "BOX POS",
        monday_asia: "MON ASIA",
        autocorr_gate: "AUTOCORR",
        momentum_7d: "MOM 7D",
        sth_sopr: "STH SOPR",
        etf_flow_5d: "ETF FLOW",
        basis_regime: "BASIS",
        oil_shock: "OIL",
        dxy_trend: "DXY",
        nasdaq_risk: "NDX",
        hy_spread: "HY OAS",
        regime_stretch: "MAYER",
        momentum_28d: "MOM 28D",
        net_liquidity: "NET LIQ",
        stablecoin_30d: "STABLES",
        sth_rp_regime: "STH BASIS",
        fng_contrarian: "F&G",
        mvrv_z: "MVRV-Z",
        hash_ribbons: "HASH",
        powerlaw_blend: "PWR LAW",
        dat_stress: "DAT",
        polymarket_ye: "POLYMKT",
        weekly_structure: "WKLY MA",
        halving_clock: "HALVING",
        global_m2: "M2",
        gli_phase: "GLI",
        attention_apathy: "ATTN",
        cwac_analyst: "CWAC",
        ism_regime: "ISM",
        pi_cycle: "PI CYC",
        liquidity_sweep: "LIQ SWEEP",
      };
      const sn = (id) => SHORT[id] || id.toUpperCase().slice(0, 9);
      function armed(levels, em) {
        if (
          !levels?.spot ||
          levels.high_20d == null ||
          levels.low_20d == null ||
          em == null
        )
          return null;
        let up = ((levels.high_20d - levels.spot) / levels.spot) * 100,
          down = ((levels.spot - levels.low_20d) / levels.spot) * 100,
          direction = up <= down ? "up" : "down",
          distance = Math.min(up, down);
        return distance <= Math.max(0.5 * em, 0.5)
          ? {
              armed: true,
              direction,
              distance_pct: +distance.toFixed(2),
              level: direction === "up" ? levels.high_20d : levels.low_20d,
            }
          : null;
      }
      function verdict(h, latest, scores) {
        if (!latest)
          return {
            state: "NO DATA",
            reason: "snapshot unavailable — no verdict",
          };
        if (latest.verdict?.[h]) return latest.verdict[h];
        let c = latest.composite?.[h] || {},
          s = c.score,
          r = latest.regime || {},
          e = r.next_event || {};
        if (c.abstain === true || r.event_window)
          return {
            state: "STAND ASIDE",
            reason: `EVENT WINDOW${e.name ? ` — ${e.name} ${e.date}` : ""}`,
            score: s,
          };
        if (r.hy_veto)
          return {
            state: "STAND ASIDE",
            reason: "HY VETO — credit stress override",
            score: s,
          };
        if (s == null)
          return {
            state: "NO DATA",
            reason: "snapshot unavailable — no verdict",
          };
        if (Math.abs(s) >= 20)
          return { state: s > 0 ? "LONG" : "SHORT", score: s };
        if (Math.abs(s) >= 10)
          return { state: s > 0 ? "LEAN LONG" : "LEAN SHORT", score: s };
        let a =
          h === "h24" ? armed(latest.levels, latest.expected_move?.h24) : null;
        return a
          ? { state: "WATCH TRIGGER", score: s, ...a }
          : { state: "NO TRADE", score: s };
      }
      function drivers(latest, h, n = 3) {
        return Object.entries(latest?.signals || {})
          .map(([id, s]) => ({
            id,
            v: s.score == null ? null : s.score * s[HK[h]],
          }))
          .filter((x) => x.v != null && x.v !== 0)
          .sort((a, b) => Math.abs(b.v) - Math.abs(a.v))
          .slice(0, n);
      }
      function invalid(v, L) {
        if (!L) return null;
        if (/LONG/.test(v.state))
          return Math.max(...[L.box_floor, L.low_20d].filter((x) => x != null));
        if (/SHORT/.test(v.state))
          return Math.min(
            ...[L.box_ceiling, L.high_20d].filter((x) => x != null),
          );
        return null;
      }
      function dots(s) {
        let a = Math.abs(s || 0),
          n =
            a < 10 ? 0 : a < 20 ? 1 : a < 35 ? 2 : a < 50 ? 3 : a < 70 ? 4 : 5;
        return { n, text: "●".repeat(n) + "○".repeat(5 - n) };
      }
      function brief(latest, scores) {
        if (!latest)
          return "Snapshot unavailable. No verdict. Check collector.";
        let v = verdict("h24", latest, scores),
          v7 = verdict("d7", latest, scores),
          s = latest.composite?.h24?.score,
          s7 = latest.composite?.d7?.score,
          L = latest.levels,
          a = armed(L, latest.expected_move?.h24),
          parts = [];
        if (v.state === "WATCH TRIGGER")
          parts.push(
            `Flat but armed. Price is ${a.distance_pct.toFixed(1)}% ${a.direction === "up" ? "below the 20d breakout at " + money(L.high_20d) : "above the 20d breakdown at " + money(L.low_20d)} — a daily close through it flips the 24h book ${a.direction === "up" ? "long" : "short"}.`,
          );
        else if (v.state === "NO TRADE")
          parts.push(
            `Mixed tape. 24h composite ${signed(s)} — inside the no-trade zone (±10). Nothing here justifies a day trade.`,
          );
        else if (v.state === "STAND ASIDE")
          parts.push(
            `Stand aside: ${v.reason}. The model abstains — so should the book.`,
          );
        else if (v.state.startsWith("LEAN"))
          parts.push(
            `Lean ${v.state.includes("LONG") ? "long" : "short"} on 24h (composite ${signed(s)}).`,
          );
        else
          parts.push(
            `${v.state[0] + v.state.slice(1).toLowerCase()} bias, conviction ${dots(s).n}/5 (composite ${signed(s)}).`,
          );
        if (v7.state !== v.state) {
          let iv = invalid(v7, L);
          parts.push(
            `Swing (7d): ${v7.state} at ${signed(s7)}${iv ? `, invalid ${v7.state.includes("LONG") ? "<" : ">"} ${money(iv)}` : ""}.`,
          );
        }
        let ds = drivers(latest, "d7");
        if (ds.length)
          parts.push(
            `Pushing hardest: ${ds.map((x) => `${sn(x.id)} ${signed(x.v)}`).join(", ")} (7d weights).`,
          );
        let e = (latest.calendar || [])[0];
        if (e) {
          let n = Math.ceil(
            (new Date(e.date + "T00:00:00Z") - new Date(latest.generated_at)) /
              86400000,
          );
          if (n <= 14)
            parts.push(
              `${e.name} in ${n} days (${new Date(e.date + "T00:00:00Z").toLocaleDateString("en-US", { month: "short", day: "2-digit", timeZone: "UTC" })}) — abstain window.`,
            );
        }
        let narrated = ["h24"];
        if (v7.state !== v.state) narrated.push("d7");
        let records = narrated
          .map((h) => {
            let m = scores?.composite?.[h]?.pooled;
            if (!m) return null;
            let assessment =
              m.edge_status === "SIGNIFICANT"
                ? "measured edge"
                : m.edge_status === "BELOW_BASELINE"
                  ? "below baseline"
                  : "no proven edge";
            return `${H[h]}: ${pc(m.hit_rate)} vs ${pc(m.baseline_alwaysup)} always-up (n=${m.n}; Wilson CI ${pc(m.wilson_lo)}–${pc(m.wilson_hi)}) — ${assessment}`;
          })
          .filter(Boolean);
        let trackRecord = records.length
          ? `Track record: ${records.join("; ")}.`
          : "";
        let words = parts.join(" ").split(/\s+/);
        return `${words.slice(0, 65).join(" ")}${trackRecord ? ` ${trackRecord}` : ""}`;
      }
      function streakWalk(rows, h) {
        let xs = (rows || [])
          .filter((r) => r.mode === "live")
          .sort((a, b) => b.ts.localeCompare(a.ts))
          .map((r) => r.outcomes?.[h])
          .filter((o) => o?.hit != null);
        if (!xs.length) return null;
        let hit = xs[0].hit,
          n = 0;
        for (let x of xs) {
          if (x.hit !== hit) break;
          n++;
        }
        return { n, hit };
      }
      function useJson(path) {
        const [v, setV] = useState(null),
          [bad, setBad] = useState(false);
        useEffect(() => {
          fetch(path + "?t=" + Date.now())
            .then((r) => {
              if (!r.ok) throw Error(r.status);
              return r.json();
            })
            .then(setV)
            .catch(() => setBad(true));
        }, [path]);
        return [v, bad];
      }
      function Nav() {
        return (
          <div className="nav">
            <a href="index.html">LADDER</a>
            <a className="active" href="signals.html">
              SIGNALS
            </a>
            <a href="eo.html">EO TRACKER</a>
          </div>
        );
      }
      function Gate({ go }) {
        const [p, setP] = useState("");
        let enter = () => {
          if (p === "4241") {
            sessionStorage.setItem("bql_ok", "1");
            go();
          }
        };
        return (
          <div className="shell">
            <div
              className="card"
              style={{ maxWidth: 420, margin: "18vh auto" }}
            >
              <div className="label">BTC SIGNALS</div>
              <input
                aria-label="passcode"
                type="password"
                value={p}
                onChange={(e) => setP(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && enter()}
                style={{
                  width: "100%",
                  margin: "15px 0",
                  padding: 12,
                  background: "var(--inner)",
                  color: "var(--text)",
                  border: "1px solid var(--border)",
                }}
              />
              <button onClick={enter}>ENTER</button>
            </div>
          </div>
        );
      }
      function Edge({ m }) {
        if (!m) return <span className="muted">record unavailable</span>;
        let warm = m.n < 30,
          label = warm
            ? `WARMING UP (n=${m.n})`
            : m.edge_status === "SIGNIFICANT"
              ? "EDGE"
              : m.edge_status === "BELOW_BASELINE"
                ? "BELOW BASELINE"
                : m.edge_status === "DECAYING"
                  ? "DECAYING"
                  : "NO EDGE";
        return (
          <span>
            {pc(m.hit_rate)} hit (CI {pc(m.wilson_lo)}–{pc(m.wilson_hi)}) n=
            {m.n} · vs {pc(m.baseline_alwaysup)} always-up ·{" "}
            <span
              className={`badge ${m.edge_status === "SIGNIFICANT" && !warm ? "cyan" : "gold"}`}
            >
              {label}
            </span>
          </span>
        );
      }
      function Conviction({ v, s }) {
        let directional = /LONG|SHORT/.test(v.state),
          color = v.state.includes("LONG")
            ? "var(--green)"
            : v.state.includes("SHORT")
              ? "var(--red)"
              : v.state === "WATCH TRIGGER" || v.state === "STAND ASIDE"
                ? "var(--gold)"
                : "var(--muted)",
          x = Math.max(10, Math.min(310, ((s || 0) + 100) * 1.6)),
          off = v.state === "NO DATA" || v.state === "STAND ASIDE";
        return (
          <svg viewBox="0 0 320 44" style={{ width: "100%" }}>
            <g opacity={off ? 0.35 : 1}>
              <rect
                x="0"
                y="16"
                width="128"
                height="10"
                rx="3"
                fill="rgba(239,68,68,.28)"
              />
              <rect
                x="128"
                y="16"
                width="16"
                height="10"
                fill="rgba(239,68,68,.14)"
              />
              <rect x="144" y="16" width="32" height="10" fill="#17263d" />
              <rect
                x="176"
                y="16"
                width="16"
                height="10"
                fill="rgba(52,211,153,.14)"
              />
              <rect
                x="192"
                y="16"
                width="128"
                height="10"
                rx="3"
                fill="rgba(52,211,153,.28)"
              />
              {[128, 144, 176, 192].map((z, i) => (
                <g key={z}>
                  <line x1={z} x2={z} y1="14" y2="28" stroke="var(--border)" />
                  <text
                    x={z}
                    y="40"
                    textAnchor="middle"
                    fontSize="8"
                    fill="var(--dim)"
                  >
                    {["−20", "−10", "+10", "+20"][i]}
                  </text>
                </g>
              ))}
            </g>
            {off ? (
              <text
                x="160"
                y="24"
                textAnchor="middle"
                fontSize="10"
                fill={v.state === "NO DATA" ? "var(--dim)" : "var(--gold)"}
              >
                {v.state === "NO DATA" ? "NO DATA" : "ABSTAIN — EVENT WINDOW"}
              </text>
            ) : (
              <g className="marker-g" transform={`translate(${x} 0)`}>
                <path d="M0 2 L5 10 L-5 10 Z" fill={color} />
                <line y1="10" y2="30" stroke={color} strokeWidth="1.5" />
              </g>
            )}
          </svg>
        );
      }
      function VerdictCard({ h, latest, scores, scroll }) {
        let v = verdict(h, latest, scores),
          c = latest?.composite?.[h],
          s = c?.score,
          m = scores?.composite?.[h]?.pooled,
          ds = drivers(latest, h),
          L = latest?.levels,
          iv = invalid(v, L),
          color = v.state.includes("LONG")
            ? "var(--green)"
            : v.state.includes("SHORT")
              ? "var(--red)"
              : v.state === "WATCH TRIGGER" || v.state === "STAND ASIDE"
                ? "var(--gold)"
                : "var(--muted)",
          stateLine = v.reason;
        if (v.state === "WATCH TRIGGER")
          stateLine = `ARMED · ${v.direction === "up" ? "break" : "breakdown"} ${money(v.level)} is ${fmt(v.distance_pct, 1)}% away · ${v.direction === "up" ? `Triggers > ${money(L?.high_20d)} · fails back < ${money(L?.box_floor)}` : `Triggers < ${money(L?.low_20d)} · fails back > ${money(L?.box_ceiling)}`}`;
        else if (/LONG|SHORT/.test(v.state) && iv)
          stateLine = `Flips at close ${v.state.includes("LONG") ? "<" : ">"} ${money(iv)}`;
        else if (v.state === "NO TRADE" && L)
          stateLine = `Wake me: > ${money(L.high_20d)} or < ${money(L.low_20d)}`;
        let cap = latest?.caps?.[h] ?? CAP[h];
        return (
          <div
            className={`card ${v.state === "WATCH TRIGGER" ? "armed" : ""}`}
            style={{
              borderColor: v.state.includes("LONG")
                ? "#1d4a3a"
                : v.state.includes("SHORT")
                  ? "#4a1d1d"
                  : undefined,
            }}
          >
            <div className="label">
              {H[h]} ·{" "}
              {h === "h24"
                ? "DAY TRADE"
                : h === "d7"
                  ? "SWING TRADE"
                  : "POSITION"}
            </div>
            <div
              className="verdict-word"
              style={{ fontSize: 32, fontWeight: 700, color }}
            >
              {v.state}
            </div>
            <Conviction v={v} s={s} />
            <div style={{ fontSize: 12, color }}>{dots(s).text}</div>
            <div

                          {sn(x.id)}
                        </span>
                        <div style={{ height: 12, background: "var(--inner)" }}>
                          <div
                            style={{
                              height: "100%",
                              width: `${(Math.abs(x.v) / max) * 100}%`,
                              background:
                                x.v > 0 ? "var(--green)" : "var(--red)",
                            }}
                          />
                        </div>
                        <span className={x.v > 0 ? "green" : "red"}>
                          {signed(x.v)}
                        </span>
                      </div>
                    );
                  })
                )}
                {ds.length > 8 && (
                  <button onClick={() => setAllDrivers(!allDrivers)}>
                    {allDrivers ? "SHOW TOP 8" : `SHOW ALL ${ds.length}`}
                  </button>
                )}
              </div>
            </section>
            <details ref={drill} className="section card">
              <summary>SIGNAL DRILL-DOWN</summary>
              <div className="scroll">
                <table>
                  <thead>
                    <tr>
                      <th>SIGNAL / EVIDENCE</th>
                      <th>PILLAR</th>
                      <th>READING</th>
                      <th>SCORE</th>
                      <th>WEIGHTS</th>
                      <th>MEASURED RECORD</th>
                      <th>STATUS</th>
                    </tr>
                  </thead>
                  <tbody>
                    {Object.entries(sigs).map(([id, s]) => {
                      let m = scores?.signals?.[id]?.[hz]?.pooled,
                        mm = meta?.[id],
                        ver = weights?.rules?.[id]?.version;
                      return (
                        <tr key={id}>
                          <td>
                            <details>
                              <summary>{id}</summary>
                              <div className="muted">
                                definition {ver || "—"} ·{" "}
                                {mm?.definition || "Metadata unavailable"} ·
                                evidence: {mm?.evidence_grade || "—"}
                                <br />
                                Definition changes freeze the prior ledger
                                series — no silent retunes.
                              </div>
                            </details>
                          </td>
                          <td>{s.pillar}</td>
                          <td>{s.reading}</td>
                          <td>
                            <span
                              className={`badge ${s.score > 0 ? "green" : s.score < 0 ? "red" : ""}`}
                            >
                              {s.score ?? "—"}
                            </span>
                          </td>
                          <td>
                            {s.weight_24h}/{s.weight_7d}/{s.weight_30d}
                          </td>
                          <td>
                            {(m?.n || 0) < 30 ? (
                              <span className="gold">
                                WARMING UP (n={m?.n || 0})
                              </span>
                            ) : (
                              `${pc(m.hit_rate)} (CI ${pc(m.wilson_lo)}–${pc(m.wilson_hi)}) n=${m.n} · Brier ${fmt(m.brier, 3)}`
                            )}
                          </td>
                          <td>
                            {(m?.n || 0) >= 30 && (
                              <>
                                <span className="badge">
                                  {s.status === "INCUBATING"
                                    ? "INCUBATING w=0"
                                    : m.edge_status || s.status}
                                </span>
                                {m.edge_status === "DECAYING" && (
                                  <span className="badge gold">
                                    RETIREMENT WATCH
                                  </span>
                                )}
                              </>
                            )}
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
                {!latest && (
                  <div className="placeholder">Signal snapshot unavailable</div>
                )}
              </div>
            </details>
            <details className="section card">
              <summary>
                LEDGER EXPLORER · LAST 60 ·{" "}
                {rows.filter((r) => r.outcomes?.[hz]?.hit).length}/
                {rows.filter((r) => r.outcomes?.[hz]?.hit != null).length} hit
              </summary>
              <div className="tabs">
                <select value={hz} onChange={(e) => setHz(e.target.value)}>
                  {Object.keys(H).map((h) => (
                    <option value={h}>{H[h]}</option>
                  ))}
                </select>
                <select value={mode} onChange={(e) => setMode(e.target.value)}>
                  <option>live</option>
                  <option>backtest</option>
                </select>
              </div>
              <div className="scroll">
                <table>
                  <thead>
                    <tr>
                      <th>TIME</th>
                      <th>HORIZON</th>
                      <th>COMPOSITE</th>
                      <th>CAPPED P(UP)</th>
                      <th>TILT</th>
                      <th>RETURN</th>
                      <th>RESULT</th>
                    </tr>
                  </thead>
                  <tbody>
                    {rows.map((r) => {
                      let o = r.outcomes?.[hz],
                        c = r.composite?.[hz] || {};
                      return (
                        <tr key={r.ts}>
                          <td>{r.ts}</td>
                          <td>{H[hz]}</td>
                          <td>{fmt(c.score, 1)}</td>
                          <td title="probability cap by design">
                            {pc(c.p_up)} / {pc(latest?.caps?.[hz] ?? CAP[hz])}{" "}
                            by design
                          </td>
                          <td>{c.tilt}</td>
                          <td>{o ? pc(o.ret) : "pending"}</td>
                          <td>
                            <span
                              className={`badge ${o?.hit ? "green" : o?.hit === false ? "red" : ""}`}
                            >
                              {o?.abstained
                                ? "ABSTAIN"
                                : o?.hit === true
                                  ? "HIT"
                                  : o?.hit === false
                                    ? "MISS"
                                    : "PENDING"}
                            </span>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
                {lebad && <div className="placeholder">Ledger unavailable</div>}
              </div>
            </details>
            <details className="section card">
              <summary>CALIBRATION</summary>
              {(scores?.composite?.h24?.pooled?.n || 0) < 50 ? (
                <div className="placeholder">needs ≥50 resolved calls</div>
              ) : (
                <div className="grid g3">
                  {Object.keys(H).map((h) => (
                    <div className="inner">
                      <div className="label">
                        {H[h]} reliability · 5% buckets
                      </div>
                      <Calibration bins={scores?.calibration?.[h]?.pooled} />
                    </div>
                  ))}
                </div>
              )}
            </details>
            <details className="section card">
              <summary>
                SIGNAL GRAVEYARD ({weights?.retired?.length || 0})
              </summary>
              {(weights?.retired || []).map((x) => (
                <div
                  className="inner"
                  key={x.id}
                  style={{ opacity: 0.65, borderStyle: "dashed", marginTop: 8 }}
                >
                  <div className="label">
                    † {x.id} · retired {x.retired}
                  </div>
                  <div className="muted" style={{ fontSize: 10 }}>
                    {x.reason}
                  </div>
                </div>
              ))}
            </details>
            <section className="section">
              <h2>NEWS CONTEXT · NOT A SIGNAL</h2>
              <div className="card">
                {news?.headlines?.slice(0, expanded ? 30 : 5).map((x) => (
                  <div
                    key={x.url}
                    style={{
                      padding: "7px 0",
                      borderBottom: "1px solid var(--border)",
                    }}
                  >
                    <a href={x.url} target="_blank" rel="noreferrer">
                      {x.title}
                    </a>{" "}
                    <span className="muted">· {x.source}</span>
                  </div>
                ))}
                {nbad && (
                  <div className="placeholder">Headlines unavailable</div>
                )}
                <button onClick={() => setExpanded(!expanded)}>
                  {expanded ? "SHOW LESS" : "SHOW ALL"}
                </button>
              </div>
            </section>
            <details className="section card footer">
              <summary>THE CONTRACT</summary>
              <p>
                Aggregation: each composite is a weighted sum normalized over
                available live signals, then volatility-gated. Probability caps
                are {Object.keys(H).map((h) => `${H[h]} ${pc(latest?.caps?.[h] ?? CAP[h])}`).join(" / ")} because small historical
                edges do not justify false certainty. Calls require ±10; verdict
                deadbands and realized-window deadbands are separate.
              </p>
              <p>
                Decided-window scoring counts a directional hit only when both
                the call and realized move clear their thresholds. Every rate
                carries Wilson 95% CI and n. Always-up climatology is the
                baseline to beat, not an assumed 50% coin flip.
              </p>
              <p>
                Admission: Incubating weight-0 → Live only through the Wilson
                gate at n≥385 → Graveyard when evidence dies. Definition changes
                freeze the prior ledger series — no silent retunes.
              </p>
              <p>
                Verdict zones: STAND ASIDE (abstain/event/HY veto) &gt;
                LONG/SHORT (|score|≥20) &gt; LEAN (10–20) &gt; WATCH TRIGGER
                (&lt;10 but near a 20d breakout) &gt; NO TRADE (&lt;10). The cap
                is an honesty device, not a bug.
              </p>
              <p>
                CHANGELOG · v1 2026-07-18 ship · v2 2026-07-19 verdict engine
              </p>
              <p>Personal research tool. Not financial advice.</p>
            </details>
          </div>
        );
      }
      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
