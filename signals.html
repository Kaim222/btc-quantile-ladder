<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>BTC Signals</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23020817'/%3E%3Cpath d='M14 48 L14 42 L20 42 L20 22 L14 22 L14 16 L22 16 L22 10 L28 10 L28 16 L32 16 L32 10 L38 10 L38 16.5 Q46 17.5 46 24 Q46 29 42 30.5 Q48 32 48 38.5 Q48 46 38 47.5 L38 54 L32 54 L32 48 L28 48 L28 54 L22 54 L22 48 Z' fill='%23facc15'/%3E%3C/svg%3E">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<style>@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap');*{box-sizing:border-box}body{margin:0;background:#020817;color:#e2e8f0;font-family:'JetBrains Mono','Courier New',monospace}:root{--bg:#020817;--card:#070f1f;--inner:#040c1a;--border:#0f2035;--text:#e2e8f0;--muted:#8aaac8;--dim:#5a7fa0;--cyan:#22d3ee;--gold:#facc15;--red:#ef4444;--green:#34d399}button,select{font:inherit}a{color:var(--cyan)}.shell{max-width:1300px;margin:auto;padding:22px}.nav{display:flex;gap:22px;margin-bottom:22px;border-bottom:1px solid var(--border)}.nav a{padding:9px 2px;text-decoration:none;font-size:11px;letter-spacing:.16em;color:var(--muted)}.nav .active{color:var(--gold);border-bottom:2px solid var(--gold)}.grid{display:grid;gap:12px}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:15px}.inner{background:var(--inner);border:1px solid var(--border);border-radius:6px;padding:10px}.label{font-size:10px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase}.value{font-size:20px;font-weight:700;margin-top:5px}.section{margin-top:20px}.section h2{font-size:12px;color:var(--muted);letter-spacing:.14em;margin:0 0 10px}.strip{display:flex;gap:14px;overflow:auto}.badge{display:inline-block;border:1px solid var(--border);border-radius:12px;padding:3px 7px;font-size:9px;white-space:nowrap}.gold{color:var(--gold);border-color:#6a5b15}.green{color:var(--green)}.red{color:var(--red)}.muted{color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:10px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--border);vertical-align:top}th{color:var(--dim);letter-spacing:.08em}.scroll{overflow:auto}.tabs button{background:transparent;color:var(--muted);border:1px solid var(--border);padding:6px 10px}.tabs .on{color:var(--gold);border-color:var(--gold)}details summary{cursor:pointer;color:var(--cyan)}.placeholder{color:var(--dim);padding:18px;text-align:center}.bar{height:13px;background:var(--inner);position:relative;border-radius:3px;overflow:hidden}.bar i{position:absolute;height:100%;left:50%}.news a{text-decoration:none}.stale{border:1px solid var(--gold);padding:8px;color:var(--gold);font-size:10px;margin-top:10px}.footer{font-size:10px;line-height:1.7;color:var(--muted)}::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#162840}</style></head>
<body><div id="root"></div><script type="text/babel" data-presets="react">
const {useEffect,useState}=React; const H={h24:"24H",d7:"7D",d30:"30D"};
const fmt=(x,d=0)=>x==null?"—":Number(x).toFixed(d); const pc=x=>x==null?"—":`${(100*x).toFixed(0)}%`;
function Nav(){return <div className="nav"><a href="index.html">LADDER</a><a className="active" href="signals.html">SIGNALS</a></div>}
function useJson(path){const [v,setV]=useState(null),[bad,setBad]=useState(false);useEffect(()=>{fetch(path+"?t="+Date.now()).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(setV).catch(()=>setBad(true))},[path]);return [v,bad]}
function Tile({label,children}){return <div className="card"><div className="label">{label}</div><div className="value">{children}</div></div>}
function Stat({m}){if(!m)return <span className="badge">NO DATA</span>;let text=m.n<30?`WARMING UP (n=${m.n})`:m.edge_status==="SIGNIFICANT"?`EDGE (CI ${pc(m.wilson_lo)}-${pc(m.wilson_hi)})`:m.edge_status==="DECAYING"?"DECAYING":m.edge_status==="BELOW_BASELINE"?"BELOW BASELINE":"NO EDGE YET";return <div style={{fontSize:10,color:"var(--muted)"}}>{m.n?`${pc(m.hit_rate)} on decided calls (CI ${pc(m.wilson_lo)}-${pc(m.wilson_hi)}) · called ${pc(m.call_rate)} of windows · always-up ${pc(m.baseline_alwaysup)} · `:""}<span className="badge gold">{text}</span></div>}
function Gauge({h,c,move,m}){let s=c?.score||0,a=-90+(s+100)*.9;return <div className="card"><div className="label">{H[h]}</div><svg viewBox="0 0 200 112" style={{width:"100%"}}><path d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="#162840" strokeWidth="18"/><path d="M93 20 A80 80 0 0 1 107 20" fill="none" stroke="#6a5b15" strokeWidth="20"/><line x1="100" y1="100" x2="100" y2="30" stroke={s>=20?"#34d399":s<=-20?"#ef4444":"#facc15"} strokeWidth="3" transform={`rotate(${a} 100 100)`}/><circle cx="100" cy="100" r="5" fill="#e2e8f0"/></svg><div style={{textAlign:"center",marginTop:-8}}><div className={c?.tilt==="BULL"?"green":c?.tilt==="BEAR"?"red":"gold"} style={{fontSize:22,fontWeight:700}}>{c?.tilt||"—"}</div><div>P(up) {c?pc(c.p_up):"—"} {c&&"(capped)"}</div><div className="muted" style={{fontSize:10,margin:"5px 0 10px"}}>±{fmt(move,1)}% typical {H[h].toLowerCase()} move</div><Stat m={m}/></div></div>}
function Spark({m}){let r=m?.rolling90||[]; if(!r.length)return <div className="placeholder">No resolved observations yet</div>;let pts=r.map((x,i)=>`${i/(r.length-1||1)*300},${100-(x.hit_rate-.3)/.4*100}`).join(" ");return <svg viewBox="0 0 300 110" style={{width:"100%"}}><rect x="0" y="37" width="300" height="26" fill="#0f203566"/><line x1="0" y1="50" x2="300" y2="50" stroke="#facc15" strokeDasharray="4 4"/><polyline points={pts} fill="none" stroke="#22d3ee" strokeWidth="2"/></svg>}
function Calibration({bins}){let pts=bins||[];return <svg viewBox="0 0 220 130" style={{width:'100%'}}><line x1="25" y1="110" x2="205" y2="110" stroke="#5a7fa0"/><line x1="25" y1="110" x2="25" y2="10" stroke="#5a7fa0"/><line x1="25" y1="110" x2="205" y2="10" stroke="#5a7fa0" strokeDasharray="4 4"/>{pts.map(x=><circle key={x.p_up} cx={25+x.p_up*180} cy={110-x.realized_up*100} r={Math.min(8,2+Math.sqrt(x.n))} fill="#22d3ee"><title>{pc(x.p_up)} predicted · {pc(x.realized_up)} realized · n={x.n}</title></circle>)}<text x="85" y="127" fill="#5a7fa0" fontSize="8">PREDICTED P(UP)</text></svg>}
function App(){const [ok,setOk]=useState(sessionStorage.getItem('bql_ok')==='1'),[pin,setPin]=useState(''),[latest,lbad]=useJson('data/latest.json'),[scores,sbad]=useJson('data/scores.json'),[ledger,lebad]=useJson('data/ledger_recent.json'),[news,nbad]=useJson('data/news.json'),[meta]=useJson('config/signals-meta.json'),[hz,setHz]=useState('h24'),[mode,setMode]=useState('live'),[expanded,setExpanded]=useState(false),[live,setLive]=useState({});
useEffect(()=>{Promise.allSettled([fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd&include_24hr_change=true').then(r=>r.json()),fetch('https://api.alternative.me/fng/?limit=2').then(r=>r.json()),fetch('https://www.okx.com/api/v5/public/funding-rate?instId=BTC-USDT-SWAP').then(r=>r.json())]).then(x=>setLive({cg:x[0].value?.bitcoin,fg:x[1].value?.data?.[0],fund:x[2].value?.data?.[0]}))},[]);
if(!ok)return <div style={{minHeight:'100vh',display:'grid',placeItems:'center'}}><div style={{textAlign:'center'}}><div className="label" style={{marginBottom:25}}>BTC SIGNALS</div><input type="password" value={pin} onChange={e=>setPin(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&pin==='4241'){sessionStorage.setItem('bql_ok','1');setOk(true)}}} style={{background:'#070f1f',border:'1px solid #0f2a42',color:'#facc15',padding:12,textAlign:'center',font:'inherit'}}/><br/><button onClick={()=>{if(pin==='4241'){sessionStorage.setItem('bql_ok','1');setOk(true)}}} style={{marginTop:14,background:'#070f1f',border:'1px solid #1a3a5c',color:'#8aaac8',padding:'9px 22px'}}>ENTER</button></div></div>;
let stale=latest&&Date.now()-new Date(latest.generated_at)>12*3600000, rows=(ledger||[]).filter(r=>r.mode===mode&&r.composite?.[hz]).slice(-60).reverse(), prev=(ledger||[]).slice(-2,-1)[0], sigs=latest?.signals||{};let wk={h24:'weight_24h',d7:'weight_7d',d30:'weight_30d'}[hz],contributions=Object.entries(sigs).map(([id,s])=>[id,s.score,(s[wk]||0)]).filter(x=>x[2]);
return <div className="shell"><Nav/><header><div className="label">Continuous, self-scoring direction model</div><h1 style={{margin:'5px 0'}}>BTC SIGNALS</h1><div className="grid g3"><Tile label="Live BTC"><span className={(live.cg?.usd_24h_change||0)>=0?'green':'red'}>${live.cg?.usd?.toLocaleString()||'—'} · {fmt(live.cg?.usd_24h_change,1)}%</span></Tile><Tile label="Fear & Greed">{live.fg?`${live.fg.value} · ${live.fg.value_classification}`:'—'}</Tile><Tile label="OKX Funding">{live.fund?`${(Number(live.fund.fundingRate)*100).toFixed(4)}%`:'—'}</Tile></div><div className="label" style={{marginTop:8}}>Snapshot {latest?.generated_at||'unavailable'}</div>{stale&&<div className="stale">SNAPSHOT STALE — collector may have failed</div>}{lbad&&<div className="stale">Latest snapshot unavailable — other sections remain usable.</div>}</header>
<section className="section card strip"><span className="label">REGIME</span><span>VOL {latest?.regime?.vol_gate?.state||'—'} ×{latest?.regime?.vol_gate?.multiplier||'—'}</span><span>DVOL {latest?.regime?.dvol_flag||'—'}</span><span>EVENT {latest?.regime?.event_window?`${latest.regime.next_event?.name} ${latest.regime.next_event?.date}`:'CLEAR'}</span><span>HY VETO {latest?.regime?.hy_veto?'ON':'OFF'}</span><span>{latest?.regime?.halving_month||'HALVING —'}</span><span>PL FLOOR {latest?.regime?.pl_floor_watch?'WATCH':'CLEAR'}</span></section>
<section className="section"><h2>COMPOSITE GAUGES</h2><div className="grid g3">{Object.keys(H).map(h=><Gauge key={h} h={h} c={latest?.composite?.[h]} move={latest?.expected_move?.[h]} m={scores?.composite?.[h]?.live}/>)}</div></section>
<section className="section card"><h2>WHAT CHANGED</h2>{!latest||!prev?<div className="placeholder">Needs two snapshots</div>:<>{Object.keys(H).map(h=><div key={h}>{H[h]} composite {(latest.composite[h].score-prev.composite[h].score)>=0?'+':''}{fmt(latest.composite[h].score-prev.composite[h].score,1)}</div>)}{Object.entries(sigs).filter(([id,s])=>prev.signals?.[id]?.score!==s.score).map(([id,s])=><div key={id}>{id}: {prev.signals?.[id]?.score??'—'} → {s.score??'—'}</div>)}</>}</section>
<section className="section"><h2>PILLAR WATERFALL</h2><div className="tabs">{Object.keys(H).map(h=><button className={hz===h?'on':''} onClick={()=>setHz(h)}>{H[h]}</button>)}</div><div className="card">{contributions.map(([id,s,w])=>{let v=s*w;return <div key={id} style={{display:'grid',gridTemplateColumns:'180px 1fr 50px',gap:8,margin:7}}><span>{id}</span><div className="bar"><i style={{width:`${Math.min(50,Math.abs(v)*12)}%`,left:v<0?`${50-Math.min(50,Math.abs(v)*12)}%`:'50%',background:v>=0?'#34d399':'#ef4444'}}/></div><span>{v>0?'+':''}{fmt(v,1)}</span></div>})}</div></section>
<section className="section"><h2>SIGNAL DRILL-DOWN</h2><div className="card scroll"><table><thead><tr><th>SIGNAL / EVIDENCE</th><th>PILLAR</th><th>READING</th><th>SCORE</th><th>WEIGHTS</th><th>MEASURED RECORD</th><th>STATUS</th></tr></thead><tbody>{Object.entries(sigs).map(([id,s])=>{let m=scores?.signals?.[id]?.[hz]?.pooled,mm=meta?.[id];return <tr key={id}><td><details><summary>{id}</summary><div className="muted">{mm?.definition||'Metadata unavailable'} · evidence: {mm?.evidence_grade||'—'} {mm?.published_not_ours&&'· published, not ours'}<br/>{mm?.source_url&&<a href={mm.source_url} target="_blank" rel="noreferrer">source</a>}</div></details></td><td>{s.pillar}</td><td>{s.reading}</td><td><span className={`badge ${s.score>0?'green':s.score<0?'red':''}`}>{s.score??'—'}</span></td><td>{s.weight_24h}/{s.weight_7d}/{s.weight_30d}</td><td>{m&&m.n>=30?`${pc(m.hit_rate)} (${pc(m.wilson_lo)}–${pc(m.wilson_hi)}) n=${m.n} · Brier ${fmt(m.brier,3)}`:m?.n?`warming up (n=${m.n})`:'warming up'}</td><td><span className="badge">{s.status==='INCUBATING'?'INCUBATING w=0':m?.edge_status||s.status}</span></td></tr>})}</tbody></table>{!latest&&<div className="placeholder">Signal snapshot unavailable</div>}</div></section>
<section className="section"><h2>EDGE VS COIN FLIP · ROLLING 90 OBSERVATIONS</h2><div className="grid g3">{Object.keys(H).map(h=><div className="card"><div className="label">{H[h]}</div><Spark m={scores?.composite?.[h]?.pooled}/></div>)}</div></section>
<section className="section card"><h2>CALIBRATION</h2>{(scores?.composite?.h24?.pooled?.n||0)<50?<div className="placeholder">needs ≥50 resolved calls</div>:<div className="grid g3">{Object.keys(H).map(h=><div className="inner" key={h}><div className="label">{H[h]} reliability · 5% buckets</div><Calibration bins={scores?.calibration?.[h]?.pooled}/></div>)}</div>}</section>
<section className="section"><h2>LEDGER EXPLORER · LAST 60</h2><div className="tabs"><select value={hz} onChange={e=>setHz(e.target.value)}>{Object.keys(H).map(h=><option value={h}>{H[h]}</option>)}</select><select value={mode} onChange={e=>setMode(e.target.value)}><option>live</option><option>backtest</option></select></div><div className="card scroll"><table><thead><tr><th>TIME</th><th>HORIZON</th><th>COMPOSITE</th><th>P(UP)</th><th>TILT</th><th>RETURN</th><th>RESULT</th></tr></thead><tbody>{rows.map(r=>{let o=r.outcomes?.[hz],c=r.composite[hz];return <tr key={`${r.ts}-${hz}`}><td>{r.ts}</td><td>{H[hz]}</td><td>{fmt(c.score,1)}</td><td>{pc(c.p_up)}</td><td>{c.tilt}</td><td>{o?pc(o.ret):'pending'}</td><td><span className={`badge ${o?.hit?'green':o?.hit===false?'red':''}`}>{o?.abstained?'ABSTAIN':o?.hit===true?'HIT':o?.hit===false?'MISS':o?.realized_class==='NO_DECISION'?'NO DECISION':o?.call==='NEUTRAL'?'NO CALL':'PENDING'}</span></td></tr>})}</tbody></table>{lebad&&<div className="placeholder">Ledger unavailable</div>}</div></section>
<section className="section"><h2>NEWS CONTEXT · NOT A SIGNAL</h2><div className="card news">{news?.headlines?.slice(0,expanded?30:8).map(x=><div style={{padding:'7px 0',borderBottom:'1px solid var(--border)'}}><a href={x.url} target="_blank" rel="noreferrer">{x.title}</a> <span className="muted">· {x.source} · {Math.max(0,Math.round((Date.now()-new Date(x.published_at))/3600000))}h</span></div>)}{nbad&&<div className="placeholder">Headlines unavailable</div>}<button onClick={()=>setExpanded(!expanded)}>{expanded?'SHOW LESS':'SHOW ALL'}</button><div className="strip" style={{marginTop:12}}><a href="https://x.com/DeItaone">@DeItaone on X</a><a href="https://x.com/Tree_of_Alpha">@Tree_of_Alpha</a><a href="https://farside.co.uk/btc/">Farside ETF flows</a><a href="https://www.coinglass.com/LiquidationData">CoinGlass liquidations</a></div></div></section>
<footer className="section card footer"><h2>METHODOLOGY</h2><p>Composite calls UP/DOWN only at score ±10; signals call at |score|≥1. Gauge labels: BULL/BEAR beyond ±20, LEAN UP/DOWN between ±10 and ±20 (leans are scored as directional calls), FLAT inside ±10. Realized windows decide only beyond ±0.75% / ±2% / ±5%. Event-window ABSTAIN forces a neutral call.</p><p>Directional hit rate uses only windows with both a directional call and directional realized move. Call rate and decided rate expose coverage; Brier uses decided windows only. Backtest and live remain distinct and pooled.</p><p><a href="https://github.com/kaim222/btc-quantile-ladder">Repository</a> · Personal research tool. Not financial advice.</p></footer></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script><script>function applyMobileStyles(){const old=document.getElementById('m');if(innerWidth>700){if(old)old.remove();return}if(old)return;const s=document.createElement('style');s.id='m';s.textContent='.g3,.g4{grid-template-columns:1fr!important}.shell{padding:10px}.card{padding:10px}th,td{white-space:nowrap}.section{margin-top:14px}';document.head.appendChild(s)}const _observer=new MutationObserver(applyMobileStyles);_observer.observe(document.getElementById('root'),{childList:true,subtree:false});addEventListener('resize',applyMobileStyles);addEventListener('load',applyMobileStyles)</script></body></html>
