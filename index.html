// Derive SEED_PRICES as ["YYYY-MM", price] pairs from BTC_HISTORY for chart merge
const SEED_PRICES = BTC_HISTORY.map(({days, price}) => {
  const d = new Date(GENESIS.getTime() + days * 86400000);

// Fit EMA-weighted power law regression. halfLifeDays=Infinity → Kaim fixed.
function fitEMA(halfLifeDays) {
  if (!halfLifeDays || halfLifeDays >= 1e9) return { A: JV_A, B: JV_B };
  const todayDays = (Date.now() - GENESIS_MS) / 86400000;
  let sw=0, swx=0, swy=0, swxx=0, swxy=0;
  for (const {days, price} of BTC_HISTORY) {
    const age = todayDays - days;
    const w = Math.exp(-Math.LN2 * age / halfLifeDays);
    const x = Math.log10(days);
    const y = Math.log10(price);
    sw   += w;
    swx  += w * x;
    swy  += w * y;
    swxx += w * x * x;
    swxy += w * x * y;
  }
  const denom = sw * swxx - swx * swx;
  if (Math.abs(denom) < 1e-12) return { A: JV_A, B: JV_B };
  const A = (sw * swxy - swx * swy) / denom;
  const B = (swy - A * swx) / sw;
  return { A, B };
}

function daysFromGenesis(ts) {
  return (ts - GENESIS_MS) / 86400000;
}
function fairValueAt(ts, A=JV_A, B=JV_B) {
  const d = daysFromGenesis(ts);
  return d > 0 ? Math.pow(10, A * Math.log10(d) + B) : 0;
}

// Band offsets — upper bands decay linearly over time (empirical fit)
// offset(days) = m * days + c  for 99.9%, 95%, 85%
// constant for 50%, 15%, 0.1%
// Upper bands: cap decay at today's day count (matches Excel MIN(days,today) fix)
// Without this, 99.9th crosses below 95th at ~day 9578 and 85th hits 50th at ~day 9171
const TODAY_DAYS = (Date.now() - GENESIS_MS) / 86400000;
function bandOffset(mSlope, cIntercept, ts) {
  const days = (ts - GENESIS_MS) / 86400000;
  // For decaying bands (m < 0), cap at today's value so projections don't collapse
  const effectiveDays = mSlope < 0 ? Math.min(days, TODAY_DAYS) : days;
  return mSlope * effectiveDays + cIntercept;
}

const BAND_DEFS = [
  { q: 99.9, m: -0.0000756204, c:  0.7434,  label: "99.9%", color: "#3b82f6", dash: "2,4", w: 0.8, dim: true },

// BANDS with offset computed at current time (for gauge/quantile calc)
const BANDS = BAND_DEFS.map(b => ({ ...b, offset: bandOffset(b.m, b.c, Date.now()) }));

function bandPriceAt(ts, bandDef, A=JV_A, B=JV_B) {
  const offset = bandOffset(bandDef.m, bandDef.c, ts);
  return fairValueAt(ts, A, B) * Math.pow(10, offset);
}

function priceToQuantile(price, ts, A=JV_A, B=JV_B) {
  const fv = fairValueAt(ts, A, B);
  if (!fv || price <= 0) return 50;
  const res = Math.log10(price / fv);
  // Compute offsets fresh for the given timestamp (upper bands decay over time)
  const bands = BAND_DEFS.map(b => ({ ...b, offset: bandOffset(b.m, b.c, ts) }));
  // Interpolate between calibration points
  for (let i = 0; i < bands.length - 1; i++) {
    const hi = bands[i], lo = bands[i + 1];
    if (res <= hi.offset && res >= lo.offset) {
      const t = (res - lo.offset) / (hi.offset - lo.offset);
      return lo.q + t * (hi.q - lo.q);
    }
  }
  if (res > bands[0].offset) {
    // Above 99.9th — extrapolate
    const slope = (bands[0].q - bands[1].q) / (bands[0].offset - bands[1].offset);
    return Math.min(99.99, bands[0].q + slope * (res - bands[0].offset));
  }
  // Below 0.1st — extrapolate
  const slope = (bands[bands.length-2].q - bands[bands.length-1].q) /
                (bands[bands.length-2].offset - bands[bands.length-1].offset);
  return Math.max(0.01, bands[bands.length-1].q + slope * (res - bands[bands.length-1].offset));
}

// ─────────────────────────────────────────────────────────────────────────────
// INSTRUMENT LADDER
// ─────────────────────────────────────────────────────────────────────────────
// Quantile → price at any date (inverse of priceToQuantile; interpolates band offsets)
function quantileToPrice(qq, ts, A=JV_A, B=JV_B) {
  const fv = fairValueAt(ts, A, B);
  const bands = BAND_DEFS.map(b => ({ q: b.q, offset: bandOffset(b.m, b.c, ts) }));
  let offset;
  if (qq >= bands[0].q) {
    const s = (bands[0].offset - bands[1].offset) / (bands[0].q - bands[1].q);
    offset = bands[0].offset + s * (qq - bands[0].q);
  } else if (qq <= bands[bands.length-1].q) {
    const a = bands[bands.length-2], z = bands[bands.length-1];
    const s = (a.offset - z.offset) / (a.q - z.q);
    offset = z.offset + s * (qq - z.q);
  } else {
    for (let i = 0; i < bands.length - 1; i++) {
      const hi = bands[i], lo = bands[i+1];
      if (qq <= hi.q && qq >= lo.q) {
        const t = (qq - lo.q) / (hi.q - lo.q);
        offset = lo.offset + t * (hi.offset - lo.offset);
        break;
      }
    }
  }
  return fv * Math.pow(10, offset);
}

function getTier(q) {
  const idx = LADDER.findIndex(t => q >= t.qMin && q < t.qMax);
  const i = idx >= 0 ? idx : (q >= LADDER[0].qMax ? 0 : LADDER.length - 1);
  return { tier: LADDER[i], idx: i };
}

// Strike computation for a pmcc tier at a given "now"
function tierStrikes(t, nowTs, A=JV_A, B=JV_B) {
  if (t.kind !== "pmcc") return null;
  const longTs  = addMonths(nowTs, t.longMo);
  const shortTs = addMonths(nowTs, t.shortMo);
  return {
    long:  { q: t.longQ,  ts: longTs,  price: quantileToPrice(t.longQ,  longTs,  A, B), mo: t.longMo },
    short: { q: t.shortQ, ts: shortTs, price: quantileToPrice(t.shortQ, shortTs, A, B), mo: t.shortMo },
  };
}

// Margin framework math (per $1 equity): position = L, borrowed = L-1
function marginStats(m) {
  const carry = m.leverage * m.yield - (m.leverage - 1) * m.rate;           // net carry on equity
  const callDD = 1 - (m.leverage - 1) / (m.leverage * (1 - m.maint));      // drawdown to margin call
  return { carry, callDD, callPx: 100 * (1 - callDD) };
}

            <div key={c.label} style={{padding:"4px 7px",fontSize:"11px",
              color:c.label==="1yr ago"||c.label==="6mo ago"?"#4a6a80":"#a0b8cc",
              textAlign:"center",fontWeight:600,letterSpacing:"0.06em",textTransform:"uppercase"}}>
              {c.label}
            </div>
          ))}
          {/* rows */}
          {displayBands.map(q=>{
            const band = BANDS.find(b=>b.q===q);
            const isFV = q===50;
            const rowColor = band.color;
            return [
              <div key={q+"label"} style={{padding:"5px 6px",borderBottom:"1px solid #070f1f",
                color:rowColor,fontWeight:700,fontSize:"11px"}}>{band.label}</div>,
              ...cols.map(c=>{
                const p = bandPriceAt(c.ts, band, modelA, modelB);
                const isPast = c.label==="1yr ago"||c.label==="6mo ago";
                return (
                  <div key={q+c.label} style={{padding:"5px 6px",borderBottom:"1px solid #070f1f",
                    textAlign:"center",
                    color: isPast?"#3a5a70" : isFV?"#38bdf8":"#7a9ab8",
                    background: isFV&&!isPast?"#061628":"transparent",
                    fontWeight: isFV&&!isPast?600:400}}>
                    {fmt(p)}
                  </div>
                );
              })
            ];
          })}
        </div>
      </div>
    </div>
  );
}

// PRICE LOOKUP
// ─────────────────────────────────────────────────────────────────────────────
function thirdFriday(year, month) { // month 0-11, returns UTC ts
  const first = new Date(Date.UTC(year, month, 1));
  const dow = first.getUTCDay();
  const firstFri = 1 + ((5 - dow + 7) % 7);
  return Date.UTC(year, month, firstFri + 14);
}
function isThirdFriday(ts) {
  const d = new Date(ts);
  return thirdFriday(d.getUTCFullYear(), d.getUTCMonth()) === ts;
}
function nextOpex(ts, dir) { // dir +1 / -1: nearest monthly opex strictly beyond ts
  const d = new Date(ts);
  let y = d.getUTCFullYear(), m = d.getUTCMonth();
  for (let i = 0; i < 24; i++) {
    const tf = thirdFriday(y, m);
    if (dir > 0 && tf > ts) return tf;
    if (dir < 0 && tf < ts) return tf;
    m += dir;
    if (m > 11) { m = 0; y++; }
    if (m < 0)  { m = 11; y--; }
  }
  return ts;
}
const tsToDateStr = ts => new Date(ts).toISOString().slice(0, 10);

function priceOn(history, ts) {
  // nearest historical point within tolerance (10d daily era, 40d monthly seed era)
  if (!history || !history.length) return null;
  let best = null, bd = Infinity;
  for (const [t, p] of history) {
    const d = Math.abs(t - ts);
    if (d < bd) { bd = d; best = [t, p]; }
  }
  if (!best) return null;
  const tol = best[0] > Date.parse("2025-08-01") ? 10 : 40;
  return bd <= tol * 86400000 ? { ts: best[0], price: best[1] } : null;
}

function lookupDefaultDate() {
  try {
    const saved = localStorage.getItem("lookupDate");
    if (saved && Date.parse(saved + "T00:00:00Z") > Date.now()) return saved;
  } catch(_) {}
  return tsToDateStr(nextOpex(Date.now(), 1));
}

function PriceLookup({ btcPrice, liveHistory, dateStr, setDateStr, modelA=JV_A, modelB=JV_B }) {
  useEffect(() => {
    try { localStorage.setItem("lookupDate", dateStr); } catch(_) {}
  }, [dateStr]);
  const selTs = dateStr ? Date.parse(dateStr + "T00:00:00Z") : NaN;
  const stepOpex = (dir) => { if (!isNaN(selTs)) setDateStr(tsToDateStr(nextOpex(selTs, dir))); };
  const results = useMemo(() => {
    if (!dateStr) return null;
    const d = new Date(dateStr + "T00:00:00Z");
    if (isNaN(d)) return null;
    const days = (d.getTime() - GENESIS_MS) / 86400000;
    if (days <= 0) return null;
    const now = new Date();
    const daysFromNow = Math.round((d.getTime() - now.getTime()) / 86400000);
    const bands = [...BAND_DEFS].reverse().map(b => {
      const offset = bandOffset(b.m, b.c, d.getTime());
      const price = Math.pow(10, modelA * Math.log10(days) + modelB + offset);
      return { label: b.label, price, color: b.color, q: b.q };
    });
    return { bands, daysFromNow, days: Math.round(days), ts: d.getTime() };
  }, [dateStr, modelA, modelB]);

  const inputStyle = {
    background:"#070f1f", border:"1px solid #0f2a42", borderRadius:"4px",
    color:"#facc15", fontSize:"14px", fontFamily:"inherit", fontWeight:600,
    padding:"6px 10px", outline:"none",
  };

  return (
    <div style={{background:"#040c1a",border:"1px solid #0a1628",borderRadius:"6px",padding:"14px 16px",marginTop:"12px"}}>
      <div style={{display:"flex",alignItems:"center",gap:"12px",flexWrap:"wrap",justifyContent:"space-between"}}>
        <div style={{display:"flex",alignItems:"center",gap:"12px"}}>
          <div style={{fontSize:"11px",color:"#5a8fc0",textTransform:"uppercase",letterSpacing:"0.12em",fontWeight:600}}>
            Price Lookup
          </div>
          <button onClick={()=>stepOpex(-1)} title="Previous monthly expiration"
            style={{...inputStyle, color:"#7dd3fc", cursor:"pointer", padding:"6px 9px", fontSize:"12px"}}>◀</button>
          <input type="date" value={dateStr} onChange={e=>setDateStr(e.target.value)}
            style={{...inputStyle, colorScheme:"dark"}}/>
          <button onClick={()=>stepOpex(1)} title="Next monthly expiration"
            style={{...inputStyle, color:"#7dd3fc", cursor:"pointer", padding:"6px 9px", fontSize:"12px"}}>▶</button>
        </div>
        {results && (
          <div style={{display:"flex",alignItems:"center",gap:"14px"}}>
            {results.daysFromNow < 0 && (() => {
              const h = priceOn(liveHistory, results.ts);
              if (!h) return null;
              const hq = priceToQuantile(h.price, h.ts, modelA, modelB);
              const {tier: ht} = getTier(hq);
              return (
                <div style={{fontSize:"11px",fontWeight:600,letterSpacing:"0.04em"}}>
                  <span style={{color:"#8aaac8",textTransform:"uppercase",letterSpacing:"0.08em"}}>Actual </span>
                  <span style={{color:"#f1f5f9"}}>{fmtFull(h.price)}</span>
                  <span style={{color:ht.color,marginLeft:"8px"}}>{hq.toFixed(1)}q</span>
                </div>
              );
            })()}
            <div style={{fontSize:"11px",color:"#4a6a80",letterSpacing:"0.08em",
              textTransform:"uppercase",fontWeight:600}}>
              {results.daysFromNow > 0 ? `+${results.daysFromNow}D` :
               results.daysFromNow === 0 ? "TODAY" :
               `−${Math.abs(results.daysFromNow)}D`}
            </div>
          </div>
        )}
      </div>
      {results && (
        <div style={{display:"grid",gridTemplateColumns:"repeat(6, 1fr)",gap:"6px",marginTop:"12px"}}>
          {results.bands.map(r => {
            const aboveBelow = btcPrice > 0 ? ((btcPrice / r.price - 1) * 100) : null;
            return (
              <div key={r.label} style={{background:"#070f1f",border:`1px solid ${r.color}22`,
                borderRadius:"5px",padding:"8px 10px",textAlign:"center"}}>
                <div style={{fontSize:"11px",color:r.color,fontWeight:700,letterSpacing:"0.06em",marginBottom:"4px"}}>{r.label}</div>
                <div style={{fontSize:"14px",color:"#d0dde8",fontWeight:600}}>{fmtFull(r.price)}</div>
                {aboveBelow !== null && (
                  <div style={{fontSize:"10px",marginTop:"3px",
                    color:aboveBelow > 0 ? "#22c55e" : "#ef4444"}}>
                    {aboveBelow > 0 ? "+" : ""}{aboveBelow.toFixed(1)}%
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// POWER LAW CHART (SVG)
// ─────────────────────────────────────────────────────────────────────────────
function PowerLawChart({ btcPrice, todayTs, liveHistory, lookupTs, modelA=JV_A, modelB=JV_B }) {
  const canvasRef = useRef(null);

  // Chart dimensions
  const W = 900, H = 420, PAD = {t:30, r:20, b:40, l:65};
  const cw = W - PAD.l - PAD.r, ch = H - PAD.t - PAD.b;

  // Time range: 2011-01-01 to +5 years
  const tMin = new Date("2011-01-01").getTime();
  const tMax = new Date(new Date().getFullYear() + 5, 11, 31).getTime();

  // Price range in log scale — tighter ceiling to reduce dead space
  const pMin = Math.log10(0.3);     // $0.30
  const pMax = Math.log10(1000000); // $1M

  const tx = ts => PAD.l + cw * (ts - tMin) / (tMax - tMin);
  const ty = logP => PAD.t + ch * (1 - (logP - pMin) / (pMax - pMin));

  // Build band curves (monthly resolution)
  const months = [];
  {
    const d = new Date(2011, 0, 1);
    const end = new Date(new Date().getFullYear() + 5, 11, 31);
    while (d <= end) {
      months.push(d.getTime());
      d.setMonth(d.getMonth() + 1);
    }
  }

  // Band fill areas (between adjacent bands)
  const bandFills = useMemo(() => {
    const fills = [];
    const bandPairs = [
      { upper: BAND_DEFS[2], lower: BAND_DEFS[3], color: "#22d3ee", opacity: 0.07 },  // 50-85  IBIT
      { upper: BAND_DEFS[3], lower: BAND_DEFS[4], color: "#f97316", opacity: 0.07 },  // 15-50  MSTR
      { upper: BAND_DEFS[4], lower: BAND_DEFS[5], color: "#ef4444", opacity: 0.07 },  // 0.1-15 MSTX
      { upper: BAND_DEFS[1], lower: BAND_DEFS[2], color: "#22c55e", opacity: 0.05 },  // 85-95  STRC
    ];
    for (const {upper, lower, color, opacity} of bandPairs) {
      let pathUp = "", pathDn = "";
      for (let i = 0; i < months.length; i++) {
        const ts = months[i];
        const pU = bandPriceAt(ts, upper, modelA, modelB);
        const pL = bandPriceAt(ts, lower, modelA, modelB);
        if (pU <= 0 || pL <= 0) continue;
        const x = tx(ts);
        const yU = ty(Math.log10(Math.min(pU, 1e6)));
        const yL = ty(Math.log10(pL));
        pathUp += (pathUp ? "L" : "M") + x.toFixed(1) + "," + yU.toFixed(1);
        pathDn = x.toFixed(1) + "," + yL.toFixed(1) + (pathDn ? "L" : "") + pathDn;
      }
      fills.push({ d: pathUp + "L" + pathDn + "Z", color, opacity });
    }
    return fills;
  }, [months, modelA, modelB]);

  // Band lines
  const bandLines = useMemo(() => {
    return BAND_DEFS.map(b => {
      let d = "";
      for (const ts of months) {
        const p = bandPriceAt(ts, b, modelA, modelB);
        if (p <= 0) continue;
        const x = tx(ts), y = ty(Math.log10(p));
        d += (d ? "L" : "M") + x.toFixed(1) + "," + y.toFixed(1);
      }
      return { ...b, d };
    });
  }, [months, modelA, modelB]);

  // Historical price line from seed + live data
  const pricePath = useMemo(() => {
    const pts = [];
    // Use BTC_HISTORY (monthly seed) for pre-live data
    for (const {days, price} of BTC_HISTORY) {
      const ts = GENESIS_MS + days * 86400000;
      if (ts >= tMin && ts <= tMax && price > 0) {
        pts.push([ts, price]);
      }
    }
    // Overlay live data — downsample daily to weekly to match seed density
    if (liveHistory) {
      const weekMs = 7 * 86400000;
      const buckets = new Map();
      for (const [ts, price] of liveHistory) {
        if (ts >= tMin && ts <= tMax && price > 0) {
          const weekKey = Math.floor(ts / weekMs);
          const existing = buckets.get(weekKey);
          // Keep the last data point in each week
          if (!existing || ts > existing[0]) buckets.set(weekKey, [ts, price]);
        }
      }
      for (const [, pt] of buckets) pts.push(pt);
    }
    // Sort and deduplicate: keep one point per ~7-day window
    pts.sort((a,b) => a[0] - b[0]);
    const deduped = [];
    for (const pt of pts) {
      if (deduped.length === 0 || pt[0] - deduped[deduped.length-1][0] > 5*86400000) {
        deduped.push(pt);
      }
    }
    // Build smooth SVG path using Catmull-Rom → cubic bezier conversion
    if (deduped.length < 2) return "";
    const points = deduped.map(([ts, price]) => [tx(ts), ty(Math.log10(price))]);
    let d = `M${points[0][0].toFixed(1)},${points[0][1].toFixed(1)}`;
    for (let i = 0; i < points.length - 1; i++) {
      const p0 = points[Math.max(0, i - 1)];
      const p1 = points[i];
      const p2 = points[i + 1];
      const p3 = points[Math.min(points.length - 1, i + 2)];
      // Catmull-Rom to cubic bezier control points (tension=0.5)
      const cp1x = p1[0] + (p2[0] - p0[0]) / 6;
      const cp1y = p1[1] + (p2[1] - p0[1]) / 6;
      const cp2x = p2[0] - (p3[0] - p1[0]) / 6;
      const cp2y = p2[1] - (p3[1] - p1[1]) / 6;
      d += ` C${cp1x.toFixed(1)},${cp1y.toFixed(1)} ${cp2x.toFixed(1)},${cp2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
    }
    return d;
  }, [liveHistory]);

  // Y-axis labels
  const yLabels = [1, 10, 100, 1000, 10000, 100000, 1000000];

  // X-axis labels
  const xLabels = [];
  for (let yr = 2012; yr <= new Date().getFullYear() + 5; yr += 2) {
    const ts = new Date(yr, 0, 1).getTime();
    if (ts >= tMin && ts <= tMax) xLabels.push({ yr, ts });
  }

  // Today marker
  const todayX = tx(todayTs);
  const priceY = btcPrice > 0 ? ty(Math.log10(btcPrice)) : null;

  return (
    <div style={{background:"#040c1a",border:"1px solid #0a1628",borderRadius:"6px",padding:"16px 18px",marginTop:"14px"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"10px"}}>
        <div style={{fontSize:"11px",color:"#5a8fc0",textTransform:"uppercase",letterSpacing:"0.12em",fontWeight:600}}>
          Power Law Bands
        </div>
        {/* Legend */}
        <div style={{display:"flex",gap:"10px",flexWrap:"wrap",alignItems:"center"}}>
          <div style={{display:"flex",alignItems:"center",gap:"5px"}}>
            <div style={{width:"14px",height:"2.5px",background:"#f1f5f9",borderRadius:"1px"}}/>
            <span style={{fontSize:"11px",color:"#8aaac8",fontWeight:700}}>BTC</span>
          </div>
          {[...BAND_DEFS].reverse().map(b => (
            <div key={b.q} style={{display:"flex",alignItems:"center",gap:"5px"}}>
              <div style={{width:"14px",height:"2.5px",background:b.color,borderRadius:"1px",opacity:0.9}}/>
              <span style={{fontSize:"11px",color:b.color,fontWeight:700}}>{b.label}</span>
            </div>
          ))}
        </div>
      </div>
      <div style={{overflowX:"auto"}}>
        <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",maxWidth:`${W}px`,height:"auto",display:"block"}}>
          {/* Background */}
          <rect x={PAD.l} y={PAD.t} width={cw} height={ch} fill="#070f1f" rx="2"/>

          {/* Grid lines */}
          {yLabels.map(v => {
            const y = ty(Math.log10(v));
            return y >= PAD.t && y <= PAD.t + ch ? (
              <line key={v} x1={PAD.l} x2={PAD.l+cw} y1={y} y2={y} stroke="#0d1e30" strokeWidth="0.5"/>
            ) : null;
          })}

          {/* Band fills */}
          {bandFills.map((f,i) => (
            <path key={i} d={f.d} fill={f.color} opacity={f.opacity}/>
          ))}

          {/* Band lines */}
          {bandLines.map(b => (
            <path key={b.q} d={b.d} fill="none" stroke={b.color} strokeWidth={b.w} opacity={b.dim ? 0.35 : 0.9}
              strokeDasharray={b.dash} opacity={0.7}/>
          ))}

          {/* Historical price line */}
          <path d={pricePath} fill="none" stroke="#f1f5f9" strokeWidth="1.2" opacity="0.85"/>

          {/* Today vertical line */}
          <line x1={todayX} x2={todayX} y1={PAD.t} y2={PAD.t+ch}
            stroke="#22d3ee" strokeWidth="0.5" strokeDasharray="3,3" opacity="0.4"/>
          <text x={todayX} y={PAD.t-6} fill="#22d3ee" fontSize="11" textAnchor="middle" opacity="0.7">TODAY</text>

          {/* Lookup-date marker */}
          {lookupTs && Math.abs(lookupTs - todayTs) > 86400000 && (() => {
            const lx = tx(lookupTs);
            if (lx < PAD.l || lx > PAD.l + cw) return null;
            const past = lookupTs < todayTs;
            const h = past ? priceOn(liveHistory, lookupTs) : null;
            const hy = h ? ty(Math.log10(h.price)) : null;
            return (
              <>
                <line x1={lx} x2={lx} y1={PAD.t} y2={PAD.t+ch}
                  stroke="#7dd3fc" strokeWidth="1" strokeDasharray="2,4" opacity="0.5"/>
                {h && hy >= PAD.t && hy <= PAD.t+ch && (() => {
                  const lw = String(fmtFull(h.price)).length*8+12;
                  const flip = lx > todayX - 130; // avoid TODAY pill collision
                  const rx = flip ? lx-8-lw : lx+8;
                  return (
                    <>
                      <circle cx={lx} cy={hy} r="4" fill="#7dd3fc" stroke="#020817" strokeWidth="2"/>
                      <rect x={rx} y={hy-9.5} width={lw} height="19" rx="3" fill="#020817" opacity="0.85"/>
                      <text x={rx+5} y={hy+4.5} fill="#7dd3fc" fontSize="13" fontWeight="700">{fmtFull(h.price)}</text>
                    </>
                  );
                })()}
              </>
            );
          })()}

          {/* Current price dot */}
          {priceY !== null && priceY >= PAD.t && priceY <= PAD.t+ch && (
            <>
              <circle cx={todayX} cy={priceY} r="5" fill="#facc15" stroke="#020817" strokeWidth="2"/>
              {/* Price label with dark background for readability over band lines */}
              <rect x={todayX+9} y={priceY-9.5} width={String(fmtFull(btcPrice)).length*8+12} height="19" rx="3" fill="#020817" opacity="0.85"/>
              <text x={todayX+14} y={priceY+4.5} fill="#facc15" fontSize="13" fontWeight="700">
                {fmtFull(btcPrice)}
              </text>
            </>
          )}

          {/* Y-axis labels */}
          {yLabels.map(v => {
            const y = ty(Math.log10(v));
            return y >= PAD.t && y <= PAD.t + ch ? (
              <text key={v} x={PAD.l-6} y={y+4} fill="#7aa5c8" fontSize="11" textAnchor="end">
                {v >= 1e6 ? "$"+v/1e6+"M" : v >= 1e3 ? "$"+v/1e3+"K" : "$"+v}
              </text>
            ) : null;
          })}

          {/* X-axis labels */}
          {xLabels.map(({yr,ts}) => (
            <text key={yr} x={tx(ts)} y={PAD.t+ch+18} fill="#7aa5c8" fontSize="11" textAnchor="middle">{yr}</text>
          ))}
        </svg>
      </div>
    </div>
  );
}

// Persisted-shape guards. localStorage is user-editable and survives every
// version of this page, so a stored "null", a stored array where an object is
// expected, or a null array member must never reach the render path. Every
// persisted value goes through a coercer on load.
const pbIsObj = o => o !== null && typeof o === "object" && !Array.isArray(o);
// object shape: keep the stored keys, but guarantee every expected key exists
const pbObjOf = initial => v => (pbIsObj(v) ? {...initial, ...v} : {...initial});
// array shape: drop null and non-object members
const pbRowsOf = v => (Array.isArray(v) ? v.filter(pbIsObj) : []);

function useLocal(key, initial, coerce) {
  const fix = coerce || (v => (v === null || v === undefined ? initial : v));
  const [v, setV] = useState(() => {
    try {
      const s = localStorage.getItem(key);
      return s === null ? initial : fix(JSON.parse(s));
    } catch(_) { return initial; }
  });
  useEffect(() => { try { localStorage.setItem(key, JSON.stringify(v)); } catch(_) {} }, [key, v]);
  return [v, setV];
}

const pbNum = s => {

};

// US market holidays, 2026 and 2027, on the dates the exchange is actually shut
// (observed dates, so July 4 2026 is the Friday before and July 4 2027 is the
// Monday after). Good Friday is an exchange holiday, not a federal one.
const PB_HOLIDAYS = new Set([
  "2026-01-01","2026-01-19","2026-02-16","2026-04-03","2026-05-25",
  "2026-06-19","2026-07-03","2026-09-07","2026-11-26","2026-12-25",
  "2027-01-01","2027-01-18","2027-02-15","2027-03-26","2027-05-31",
  "2027-06-18","2027-07-05","2027-09-06","2027-11-25","2027-12-24",
]);
// trading days strictly after a date through today: weekends and the holidays
// above are skipped, so a 10-day wait is not satisfied by a shut market
function pbBizDaysSince(dateStr) {
  if (!dateStr) return null;
  const t0 = Date.parse(dateStr + "T00:00:00Z");
  if (isNaN(t0)) return null;
  const t1 = Date.parse(new Date().toISOString().slice(0,10) + "T00:00:00Z");
  if (t1 < t0) return null;
  let n = 0;
  for (let t = t0 + 86400000; t <= t1; t += 86400000) {
    const dt = new Date(t);
    const d = dt.getUTCDay();
    if (d === 0 || d === 6) continue;
    if (PB_HOLIDAYS.has(dt.toISOString().slice(0,10))) continue;
    n++;
  }
  return n;
}
function pbDaysSince(dateStr) {
  if (!dateStr) return null;
  const t0 = Date.parse(dateStr + "T00:00:00Z");
  if (isNaN(t0)) return null;
  return Math.floor((Date.now() - t0) / 86400000);
}
// first trading day of next month: weekends and the holiday list above skipped
function pbNextRefillDate() {
  const n = new Date();
  const d = new Date(Date.UTC(n.getUTCFullYear(), n.getUTCMonth() + 1, 1));
  for (let i = 0; i < 10; i++) {
    const iso = d.toISOString().slice(0,10);
    if (d.getUTCDay() !== 0 && d.getUTCDay() !== 6 && !PB_HOLIDAYS.has(iso)) return iso;
    d.setUTCDate(d.getUTCDate() + 1);
  }
  return d.toISOString().slice(0,10);
}

// ─────────────────────────────────────────────────────────────────────────────
function PlaybookTab({ todayTs, btcPrice, priceStr, livePrice, liveFetch,
                       liveHistory, modelA, modelB }) {
  // ── data/playbook.json ────────────────────────────────────────────────────
  const [pb, setPb] = useState(null);
  const [pbErr, setPbErr] = useState(null);
  useEffect(() => {
    let live = true;
    fetch("data/playbook.json?t=" + Date.now(), {cache:"no-store"})
      .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(j => { if (live) setPb(j); })
      .catch(e => { if (live) setPbErr(String(e && e.message ? e.message : e)); });
    return () => { live = false; };
  }, []);
  // Everything below comes out of a fetched file, so it gets the same shape
  // guards the persisted state gets: a null, a wrong type or a null array member
  // must not reach the render path.
  const pbIn = (pb && pbIsObj(pb.inputs)) ? pb.inputs : {};
  const pbIv = (pb && pbIsObj(pb.iv)) ? pb.iv : null;
  const pbStale = !!(pbIv && pbIv.stale);
  const jsonComponents = (pb && pb.rules && Array.isArray(pb.rules.components))
    ? pb.rules.components.filter(pbIsObj) : [];
  const components = jsonComponents.length ? jsonComponents : PLAYBOOK_RULES.components;
  const jsonPaper = (pb && pb.rules && pbIsObj(pb.rules.paper_trigger)) ? pb.rules.paper_trigger : null;
  const paperTrigger = jsonPaper || PLAYBOOK_RULES.paperTrigger;

  // ── hand-fill state ───────────────────────────────────────────────────────
  // _v2 key: the v1 defaults were invented numbers, so the sheet's figures have
  // to land even for a browser that already stored the old shape.
  const [map, setMap]         = useLocal("bql_pb_mapping_v2", PB_MAP_INIT, pbObjOf(PB_MAP_INIT));
  const [ovr, setOvr]         = useLocal("bql_pb_overrides", {}, pbObjOf({}));
  const [sleeve, setSleeve]   = useLocal("bql_pb_sleeve", PB_SLEEVE_INIT, pbObjOf(PB_SLEEVE_INIT));
  const [opens, setOpens]     = useLocal("bql_pb_opens", [], pbRowsOf);
  const [journal, setJournal] = useLocal("bql_pb_journal", [], pbRowsOf);
  const [copied, setCopied]   = useState("");
  const setM = (k,v) => setMap(o => ({...o, [k]:v}));
  const setS = (k,v) => setSleeve(o => ({...o, [k]:v}));

  // ── a0. the BTC price this tab is allowed to use ───────────────────────────
  // The ladder's price input starts at a hard-coded 85,000 so the page renders
  // before any fetch returns. That default is not a market price and this tab
  // must never present it as one, so a price counts only when it came from the
  // live feed, from data/playbook.json, or from a hand entry. With none of those
  // the tab says so and every number derived from a BTC level stays blank.
  const btcHand  = pbNum(map.btc);
  const btcJson  = (pbIn.btc_price && typeof pbIn.btc_price.value === "number") ? pbIn.btc_price.value : null;
  const liveOk   = typeof livePrice === "number" && livePrice > 0;
  // a ladder-side hand edit moves priceStr off the default without a live fetch
  const ladderHand = !liveOk && String(priceStr == null ? "" : priceStr).trim() !== PB_PRICE_DEFAULT
                     && typeof btcPrice === "number" && btcPrice > 0;
  const btcPx = btcHand != null ? btcHand
              : liveOk        ? btcPrice
              : ladderHand    ? btcPrice
              : btcJson != null ? btcJson
              : null;
  const btcPxSrc = btcHand != null ? "by hand on this tab"
                 : liveOk        ? "live feed · " + (liveFetch || "live")
                 : ladderHand    ? "by hand on the ladder tab"
                 : btcJson != null ? "data/playbook.json · Yahoo daily close " + ((pbIn.btc_price||{}).as_of||"")
                 : null;
  const pxOk = btcPx != null;

  // ── a. ladder inputs, recomputed off the price above ──────────────────────
  // Recomputed here rather than taken from the ladder tab's props, because the
  // resolved price can differ from the ladder input (a failed live fetch falling
  // back to the JSON close, or a hand entry on this tab) and a quantile from one
  // price beside a level from another is not a reading of anything.
  const q         = pxOk ? priceToQuantile(btcPx, todayTs, modelA, modelB) : null;
  const tierInfo  = pxOk ? getTier(q) : null;
  const tier      = tierInfo ? tierInfo.tier : null;
  const tierIdx   = tierInfo ? tierInfo.idx : null;
  const rotateUp   = (tierInfo && tierIdx > 0) ? { t: LADDER[tierIdx-1], q: tier.qMax + HYST } : null;
  const rotateDown = (tierInfo && tierIdx < LADDER.length-1) ? { t: LADDER[tierIdx+1], q: tier.qMin - HYST } : null;
  const inBuffer  = pxOk && ((q > tier.qMin && q < tier.qMin + HYST)
                          || (q < tier.qMax && q > tier.qMax - HYST && tier.qMax <= 100));
  const upPrice   = rotateUp   ? quantileToPrice(rotateUp.q,   todayTs, modelA, modelB) : null;
  const downPrice = rotateDown ? quantileToPrice(rotateDown.q, todayTs, modelA, modelB) : null;
  const ticker = tier ? tier.name.split(" ")[0] : null;

  // ── b. LEAPS short strike: regime-exit price at the short's expiry ────────
  const shortTs = addMonths(todayTs, 16);
  const exitQ   = tier ? tier.qMax + HYST : null;
  const exitPx  = (tier && tier.kind === "pmcc") ? quantileToPrice(exitQ, shortTs, modelA, modelB) : null;

  // mapping: the sheet's own arithmetic. mNAV follows the sheet's rule at the
  // exit BTC price unless a hand value is entered; MSTR and MSTX now default to
  // the Yahoo closes in playbook.json. MSTX uses the sheet's POWER form, not a
  // linear multiple of the MSTR move.
  const holdings = pbNum(map.holdings), shares = pbNum(map.shares);
  const chop = pbNum(map.chop);
  const mnavHand = pbNum(map.mnav);
  const mnavRule = pbMnavRule(exitPx);
  const mnav = mnavHand != null ? mnavHand : mnavRule;
  const mstrFeed = (pbIn.mstr_price && typeof pbIn.mstr_price.value === "number") ? pbIn.mstr_price.value : null;
  const mstxFeed = (pbIn.mstx_price && typeof pbIn.mstx_price.value === "number") ? pbIn.mstx_price.value : null;
  const mstrHand = pbNum(map.mstr), mstxHand = pbNum(map.mstx);
  const mstrPx = mstrHand != null ? mstrHand : mstrFeed;
  const mstxPx = mstxHand != null ? mstxHand : mstxFeed;
  const navPerShare = (exitPx != null && holdings != null && shares) ? exitPx * holdings / shares : null;
  const mstrTarget  = (navPerShare != null && mnav != null) ? navPerShare * mnav : null;
  const mstrMovePct = (mstrTarget != null && mstrPx) ? (mstrTarget / mstrPx - 1) : null;
  const mstxTarget  = (mstrTarget != null && mstrPx && mstxPx != null && chop != null && mstrTarget > 0)
    ? mstxPx * Math.pow(mstrTarget / mstrPx, chop) : null;

  // ── c. client-side BTC 200-day from the 365-day history the page fetched ──
  const btc200 = useMemo(() => {
    if (!liveHistory || liveHistory.length < 200) return null;
    const pts = liveHistory.slice(-200);
    const step = (pts[pts.length-1][0] - pts[0][0]) / 86400000 / (pts.length - 1);
    if (!(step > 0.5 && step < 2.5)) return null;   // not daily data, do not claim an SMA
    const sma = pts.reduce((a,p) => a + p[1], 0) / pts.length;
    const last = pts[pts.length-1][1];
    return { sma, last, above: last > sma, asOf: new Date(pts[pts.length-1][0]).toISOString().slice(0,10) };
  }, [liveHistory]);

  // effective trigger value: hand override first, then playbook.json
  const effBool = id => {
    const o = ovr[id];
    if (o === "pass") return true;
    if (o === "fail") return false;
    const r = pbIn[id];
    return (r && typeof r.pass === "boolean") ? r.pass : null;
  };
  const effNum = id => {
    const o = pbNum(ovr[id]);
    if (o != null) return o;
    const r = pbIn[id];
    return (r && typeof r.value === "number") ? r.value : null;
  };
  const isHand = id => ovr[id] !== undefined && ovr[id] !== "" && ovr[id] !== null;

  // a component scores against its playbook.json input. Numeric components pass
  // through the row's passAt threshold (realized-vol rank at 70), bools direct.
  const compPass = c => {
    const key = c.input || c.id;
    const t = PB_TRIGGERS.find(x => x.id === key);
    if (t && t.passAt) { const v = effNum(key); return v == null ? null : t.passAt(v); }
    return effBool(key);
  };
  const stackOf = list => {
    const unknown = list.filter(c => compPass(c) === null).map(c => c.label);
    const failing = list.filter(c => compPass(c) === false).map(c => c.label);
    return { list, unknown, failing,
      live: list.length > 0 && unknown.length === 0 && failing.length === 0 };
  };

  // FUNDED STACK: adopted components only. PAPER STACK: the paper trigger.
  const adopted = components.filter(c => c.adopted === true);
  const funded = stackOf(adopted);
  const stackLive = funded.live;
  const unknownStack = funded.unknown, failingStack = funded.failing;
  const stackReason = adopted.length === 0
    ? "no adopted trigger; sleeve cannot be funded"
    : funded.unknown.length ? "unknown inputs: " + funded.unknown.join(", ")
    : funded.failing.length ? "failing: " + funded.failing.join(", ")
    : "every adopted component passes";

  const paperIds = (paperTrigger && paperTrigger.components) || [];
  const paper = stackOf(paperIds.map(id => components.find(c => c.id === id)).filter(Boolean));
  const paperReason = paper.list.length === 0
    ? "paper trigger names no component the rules file defines"
    : paper.failing.length ? "failing: " + paper.failing.join(", ")
    : paper.unknown.length ? "unknown inputs: " + paper.unknown.join(", ")
    : "all " + paper.list.length + " components pass";

  const ivRank = effNum("iv_rank");
  const ivRankLabel = (pbIn.iv_rank && pbIn.iv_rank.rank_label) || null;
  const rvProxy = (pbIn.realized_vol_rank && typeof pbIn.realized_vol_rank.value === "number")
    ? pbIn.realized_vol_rank.value : null;

  // ── journal-derived paper counters (the gates below prefer them) ───────────
  const journalRows = pbRowsOf(journal);
  const paperRowsJ = journalRows.filter(r => /paper/i.test(String(r.mode || "")));
  const jHit  = r => /^(hit|win|won|green|yes|y)\b/i.test(String(r.result || "").trim());
  const jMiss = r => /^(miss|loss|lost|red|no|n)\b/i.test(String(r.result || "").trim());
  const jDone = r => jHit(r) || jMiss(r);              // a scored outcome, not an open row
  const jDate = r => {
    const s = String((r && r.date) || "").trim();
    return (/^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(Date.parse(s + "T00:00:00Z"))) ? s : null;
  };
  const paperDone = paperRowsJ.filter(jDone);
  const jImpliedVals = paperDone.map(r => {
    const d = pbNum(r.debit), w = pbNum(r.width);
    return (d != null && w) ? d / w * 100 : null;
  }).filter(v => v != null);
  const fromJournal = paperRowsJ.length > 0;
  // the record has to span eight weeks, so it is measured in dates, not rows
  const paperDates = paperRowsJ.map(jDate).filter(Boolean).sort();
  const paperSpanDays = paperDates.length >= 2
    ? Math.round((Date.parse(paperDates[paperDates.length-1] + "T00:00:00Z")
                  - Date.parse(paperDates[0] + "T00:00:00Z")) / 86400000)
    : (paperDates.length === 1 ? 0 : null);

  // ── d. sleeve gates (R3 requires, R4 any-of) ──────────────────────────────
  const openRows = pbRowsOf(opens);
  const lastEntry = sleeve.lastEntry || openRows.map(r => r.entry).filter(Boolean).sort().slice(-1)[0] || "";
  const bizSince = pbBizDaysSince(lastEntry);
  const redDays = sleeve.lastExpiryResult === "red" ? pbDaysSince(sleeve.lastExpiryDate) : null;
  const paperN      = fromJournal ? paperRowsJ.length            : pbNum(sleeve.paperN);
  const paperDoneN  = fromJournal ? paperDone.length             : null;
  const paperHits   = fromJournal ? paperDone.filter(jHit).length : pbNum(sleeve.paperHits);
  const paperImplied = fromJournal
    ? (jImpliedVals.length ? jImpliedVals.reduce((a,b)=>a+b,0) / jImpliedVals.length : null)
    : pbNum(sleeve.paperImplied);
  // hit rate over the scored rows, which is what the implied average compares to
  const paperRate = fromJournal
    ? (paperDoneN ? paperHits / paperDoneN * 100 : null)
    : ((paperN && paperHits != null) ? paperHits / paperN * 100 : null);
  // Eight weeks of record beating implied odds, not eight rows. Eight rows
  // logged the same afternoon are one afternoon, so the span is a hard
  // requirement and it can only be read off dated journal rows: a hand-entered
  // count carries no dates, so the hand path leaves the gate unknown.
  const paperFunded = (() => {
    if (!fromJournal) return null;
    if (paperSpanDays == null) return null;                      // no dated paper rows
    if (paperSpanDays < PB_PAPER_SPAN_DAYS) return false;
    if (paperDoneN < PB_PAPER_ROWS) return false;
    if (paperRate == null || paperImplied == null) return null;
    return paperRate > paperImplied;
  })();
  const paperGateDetail = !fromJournal
    ? (paperN == null ? PB_HAND
       : "hand tally only, the eight-week span needs dated journal rows")
    : [
        paperRowsJ.length + " paper row(s)",
        (paperDoneN || 0) + " scored of " + PB_PAPER_ROWS,
        paperSpanDays == null ? "no dated rows"
          : "span " + paperSpanDays + "d of " + PB_PAPER_SPAN_DAYS,
        paperRate == null ? "no hit rate yet"
          : paperRate.toFixed(0) + "% hit vs implied "
            + (paperImplied == null ? PB_HAND : paperImplied.toFixed(0) + "%"),
      ].join(", ");
  const refillBlocked = sleeve.lastExpiryResult === "red" && (redDays == null || redDays < 14);

  const gates = [
    { label:"Funded trigger stack live (adopted components only)",
      state: stackLive ? true : (unknownStack.length || adopted.length === 0 ? null : false),
      detail: stackReason },
    { label:"Fewer than " + PB_MAX_OPEN + " open", state: openRows.length < PB_MAX_OPEN,
      detail: openRows.length + " open of " + PB_MAX_OPEN },
    { label:"10 or more trading days since last entry",
      state: bizSince == null ? null : bizSince >= 10,
      detail: bizSince == null ? "last entry date " + PB_HAND : bizSince + " business days since " + lastEntry },
    { label:"Last expiry not red, or refill date reached",
      state: sleeve.lastExpiryResult === "none" ? null
           : sleeve.lastExpiryResult === "red" ? (redDays != null && redDays >= 14) : true,
      detail: sleeve.lastExpiryResult === "none" ? "last expiry result " + PB_HAND
            : sleeve.lastExpiryResult === "red" ? "red " + (redDays == null ? "date " + PB_HAND : redDays + " days ago, 14 needed")
            : "green" },
    { label:"Sleeve cash covers the trade",
      state: sleeve.cashCovers === "yes" ? true : sleeve.cashCovers === "no" ? false : null,
      detail: sleeve.cashCovers === "unknown" ? PB_HAND : sleeve.cashCovers },
    { label:"IV rank known", state: ivRank != null, detail: ivRank == null ? "no IV rank" : ivRank.toFixed(0) },
    { label:"Thesis and IV rank agree (no undated thesis at IV rank 50 or above)",
      state: sleeve.thesis === "unknown" || ivRank == null ? null
           : !(sleeve.thesis === "undated" && ivRank >= 50),
      detail: sleeve.thesis === "unknown" ? "thesis type " + PB_HAND
            : sleeve.thesis + " thesis, IV rank " + (ivRank == null ? "unknown" : ivRank.toFixed(0)) },
    { label:"Regime below 85q", state: pxOk ? q < 85 : null,
      detail: pxOk ? q.toFixed(1) + "q" : PB_NO_PRICE },
    { label:"Not in the 1q rotation buffer", state: pxOk ? !inBuffer : null,
      detail: !pxOk ? PB_NO_PRICE : inBuffer ? "in buffer" : "clear" },
    { label:"Paper gate passed", state: paperFunded, detail: paperGateDetail },
  ];
  const canFire = gates.every(g => g.state === true);
  const blockers = gates.filter(g => g.state !== true);

  // ── e. journal ────────────────────────────────────────────────────────────
  const copyJournal = () => {
    const text = JSON.stringify(journalRows, null, 2);
    try {
      navigator.clipboard.writeText(text).then(() => setCopied("copied"), () => setCopied("copy blocked"));
    } catch(_) { setCopied("copy blocked"); }
  };

  const num = (v, f) => v == null ? <span style={{color:"#5a7fa0"}}>{PB_HAND}</span> : f(v);
  const sheetTag = <span style={{...PB_DIM,marginLeft:"6px"}}>from your sheet inputs</span>;

  return (
    <div>
      {/* ── 1. RULE CARD ─────────────────────────────────────────────────── */}
      <div style={{...PB_CARD,marginTop:0}}>
        <div style={{display:"flex",alignItems:"baseline",justifyContent:"space-between",gap:"12px",flexWrap:"wrap",marginBottom:"10px"}}>
          <div style={PB_LABEL}>Rule Card · one page, decided before entry</div>
          <div style={PB_DIM}>{PLAYBOOK_RULES.version} · {PLAYBOOK_RULES.asOf}</div>
        </div>
        <div style={{...PB_INNER,borderLeft:"3px solid #facc15",marginBottom:"8px"}}>
          <div style={{...PB_BODY,color:"#d0dde8",fontWeight:600}}>{PLAYBOOK_RULES.allocation}</div>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:"8px"}}>
          {PLAYBOOK_RULES.rows.map(r => (
            <div key={r.id} style={{...PB_INNER,borderLeft:`3px solid ${r.color}`}}>
              <div style={{display:"flex",alignItems:"baseline",gap:"10px",flexWrap:"wrap",marginBottom:"6px"}}>
                <span style={{fontSize:"12px",fontWeight:700,letterSpacing:"0.1em",color:r.color}}>{r.id}</span>
                <span style={{fontSize:"13px",fontWeight:700,color:"#f1f5f9"}}>{r.title}</span>
              </div>
              <PbLine label="Situation">{r.situation}</PbLine>
              {(r.fields||[]).map(([k,v]) => <PbLine key={k} label={k}>{v}</PbLine>)}
              {r.list && (
                <PbLine label="Conditions">
                  <span style={{display:"flex",flexDirection:"column",gap:"3px"}}>
                    {r.list.map((x,i) => <span key={i}>· {x}</span>)}
                  </span>
                </PbLine>
              )}
            </div>
          ))}
        </div>
        <div style={{...PB_DIM,marginTop:"10px",paddingTop:"8px",borderTop:"1px solid #0a1628",textTransform:"uppercase",letterSpacing:"0.1em"}}>
          {PLAYBOOK_RULES.discipline}
        </div>
      </div>

      {/* ── 2a. LADDER INPUTS ────────────────────────────────────────────── */}
      <div style={PB_CARD}>
        <div style={{...PB_LABEL,marginBottom:"10px"}}>Today's Inputs · Ladder</div>
        {!pxOk && (
          <div style={{...PB_INNER,borderLeft:"3px solid #eab308",marginBottom:"10px"}}>
            <div style={{fontSize:"13px",fontWeight:700,color:"#eab308",marginBottom:"4px"}}>{PB_NO_PRICE}</div>
            <div style={PB_BODY}>
              The live feed has not returned and data/playbook.json carries no BTC close, so this tab has no
              market price. Every number that comes off a BTC level is blank until the feed returns, the
              refresh runs, or you enter a price by hand in the mapping box below.
            </div>
          </div>
        )}
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:"10px"}}>
          {[
            {l:"quantile", v:pxOk ? q.toFixed(1) + "q" : null, c:pxOk ? tier.color : null},
            {l:"regime ticker", v:ticker, c:pxOk ? tier.color : null},
            {l:"rotation buffer", v:pxOk ? (inBuffer ? "IN BUFFER" : "clear") : null,
              c:inBuffer ? "#eab308" : "#22c55e"},
            {l:"btc price used", v:pxOk ? fmtFull(btcPx) : null, c:"#facc15", sub:btcPxSrc},
          ].map(x => (
            <div key={x.l} style={PB_INNER}>
              <div style={{...PB_LABEL,marginBottom:"4px"}}>{x.l}</div>
              <div style={{fontSize:"16px",fontWeight:700,color:x.v == null ? "#5a7fa0" : x.c}}>
                {x.v == null ? PB_NO_PRICE : x.v}
              </div>
              {x.sub && x.v != null && <div style={{...PB_DIM,marginTop:"3px"}}>{x.sub}</div>}
            </div>
          ))}
        </div>
        <div style={{marginTop:"10px",display:"flex",flexDirection:"column",gap:"6px"}}>
          {[
            (pxOk && rotateUp)   ? {dir:"up",   t:rotateUp,   px:upPrice,   dq:rotateUp.q - q,   d$:upPrice - btcPx}   : null,
            (pxOk && rotateDown) ? {dir:"down", t:rotateDown, px:downPrice, dq:q - rotateDown.q, d$:btcPx - downPrice} : null,
          ].filter(Boolean).map(x => (
            <div key={x.dir} style={{...PB_INNER,display:"flex",gap:"12px",flexWrap:"wrap",alignItems:"baseline"}}>
              <span style={{fontSize:"12px",color:"#8aaac8",width:"92px",flexShrink:0}}>
                {x.dir === "up" ? "↑ rotate up" : "↓ rotate down"}
              </span>
              <span style={{fontSize:"13px",fontWeight:700,color:x.t.t.color}}>{x.t.t.name}</span>
              <span style={{fontSize:"12px",color:"#d0dde8"}}>at {x.t.q.toFixed(0)}q · {fmt(x.px)}</span>
              <span style={{fontSize:"12px",color:"#a0b8cc"}}>
                {Math.abs(x.dq).toFixed(1)}q away · {(x.d$ >= 0 ? "" : "−") + fmt(Math.abs(x.d$))}
              </span>
            </div>
          ))}
          <div style={PB_DIM}>Same rotateUp / rotateDown and ±{HYST.toFixed(0)}q hysteresis the tier card uses.</div>
        </div>
      </div>

      {/* ── 2b. LEAPS LEG RULE FOR TODAY ─────────────────────────────────── */}
      <div style={PB_CARD}>
        <div style={{...PB_LABEL,marginBottom:"10px"}}>LEAPS Leg Rule For Today</div>
        {!pxOk ? (
          <div style={PB_INNER}>
            <PbLine label="Ticker"><span style={{color:"#5a7fa0"}}>{PB_NO_PRICE}</span></PbLine>
            <PbLine label="Note">
              The regime, the ticker and the short strike all come off a BTC level, so none of them is shown
              until there is a price.
            </PbLine>
          </div>
        ) : tier.kind === "pmcc" ? (
          <div style={PB_INNER}>
            <PbLine label="Ticker"><span style={{color:tier.color,fontWeight:700}}>{ticker}</span> by regime ({q.toFixed(1)}q)</PbLine>
            <PbLine label="Long">0.60 delta, 24 months or more</PbLine>
            <PbLine label="Short">
              next listed expiry 15 to 16 months out ({fmtMonth(shortTs)}) · strike at the regime-exit BTC price
              {" "}<span style={{color:"#facc15",fontWeight:700}}>{fmtFull(exitPx)}</span>
              {" "}<span style={PB_DIM}>({exitQ.toFixed(0)}q at that expiry)</span>
            </PbLine>
            <PbLine label="Size">40 to 50% of the account, sized so a 50% drop in the underlying does not touch the 30% cash floor</PbLine>
          </div>
        ) : (
          <div style={PB_INNER}>
            <PbLine label="Ticker">no options above 85q · STRC per ladder</PbLine>
            <PbLine label="Note">The regime is {q.toFixed(1)}q. R2 has no options structure here.</PbLine>
          </div>
        )}

        <div style={{marginTop:"10px"}}>
          <div style={{display:"flex",alignItems:"baseline",gap:"10px",flexWrap:"wrap",marginBottom:"8px"}}>
            <div style={PB_LABEL}>Mapping · BTC level to the ticker</div>
            <div style={PB_DIM}>from your sheet, {PB_SHEET.asOf}</div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(132px,1fr))",gap:"10px"}}>
            <PbField label="BTC price by hand"  value={map.btc}      onChange={v=>setM("btc",v)}
              placeholder={PB_NO_PRICE}
              hint={btcPxSrc ? "in use: " + btcPxSrc : "no live feed and no close on file, enter one to unblock the tab"}/>
            <PbField label="BTC holdings"       value={map.holdings} onChange={v=>setM("holdings",v)}
              hint={"sheet: 845,050"}/>
            <PbField label="Diluted shares"     value={map.shares}   onChange={v=>setM("shares",v)}
              hint={"sheet: 450,121,000"}/>
            <PbField label="mNAV override"      value={map.mnav}     onChange={v=>setM("mnav",v)}
              placeholder={mnavRule != null ? mnavRule.toFixed(3) + " by the rule" : PB_HAND}
              hint={mnavRule != null
                ? "rule at exit BTC: " + mnavRule.toFixed(3) + (mnavHand != null ? " · overridden" : " · in use")
                : "rule needs an exit BTC price"}/>
            <PbField label="MSTX chop multiple" value={map.chop}     onChange={v=>setM("chop",v)}
              hint="sheet: 1.85"/>
            <PbField label="MSTR now"           value={map.mstr}     onChange={v=>setM("mstr",v)}
              placeholder={mstrFeed != null ? mstrFeed.toFixed(2) : PB_HAND}
              hint={mstrFeed != null
                ? "Yahoo delayed " + pbPx(mstrFeed) + " · " + ((pbIn.mstr_price||{}).as_of||"") + (mstrHand != null ? " · overridden" : "")
                : "no close in playbook.json"}/>
            <PbField label="MSTX now"           value={map.mstx}     onChange={v=>setM("mstx",v)}
              placeholder={mstxFeed != null ? mstxFeed.toFixed(2) : PB_HAND}
              hint={mstxFeed != null
                ? "Yahoo delayed " + pbPx(mstxFeed) + " · " + ((pbIn.mstx_price||{}).as_of||"") + (mstxHand != null ? " · overridden" : "")
                : "no close in playbook.json"}/>
          </div>
          <div style={{...PB_INNER,marginTop:"10px"}}>
            <PbLine label="BTC at exit" labelWidth="120px">
              {num(exitPx, v => <span style={{color:"#facc15",fontWeight:700}}>{fmtFull(v)}</span>)}
              {exitPx != null && <span style={{...PB_DIM,marginLeft:"6px"}}>ladder regime-exit price at the short's expiry</span>}
            </PbLine>
            <PbLine label="mNAV used" labelWidth="120px">
              {num(mnav, v => <span style={{color:"#22d3ee",fontWeight:700}}>{v.toFixed(3)}</span>)}
              {mnav != null && <span style={{...PB_DIM,marginLeft:"6px"}}>
                {mnavHand != null ? "hand override" : "sheet rule: 0.9 + (BTC − 75,000) ÷ 100,000, clamped 0.65 to 1.525"}
              </span>}
            </PbLine>
            <PbLine label="NAV / share" labelWidth="120px">
              {num(navPerShare, v => <span style={{color:"#d0dde8",fontWeight:700}}>{pbPx(v)}</span>)}
              {navPerShare != null && sheetTag}
            </PbLine>
            <PbLine label="MSTR at exit" labelWidth="120px">
              {num(mstrTarget, v => <span style={{color:"#f97316",fontWeight:700}}>{pbPx(v)}</span>)}
              {mstrTarget != null && sheetTag}
            </PbLine>
            <PbLine label="MSTR move" labelWidth="120px">
              {num(mstrMovePct, v => <span style={{color:"#d0dde8",fontWeight:700}}>{(v*100).toFixed(1)}%</span>)}
              {mstrMovePct != null && sheetTag}
            </PbLine>
            <PbLine label="MSTX at exit" labelWidth="120px">
              {num(mstxTarget, v => <span style={{color:"#ef4444",fontWeight:700}}>{pbPx(v)}</span>)}
              {mstxTarget != null && sheetTag}
            </PbLine>
            <div style={{...PB_DIM,marginTop:"6px"}}>
              MSTR at exit = BTC × holdings ÷ shares × mNAV. MSTX at exit = MSTX now × (MSTR at exit ÷ MSTR now)^chop.
              Both are your sheet's assumptions, not a quote.
            </div>
            <div style={{...PB_DIM,marginTop:"4px",color:"#eab308"}}>
              1.85 is a ceiling for a two-week rally in the 9/12 study (plan 1.8, stress 1.6; selloffs run about 2.1);
              over 16 months daily-reset drag makes this mapping optimistic.
            </div>
          </div>
        </div>
      </div>

      {/* ── 2c. TRIGGER INPUTS ───────────────────────────────────────────── */}
      <div style={PB_CARD}>
        <div style={{display:"flex",alignItems:"baseline",justifyContent:"space-between",gap:"10px",flexWrap:"wrap",marginBottom:"10px"}}>
          <div style={PB_LABEL}>Trigger Inputs</div>
          <div style={PB_DIM}>
            {pb ? "refresh " + (pb.generated_at || "").replace("T"," ").replace("Z"," UTC")
                : pbErr ? "refresh not run (" + pbErr + ")" : "loading data/playbook.json…"}
          </div>
        </div>

        <div style={{overflowX:"auto"}}>
          <div style={{minWidth:"720px"}}>
            <div style={{display:"grid",gridTemplateColumns:"minmax(180px,1.5fr) 110px 66px 120px 108px 74px 96px",
              gap:"6px",...PB_LABEL,paddingBottom:"6px",borderBottom:"1px solid #0a1628"}}>
              <div>input</div><div>value</div><div>pass</div><div>source</div><div>as of</div><div>status</div><div>override</div>
            </div>
            {PB_TRIGGERS.map(t => {
              // informational IV rows read the iv block and take no override
              if (t.from === "iv") {
                const m = (pbIv && t.pick(pbIv)) || null;
                const v = m ? t.val(m) : null;
                return (
                  <div key={t.id} style={{display:"grid",
                    gridTemplateColumns:"minmax(180px,1.5fr) 110px 66px 120px 108px 74px 96px",gap:"6px",
                    padding:"7px 0",borderBottom:"1px solid #050d1c",alignItems:"center",fontSize:"11px"}}>
                    <div style={{color:"#b0c4d8"}}>{t.label}</div>
                    <div style={{color:"#f1f5f9",fontWeight:700}}>
                      {v == null ? <span style={{color:"#5a7fa0",fontWeight:400}}>
                        {m && m.error ? "source failed" : pb ? "source failed" : PB_HAND}</span> : t.fmt(v)}
                      {v != null && m && m.stale &&
                        <div style={{...PB_DIM,color:"#eab308"}}>today's fetch failed, ledger reading</div>}
                    </div>
                    <div><span style={{color:"#5a7fa0"}}>·</span></div>
                    <div style={{color:"#8aaac8",wordBreak:"break-word"}}>{v == null ? "·" : "alphaquery 30d"}</div>
                    <div style={{color:"#5a7fa0"}}>{(m && m.as_of) || "·"}</div>
                    <div>{m && m.stale
                      ? <PbChip text="stale" color="#eab308" bg="#1c1700" border="#3d2e00"/>
                      : <PbChip text="info" color="#6b8fae"/>}</div>
                    <div><span style={{color:"#5a7fa0"}}>·</span></div>
                  </div>
                );
              }
              const r = pbIn[t.id] || null;
              const comp = components.find(c => (c.input || c.id) === t.id);
              const bool = t.kind === "bool";
              const val = bool ? effBool(t.id) : effNum(t.id);
              const passState = bool ? val : (t.passAt ? (val == null ? null : t.passAt(val)) : undefined);
              const extra = r && t.extra ? t.extra(r) : null;
              const ivLabel = t.id === "iv_rank" && !isHand(t.id) && val != null ? ivRankLabel : null;
              return (
                <div key={t.id} style={{display:"grid",
                  gridTemplateColumns:"minmax(180px,1.5fr) 110px 66px 120px 108px 74px 96px",gap:"6px",
                  padding:"7px 0",borderBottom:"1px solid #050d1c",alignItems:"center",fontSize:"11px"}}>
                  <div style={{color:"#b0c4d8"}}>
                    {t.label}
                    {isHand(t.id) && <span style={{...PB_DIM,marginLeft:"6px",color:"#eab308"}}>by hand</span>}
                    {t.sub && <div style={PB_DIM}>{t.sub}</div>}
                  </div>
                  <div style={{color:"#f1f5f9",fontWeight:700}}>
                    {val == null ? <span style={{color:"#5a7fa0",fontWeight:400}}>{r && r.error ? "source failed" : PB_HAND}</span>
                      : bool ? (val ? "yes" : "no") : t.fmt(val)}
                    {extra && <span style={{...PB_DIM,marginLeft:"5px"}}>{" "}{extra}</span>}
                    {ivLabel && <div style={PB_DIM}>{ivLabel}</div>}
                    {t.id === "iv_rank" && val == null && rvProxy != null &&
                      <div style={PB_DIM}>rv-rank proxy {rvProxy.toFixed(0)}</div>}
                    {t.id === "iv_rank" && !isHand(t.id) && r && r.stale &&
                      <div style={{...PB_DIM,color:"#eab308"}}>today's fetch failed, ledger reading</div>}
                  </div>
                  <div>{passState === undefined ? <span style={{color:"#5a7fa0"}}>·</span>
                    : <PbVerdictChip state={passState}/>}</div>
                  <div style={{color:"#8aaac8",wordBreak:"break-word"}}>
                    {isHand(t.id) ? "hand" : (r && r.source) || "·"}
                  </div>
                  <div style={{color:"#5a7fa0"}}>{isHand(t.id) ? "·" : (r && r.as_of) || "·"}</div>
                  <div>{t.id === "iv_rank" && !isHand(t.id) && r && r.stale
                    ? <PbChip text="stale" color="#eab308" bg="#1c1700" border="#3d2e00"/>
                    : comp
                    ? <PbChip text={comp.adopted === true ? "ADOPTED" : (comp.status || "pending")}
                        color={comp.adopted === true ? "#22c55e" : pbStatusColor(comp.status)}/>
                    : <span style={{color:"#5a7fa0"}}>n/a</span>}</div>
                  <div>
                    {bool ? (
                      <select value={ovr[t.id]||""} onChange={e=>setOvr(o=>({...o,[t.id]:e.target.value}))}
                        style={{...PB_INPUT,fontSize:"10px",padding:"3px 4px",cursor:"pointer"}}>
                        <option value="">auto</option><option value="pass">pass</option><option value="fail">fail</option>
                      </select>
                    ) : (
                      <input value={ovr[t.id]||""} onChange={e=>setOvr(o=>({...o,[t.id]:e.target.value}))}
                        placeholder="auto" style={{...PB_INPUT,fontSize:"10px",padding:"3px 5px"}}/>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        {/* IV rank reference and the component notes behind the status chips */}
        <div style={{...PB_INNER,marginTop:"10px"}}>
          {pbStale && (
            <PbLine label="IV feed" labelWidth="120px">
              <span style={{display:"flex",gap:"8px",alignItems:"baseline",flexWrap:"wrap"}}>
                <PbChip text="stale" color="#eab308" bg="#1c1700" border="#3d2e00"/>
                <span style={{color:"#eab308"}}>
                  At least one implied-vol fetch failed on the last refresh. The IV rows show the newest
                  reading the ledger holds, dated by its own observation date, not by today.
                </span>
              </span>
            </PbLine>
          )}
          <PbLine label="IV rank ref" labelWidth="120px">
            <span style={PB_DIM}>{PB_IV_REFERENCE}</span>
          </PbLine>
          <PbLine label="Status notes" labelWidth="120px">
            <span style={{display:"flex",flexDirection:"column",gap:"3px"}}>
              {components.map(c => (
                <span key={c.id} style={{display:"flex",gap:"8px",alignItems:"baseline",flexWrap:"wrap"}}>

function BTCPowerLaw() {
  const today   = useMemo(()=>new Date(),[]);
  const todayTs = today.getTime();


  // LADDER | PLAYBOOK tab, persisted
  const [tab, setTab] = useState(() => {
    try { return localStorage.getItem("bql_tab") === "playbook" ? "playbook" : "ladder"; }
    catch(_) { return "ladder"; }
  });
  useEffect(() => { try { localStorage.setItem("bql_tab", tab); } catch(_) {} }, [tab]);

  const [priceStr,  setPriceStr]  = useState("85000");
  const [livePrice, setLivePrice] = useState(null);
  const [liveFetch, setLiveFetch] = useState("fetching…");
  const [liveUpdatedAt, setLiveUpdatedAt] = useState(null);
  const [liveHistory, setLiveHistory] = useState(null);
  const [lookupDate, setLookupDate] = useState(lookupDefaultDate);

  // EMA model: halfLifeYears=0 means Kaim fixed model
  const [halfLifeYears, setHalfLifeYears] = useState(0);
  const { A: modelA, B: modelB } = useMemo(() => {
    if (halfLifeYears === 0) return { A: JV_A, B: JV_B };
    return fitEMA(halfLifeYears * 365);
  }, [halfLifeYears]);
  const isJV = halfLifeYears === 0;

  // Fetch live BTC price + history
  useEffect(()=>{
    async function fetchPrice(){
      const apply = (p) => {
        setLivePrice(p);
        setPriceStr(Math.round(p).toString());
        setLiveFetch("live");
        setLiveUpdatedAt(new Date());
      };
      try {
        const res = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd");
        if(!res.ok) throw new Error();
        const j = await res.json();
        const p = j?.bitcoin?.usd;
        if(p) { apply(p); return; }
        throw new Error();
      } catch(_){}
      try { // fallback: Coinbase spot
        const res = await fetch("https://api.coinbase.com/v2/prices/BTC-USD/spot");
        if(!res.ok) throw new Error();
        const j = await res.json();
        const p = parseFloat(j?.data?.amount);
        if(p) { apply(p); return; }
        throw new Error();
      } catch(_){
        setLiveFetch("unavailable");
      }
    }
    async function fetchHistory(){
      try {
        const res = await fetch("https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=usd&days=365&interval=daily");
        if(!res.ok) throw new Error();
        const j = await res.json();
        if(j?.prices?.length > 100){
          // Merge: seed covers pre-2024, live covers last 365 days
          const liveStart = j.prices[0][0];
          const seedOld = SEED_PRICES.map(([ym,p])=>[new Date(ym+"-01").getTime(),p]).filter(([ts])=>ts < liveStart);
          setLiveHistory([...seedOld, ...j.prices]);
        }
      } catch(_){ /* fall back to seed */ }
    }
    fetchPrice();
    fetchHistory();
  },[]);

  const price = parseFloat(priceStr.replace(/[^0-9.]/g,""))||0;
  const fv    = fairValueAt(todayTs, modelA, modelB);
  const q     = priceToQuantile(price, todayTs, modelA, modelB);
  const {tier, idx: tierIdx} = getTier(q);
  const strikes = tierStrikes(tier, todayTs, modelA, modelB);
  const rotateUp   = tierIdx > 0 ? { t: LADDER[tierIdx-1], q: tier.qMax + HYST } : null;
  const rotateDown = tierIdx < LADDER.length-1 ? { t: LADDER[tierIdx+1], q: tier.qMin - HYST } : null;
  const inBuffer = (q > tier.qMin && q < tier.qMin + HYST) || (q < tier.qMax && q > tier.qMax - HYST && tier.qMax <= 100);
  const displayName = (name) => name;

  const [lightMode,  setLightMode]  = useState(false);

                        letterSpacing:"0.1em",marginBottom:"3px",fontWeight:600}}>{x.label}</div>
                      <div style={{fontSize:"18px",fontWeight:700,color:tier.color}}>{x.val}</div>
                      {x.hint && <div style={{fontSize:"10px",color:"#7a9ab8"}}>{x.hint}</div>}
                    </div>
                  ))}
                </div>
              </div>
            );
          })()}
      </div>

          {/* FORWARD PROJECTION TABLE */}
      <ForwardTable todayTs={todayTs} modelA={modelA} modelB={modelB}/>

      {/* PRICE LOOKUP */}
      <PriceLookup btcPrice={price} liveHistory={liveHistory} dateStr={lookupDate} setDateStr={setLookupDate} modelA={modelA} modelB={modelB}/>

      {/* POWER LAW CHART */}
      <PowerLawChart btcPrice={price} todayTs={todayTs} liveHistory={liveHistory} lookupTs={lookupDate ? Date.parse(lookupDate + "T00:00:00Z") : null} modelA={modelA} modelB={modelB}/>

      <div style={{marginTop:"24px",paddingTop:"16px",borderTop:"1px solid #0a1628"}}>
        <div style={{fontSize:"10px",color:"#3a5a78",textAlign:"center",letterSpacing:"0.12em",textTransform:"uppercase",fontWeight:500}}>
          Kaim Power Law Model  ·  A=5.82  ·  B=−17.029  ·  v2 — quantile-anchored PMCC ladder
        </div>
      </div>
      </>)}

      {tab === "playbook" && (
        <PlaybookTab todayTs={todayTs} btcPrice={price} priceStr={priceStr}
          livePrice={livePrice} liveFetch={liveFetch}
          liveHistory={liveHistory} modelA={modelA} modelB={modelB}/>
      )}
    </div>
  );
}


    function App() {
      const [unlocked, setUnlocked] = React.useState(() => sessionStorage.getItem('bql_ok') === '1');
      const [pin, setPin] = React.useState("");
      const [err, setErr] = React.useState(false);

      const attempt = () => {
        crypto.subtle.digest("SHA-256", new TextEncoder().encode(pin)).then(h => {
          const hex = [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("");
          if (hex === "60cafa03272449d4129f58adaa38cc9604e1d4c9c74362084ac4fac09b4d6f0d") {
            sessionStorage.setItem('bql_ok','1'); setUnlocked(true);
          } else {
            setErr(true); setPin(""); setTimeout(() => setErr(false), 2000);
          }
        });
      };

      if (unlocked) return <>
        <BTCPowerLaw />
      </>;

      return (
        <div style={{display:"flex",alignItems:"center",justifyContent:"center",
          minHeight:"100vh",background:"#020817",fontFamily:"var(--font, 'JetBrains Mono', monospace)"}}>
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:"11px",color:"#5a8fc0",textTransform:"uppercase",
              letterSpacing:"0.18em",marginBottom:"32px",fontWeight:600}}>BTC Quantile Ladder</div>
            <input type="password" maxLength={10} placeholder="····" value={pin}
              onChange={e => setPin(e.target.value)}
              onKeyDown={e => e.key === "Enter" && attempt()}
              style={{background:"#070f1f",border:"1px solid #0f2a42",borderRadius:"6px",
                color:"#facc15",fontSize:"20px",fontFamily:"inherit",padding:"12px 18px",
                width:"160px",outline:"none",textAlign:"center",letterSpacing:"0.3em"}}/>
            <div style={{marginTop:"16px"}}>
              <button onClick={attempt}
                style={{background:"#070f1f",border:"1px solid #1a3a5c",borderRadius:"6px",
                  color:"#8aaac8",fontSize:"11px",fontFamily:"inherit",padding:"10px 24px",
                  cursor:"pointer",letterSpacing:"0.1em",textTransform:"uppercase",fontWeight:600}}>
                Enter
              </button>
            </div>
            <div style={{color:"#ef4444",fontSize:"11px",marginTop:"12px",
              letterSpacing:"0.06em",opacity:err?1:0,transition:"opacity 0.2s"}}>
              incorrect passcode
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
  <script>
    function applyMobileStyles() {
      const mobile = window.innerWidth <= 700;
      const existing = document.getElementById('m');
      if (!mobile) {
        if (existing) existing.remove();
        return;
      }
      if (existing) return;
      const s = document.createElement('style');
      s.id = 'm';
      s.textContent = `
        /* Stat cards: 4-col → 2-col */
        #root [style*="repeat(4, 1fr)"] { grid-template-columns: repeat(2,1fr) !important; }
        /* Price lookup: 6-col → 3-col */
        #root [style*="repeat(6, 1fr)"] { grid-template-columns: repeat(3,1fr) !important; }
        /* Income/margin grids: 5-col → 2-col + last full-width */
        #root [style*="repeat(5, 1fr)"] { grid-template-columns: repeat(2,1fr) !important; }
        #root [style*="repeat(5, 1fr)"] > *:nth-child(5) { grid-column: 1 / -1 !important; }
        /* Horizontal scroll for preset buttons */
        #root [style*="flex-wrap: wrap"][style*="gap: 4px"] { 
          flex-wrap: nowrap !important; overflow-x: auto !important; 
          -webkit-overflow-scrolling: touch !important; padding-bottom: 4px !important;
          scrollbar-width: none !important;
        }
        #root [style*="flex-wrap: wrap"][style*="gap: 4px"]::-webkit-scrollbar { display: none !important; }
        /* Header row: stack on mobile */
        #root [style*="justify-content: space-between"][style*="gap: 8px"] { flex-wrap: wrap !important; }
        /* Tier card: stack text above circles */
        #root [style*="justify-content: space-between"][style*="gap: 16px"] { 
          flex-direction: column !important; align-items: flex-start !important; 
        }
        /* Quantile rail: stack name over range, taller container */
        #root [style*="height: 40px"][style*="position: relative"] { height: 52px !important; }
        #root [style*="overflow: hidden"][style*="gap: 5px"][style*="position: absolute"] { flex-direction: column !important; gap: 1px !important; }
        #root [style*="overflow: hidden"][style*="gap: 5px"][style*="position: absolute"] > span { font-size: 8px !important; }
        /* Band dial: slightly smaller on mobile, keep two-line text proportions */
        #root [style*="width: 68px"][style*="height: 68px"] { width: 58px !important; height: 58px !important; }
        #root [style*="width: 68px"][style*="height: 68px"] > div:first-child { font-size: 13px !important; }
        #root [style*="width: 68px"][style*="height: 68px"] > div:last-child { font-size: 8px !important; }
        /* Model selector: wrap */
        #root [style*="margin-left: 4px"][style*="gap: 8px"] { flex-wrap: wrap !important; }
        #root [style*="margin-left: 4px"][style*="gap: 8px"] > * { min-width: 0 !important; }
        /* Forward projection table: smaller font */
        #root [style*="gridTemplateColumns"][style*="60px"] { font-size: 10px !important; }
        /* Instrument name: smaller on mobile */
        #root [style*="font-size: 28px"] { font-size: 22px !important; }
        /* General: tighter padding */
        #root > div > div { padding-left: 12px !important; padding-right: 12px !important; }
      `;
      document.head.appendChild(s);
    }
    // Run after React mounts content
    const _observer = new MutationObserver(() => applyMobileStyles());
    _observer.observe(document.getElementById('root'), {childList:true, subtree:false});
    window.addEventListener('resize', applyMobileStyles);
    // Also run once on load in case observer fires too early
    window.addEventListener('load', applyMobileStyles);
  </script>
</body>
