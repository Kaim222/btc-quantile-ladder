// Derive SEED_PRICES as ["YYYY-MM", price] pairs from BTC_HISTORY for chart merge
const SEED_PRICES = BTC_HISTORY.map(({days, price}) => {
  const d = new Date(GENESIS.getTime() + days * 86400000);
  const ym = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
  return [ym, price];
});

// Fit EMA-weighted power law regression. halfLifeDays=Infinity → Kaim fixed.
function fitEMA(halfLifeDays) {
  if (!halfLifeDays || halfLifeDays >= 1e9) return { A: JV_A, B: JV_B };
  const todayDays = (Date.now() - GENESIS_MS) / 86400000;
  let sw=0, swx=0, swy=0, swxx=0, swxy=0;
  for (const {days, price} of BTC_HISTORY) {
    const age = todayDays - days;
    const w = Math.exp(-Math.LN2 * age / halfLifeDays);
    const x = Math.log10(days);
    const y = Math.log10(price);
    sw   += w;
    swx  += w * x;
    swy  += w * y;
    swxx += w * x * x;
    swxy += w * x * y;
  }
  const denom = sw * swxx - swx * swx;
  if (Math.abs(denom) < 1e-12) return { A: JV_A, B: JV_B };
  const A = (sw * swxy - swx * swy) / denom;
  const B = (swy - A * swx) / sw;
  return { A, B };
}

function daysFromGenesis(ts) {
  return (ts - GENESIS_MS) / 86400000;
}
function fairValueAt(ts, A=JV_A, B=JV_B) {
  const d = daysFromGenesis(ts);
  return d > 0 ? Math.pow(10, A * Math.log10(d) + B) : 0;
}

// Band offsets — upper bands decay linearly over time (empirical fit)
// offset(days) = m * days + c  for 99.9%, 95%, 85%
// constant for 50%, 15%, 0.1%
// Upper bands: cap decay at today's day count (matches Excel MIN(days,today) fix)
// Without this, 99.9th crosses below 95th at ~day 9578 and 85th hits 50th at ~day 9171
const TODAY_DAYS = (Date.now() - GENESIS_MS) / 86400000;
function bandOffset(mSlope, cIntercept, ts) {
  const days = (ts - GENESIS_MS) / 86400000;
  // For decaying bands (m < 0), cap at today's value so projections don't collapse
  const effectiveDays = mSlope < 0 ? Math.min(days, TODAY_DAYS) : days;
  return mSlope * effectiveDays + cIntercept;
}

const BAND_DEFS = [
  { q: 99.9, m: -0.0000756204, c:  0.7434,  label: "99.9%", color: "#3b82f6", dash: "2,4", w: 0.8, dim: true },

  { q: 85,   m: -0.0000516698, c:  0.4318,  label: "85%",   color: "#22c55e", dash: "",    w: 1.4 },
  { q: 50,   m:  0,            c: -0.000400, label: "50%",   color: "#22d3ee", dash: "",    w: 1.4 },
  { q: 15,   m:  0,            c: -0.209200, label: "15%",   color: "#f97316", dash: "",    w: 1.4 },

// BANDS with offset computed at current time (for gauge/quantile calc)
const BANDS = BAND_DEFS.map(b => ({ ...b, offset: bandOffset(b.m, b.c, Date.now()) }));

function bandPriceAt(ts, bandDef, A=JV_A, B=JV_B) {
  const offset = bandOffset(bandDef.m, bandDef.c, ts);
  return fairValueAt(ts, A, B) * Math.pow(10, offset);
}

function priceToQuantile(price, ts, A=JV_A, B=JV_B) {
  const fv = fairValueAt(ts, A, B);
  if (!fv || price <= 0) return 50;
  const res = Math.log10(price / fv);
  // Compute offsets fresh for the given timestamp (upper bands decay over time)
  const bands = BAND_DEFS.map(b => ({ ...b, offset: bandOffset(b.m, b.c, ts) }));
  // Interpolate between calibration points
  for (let i = 0; i < bands.length - 1; i++) {
    const hi = bands[i], lo = bands[i + 1];
    if (res <= hi.offset && res >= lo.offset) {
      const t = (res - lo.offset) / (hi.offset - lo.offset);
      return lo.q + t * (hi.q - lo.q);
    }
  }
  if (res > bands[0].offset) {
    // Above 99.9th — extrapolate
    const slope = (bands[0].q - bands[1].q) / (bands[0].offset - bands[1].offset);
    return Math.min(99.99, bands[0].q + slope * (res - bands[0].offset));
  }
  // Below 0.1st — extrapolate
  const slope = (bands[bands.length-2].q - bands[bands.length-1].q) /
                (bands[bands.length-2].offset - bands[bands.length-1].offset);
  return Math.max(0.01, bands[bands.length-1].q + slope * (res - bands[bands.length-1].offset));
}

// ─────────────────────────────────────────────────────────────────────────────
// INSTRUMENT LADDER
// ─────────────────────────────────────────────────────────────────────────────
// Quantile → price at any date (inverse of priceToQuantile; interpolates band offsets)
function quantileToPrice(qq, ts, A=JV_A, B=JV_B) {
  const fv = fairValueAt(ts, A, B);
  const bands = BAND_DEFS.map(b => ({ q: b.q, offset: bandOffset(b.m, b.c, ts) }));
  let offset;
  if (qq >= bands[0].q) {
    const s = (bands[0].offset - bands[1].offset) / (bands[0].q - bands[1].q);
    offset = bands[0].offset + s * (qq - bands[0].q);
  } else if (qq <= bands[bands.length-1].q) {
    const a = bands[bands.length-2], z = bands[bands.length-1];
    const s = (a.offset - z.offset) / (a.q - z.q);
    offset = z.offset + s * (qq - z.q);
  } else {
    for (let i = 0; i < bands.length - 1; i++) {
      const hi = bands[i], lo = bands[i+1];
      if (qq <= hi.q && qq >= lo.q) {
        const t = (qq - lo.q) / (hi.q - lo.q);
        offset = lo.offset + t * (hi.offset - lo.offset);
        break;
      }
    }
  }
  return fv * Math.pow(10, offset);
}

function addMonths(ts, mo) { const d = new Date(ts); d.setMonth(d.getMonth() + mo); return d.getTime(); }
function fmtMonth(ts) { return new Date(ts).toLocaleDateString("en-US", { month: "short", year: "numeric" }); }

// The band is read on the monthly close. The lines get crossed about three times a year on the daily; a touch is not a rotation.
// liveHistory is [[ts, price], ...] daily (CoinGecko dates each point at 00:00 UTC, so the point on the 1st is the prior month's close).
function monthlyClose(liveHistory, nowTs) {
  if (!Array.isArray(liveHistory) || liveHistory.length < 2) return null;
  const n = new Date(nowTs), m0 = Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), 1);
  // the daily points sit at 00:00 UTC; the last element is the live price and never counts as a close
  const pt = liveHistory.slice(0, -1).find(p => Array.isArray(p) && p[0] >= m0 && p[0] < m0 + 3600000 && p[1] > 0);
  return pt ? { ts: m0 - 1, price: pt[1] } : null;    // no boundary point yet: the caller reads the live price and says so
}

function getTier(q) {
  const idx = LADDER.findIndex(t => q >= t.qMin && q < t.qMax);
  const i = idx >= 0 ? idx : (q >= LADDER[0].qMax ? 0 : LADDER.length - 1);
  return { tier: LADDER[i], idx: i };
}

// Strike computation for a pmcc tier at a given "now"
function tierStrikes(t, nowTs, A=JV_A, B=JV_B) {
  if (t.kind !== "pmcc") return null;
  const longTs  = addMonths(nowTs, t.longMo);
  const shortTs = nowTs + t.shortDays * 86400000;      // 90 days, the same clock the monitor's band push uses
  return {
    long:  { q: t.longQ,  ts: longTs,  price: quantileToPrice(t.longQ,  longTs,  A, B), mo: t.longMo },
    short: { q: t.shortQ, ts: shortTs, price: quantileToPrice(t.shortQ, shortTs, A, B), days: t.shortDays },
  };
}

// Margin framework math (per $1 equity): position = L, borrowed = L-1
function marginStats(m) {
  const carry = m.leverage * m.yield - (m.leverage - 1) * m.rate;           // net carry on equity
  const callDD = 1 - (m.leverage - 1) / (m.leverage * (1 - m.maint));      // drawdown to margin call
  return { carry, callDD, callPx: 100 * (1 - callDD) };
}

function useMstrUnits() {
  const [u, setU] = useState({bps:null, strc:null, slope:null, now:null});
  useEffect(() => {
    let on = true;
    const num = x => (x != null && x !== "" && x !== "auto" && isFinite(Number(x))) ? Number(x) : null;
    const jf = url => fetch(url, {cache:"no-store"})
      .then(r => { if (!r.ok) throw 0; return r.json(); }).catch(() => null);
    const quote = k => msQuote({price: Number(k.price), ts: k.timeStamp,
      ext: k.extendedSession || null}, msOpen(new Date()));
    jf("data/mstr-config.json?t=" + Date.now()).then(c => {
      if (!on) return;
      const cfg = isObj(c) ? c : {};
      const sl = num(cfg.btc_slope_per_2500), h = num(cfg.btc_held), sh = num(cfg.shares_m);
      if (sl != null) setU(v => ({...v, slope: sl}));
      if (h && sh) { setU(v => ({...v, bps: h / (sh * 1e6)})); return; }  // the file overrides
      jf("https://api.strategy.com/btc/bitcoinKpis").then(j => {
        if (!on) return; const k = j && j.results; if (!isObj(k)) return;
        const held = Number(String(k.btcHoldings).replace(/,/g, "")), sps = Number(k.satsPerShare);
        if (!(held > 100000) || !(sps > 0)) return;
        const shM = held / (sps / 1e8) / 1e6;
        setU(v => ({...v, bps: (h || held) / ((sh || shM) * 1e6)})); });
    });
    jf("https://api.strategy.com/btc/strcKpiData").then(j => { if (!on) return;
      const k = Array.isArray(j) ? j[0] : j; if (!isObj(k)) return;
      const q = quote(k); if (q) setU(v => ({...v, strc: q.px})); });
    jf("https://api.strategy.com/btc/mstrKpiData").then(j => { if (!on) return;
      const k = Array.isArray(j) ? j[0] : j; if (!isObj(k)) return;
      const q = quote(k); if (q) setU(v => ({...v, now: q.px})); });
    return () => { on = false; };
  }, []);
  const ready = u.bps != null && u.strc != null && u.slope != null;
  // the slope term rides the row's own BTC price, exactly as the sheet rule is written
  const conv = b => (!ready || !(b > 0)) ? null
    : b * u.bps * Math.min(2.0, msStrc(u.strc) + u.slope * (b - 75000) / 2500);   // target mNAV capped at 2.0 for far-out BTC prices
  return {...u, ready, conv};
}

function thirdFriday(year, month) { // month 0-11, returns UTC ts
  const first = new Date(Date.UTC(year, month, 1));
  const dow = first.getUTCDay();
  const firstFri = 1 + ((5 - dow + 7) % 7);
  return Date.UTC(year, month, firstFri + 14);
}
function nextOpex(ts, dir) { // dir +1 / -1: nearest monthly opex strictly beyond ts
  const d = new Date(ts);
  let y = d.getUTCFullYear(), m = d.getUTCMonth();
  for (let i = 0; i < 24; i++) {
    const tf = thirdFriday(y, m);
    if (dir > 0 && tf > ts) return tf;
    if (dir < 0 && tf < ts) return tf;
    m += dir;
    if (m > 11) { m = 0; y++; }
    if (m < 0)  { m = 11; y--; }
  }
  return ts;
}
const tsToDateStr = ts => new Date(ts).toISOString().slice(0, 10);

function priceOn(history, ts) {
  // nearest historical point within tolerance (10d daily era, 40d monthly seed era)
  if (!history || !history.length) return null;
  let best = null, bd = Infinity;
  for (const [t, p] of history) {
    const d = Math.abs(t - ts);
    if (d < bd) { bd = d; best = [t, p]; }
  }
  if (!best) return null;
  const tol = best[0] > Date.parse("2025-08-01") ? 10 : 40;
  return bd <= tol * 86400000 ? { ts: best[0], price: best[1] } : null;
}

function lookupDefaultDate() {
  try {
    const saved = localStorage.getItem("lookupDate");
    if (saved && Date.parse(saved + "T00:00:00Z") > Date.now()) return saved;
  } catch(_) {}
  return tsToDateStr(nextOpex(Date.now(), 1));
}

function PowerLawChart({ btcPrice, todayTs, liveHistory, lookupTs, modelA=JV_A, modelB=JV_B }) {
  const canvasRef = useRef(null);

  // Chart dimensions
  const W = 900, H = 420, PAD = {t:30, r:20, b:40, l:65};
  const cw = W - PAD.l - PAD.r, ch = H - PAD.t - PAD.b;

  // Time range: 2011-01-01 to +5 years
  const tMin = new Date("2011-01-01").getTime();
  const tMax = new Date(new Date().getFullYear() + 5, 11, 31).getTime();

  // Price range in log scale — tighter ceiling to reduce dead space
  const pMin = Math.log10(0.3);     // $0.30
  const pMax = Math.log10(1000000); // $1M

  const tx = ts => PAD.l + cw * (ts - tMin) / (tMax - tMin);
  const ty = logP => PAD.t + ch * (1 - (logP - pMin) / (pMax - pMin));

  // Build band curves (monthly resolution)
  const months = [];
  {
    const d = new Date(2011, 0, 1);
    const end = new Date(new Date().getFullYear() + 5, 11, 31);
    while (d <= end) {
      months.push(d.getTime());
      d.setMonth(d.getMonth() + 1);
    }
  }

  // Band fill areas (between adjacent bands)
  const bandFills = useMemo(() => {
    const fills = [];
    const bandPairs = [
      { upper: BAND_DEFS[2], lower: BAND_DEFS[3], color: "#22d3ee", opacity: 0.07 },  // 50-85  IBIT
      { upper: BAND_DEFS[3], lower: BAND_DEFS[4], color: "#f97316", opacity: 0.07 },  // 15-50  MSTR
      { upper: BAND_DEFS[4], lower: BAND_DEFS[5], color: "#ef4444", opacity: 0.07 },  // 0.1-15 MSTX
      { upper: BAND_DEFS[1], lower: BAND_DEFS[2], color: "#22c55e", opacity: 0.05 },  // 85-95  STRC
    ];
    for (const {upper, lower, color, opacity} of bandPairs) {
      let pathUp = "", pathDn = "";
      for (let i = 0; i < months.length; i++) {
        const ts = months[i];
        const pU = bandPriceAt(ts, upper, modelA, modelB);
        const pL = bandPriceAt(ts, lower, modelA, modelB);
        if (pU <= 0 || pL <= 0) continue;
        const x = tx(ts);
        const yU = ty(Math.log10(Math.min(pU, 1e6)));
        const yL = ty(Math.log10(pL));
        pathUp += (pathUp ? "L" : "M") + x.toFixed(1) + "," + yU.toFixed(1);
        pathDn = x.toFixed(1) + "," + yL.toFixed(1) + (pathDn ? "L" : "") + pathDn;
      }
      fills.push({ d: pathUp + "L" + pathDn + "Z", color, opacity });
    }
    return fills;
  }, [months, modelA, modelB]);

  // Band lines
  const bandLines = useMemo(() => {
    return BAND_DEFS.map(b => {
      let d = "";
      for (const ts of months) {
        const p = bandPriceAt(ts, b, modelA, modelB);
        if (p <= 0) continue;
        const x = tx(ts), y = ty(Math.log10(p));
        d += (d ? "L" : "M") + x.toFixed(1) + "," + y.toFixed(1);
      }
      return { ...b, d };
    });
  }, [months, modelA, modelB]);

  // Historical price line from seed + live data
  const pricePath = useMemo(() => {
    const pts = [];
    // Use BTC_HISTORY (monthly seed) for pre-live data
    for (const {days, price} of BTC_HISTORY) {
      const ts = GENESIS_MS + days * 86400000;
      if (ts >= tMin && ts <= tMax && price > 0) {
        pts.push([ts, price]);
      }
    }
    // Overlay live data — downsample daily to weekly to match seed density
    if (liveHistory) {
      const weekMs = 7 * 86400000;
      const buckets = new Map();
      for (const [ts, price] of liveHistory) {
        if (ts >= tMin && ts <= tMax && price > 0) {
          const weekKey = Math.floor(ts / weekMs);
          const existing = buckets.get(weekKey);
          // Keep the last data point in each week
          if (!existing || ts > existing[0]) buckets.set(weekKey, [ts, price]);
        }
      }
      for (const [, pt] of buckets) pts.push(pt);
    }
    // Sort and deduplicate: keep one point per ~7-day window
    pts.sort((a,b) => a[0] - b[0]);
    const deduped = [];
    for (const pt of pts) {
      if (deduped.length === 0 || pt[0] - deduped[deduped.length-1][0] > 5*86400000) {
        deduped.push(pt);
      }
    }
    // Build smooth SVG path using Catmull-Rom → cubic bezier conversion
    if (deduped.length < 2) return "";
    const points = deduped.map(([ts, price]) => [tx(ts), ty(Math.log10(price))]);
    let d = `M${points[0][0].toFixed(1)},${points[0][1].toFixed(1)}`;
    for (let i = 0; i < points.length - 1; i++) {
      const p0 = points[Math.max(0, i - 1)];
      const p1 = points[i];
      const p2 = points[i + 1];
      const p3 = points[Math.min(points.length - 1, i + 2)];
      // Catmull-Rom to cubic bezier control points (tension=0.5)
      const cp1x = p1[0] + (p2[0] - p0[0]) / 6;
      const cp1y = p1[1] + (p2[1] - p0[1]) / 6;
      const cp2x = p2[0] - (p3[0] - p1[0]) / 6;
      const cp2y = p2[1] - (p3[1] - p1[1]) / 6;
      d += ` C${cp1x.toFixed(1)},${cp1y.toFixed(1)} ${cp2x.toFixed(1)},${cp2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
    }
    return d;
  }, [liveHistory]);

  // Y-axis labels
  const yLabels = [1, 10, 100, 1000, 10000, 100000, 1000000];

  // X-axis labels
  const xLabels = [];
  for (let yr = 2012; yr <= new Date().getFullYear() + 5; yr += 2) {
    const ts = new Date(yr, 0, 1).getTime();
    if (ts >= tMin && ts <= tMax) xLabels.push({ yr, ts });
  }

  // Today marker
  const todayX = tx(todayTs);
  const priceY = btcPrice > 0 ? ty(Math.log10(btcPrice)) : null;

  return (
    <div style={{background:"#040c1a",border:"1px solid #0a1628",borderRadius:"6px",padding:"16px 18px",marginTop:"14px"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"10px"}}>
        <div style={{fontSize:"11px",color:"#5a8fc0",textTransform:"uppercase",letterSpacing:"0.12em",fontWeight:600}}>
          Power Law Bands
        </div>
        {/* Legend */}
        <div style={{display:"flex",gap:"10px",flexWrap:"wrap",alignItems:"center"}}>
          <div style={{display:"flex",alignItems:"center",gap:"5px"}}>
            <div style={{width:"14px",height:"2.5px",background:"#f1f5f9",borderRadius:"1px"}}/>
            <span style={{fontSize:"11px",color:"#8aaac8",fontWeight:700}}>BTC</span>
          </div>
          {[...BAND_DEFS].reverse().map(b => (
            <div key={b.q} style={{display:"flex",alignItems:"center",gap:"5px"}}>
              <div style={{width:"14px",height:"2.5px",background:b.color,borderRadius:"1px",opacity:0.9}}/>
              <span style={{fontSize:"11px",color:b.color,fontWeight:700}}>{b.label}</span>
            </div>
          ))}
        </div>
      </div>
      <div style={{overflowX:"auto"}}>
        <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",maxWidth:`${W}px`,height:"auto",display:"block"}}>
          {/* Background */}
          <rect x={PAD.l} y={PAD.t} width={cw} height={ch} fill="#070f1f" rx="2"/>

          {/* Grid lines */}
          {yLabels.map(v => {
            const y = ty(Math.log10(v));
            return y >= PAD.t && y <= PAD.t + ch ? (
              <line key={v} x1={PAD.l} x2={PAD.l+cw} y1={y} y2={y} stroke="#0d1e30" strokeWidth="0.5"/>
            ) : null;
          })}

          {/* Band fills */}
          {bandFills.map((f,i) => (
            <path key={i} d={f.d} fill={f.color} opacity={f.opacity}/>
          ))}

          {/* Band lines */}
          {bandLines.map(b => (
            <path key={b.q} d={b.d} fill="none" stroke={b.color} strokeWidth={b.w} opacity={b.dim ? 0.35 : 0.9}
              strokeDasharray={b.dash}/>
          ))}

          {/* Historical price line */}
          <path d={pricePath} fill="none" stroke="#f1f5f9" strokeWidth="1.2" opacity="0.85"/>

          {/* Today vertical line */}
          <line x1={todayX} x2={todayX} y1={PAD.t} y2={PAD.t+ch}
            stroke="#22d3ee" strokeWidth="0.5" strokeDasharray="3,3" opacity="0.4"/>
          <text x={todayX} y={PAD.t-6} fill="#22d3ee" fontSize="11" textAnchor="middle" opacity="0.7">TODAY</text>

          {/* Lookup-date marker */}
          {lookupTs && Math.abs(lookupTs - todayTs) > 86400000 && (() => {
            const lx = tx(lookupTs);
            if (lx < PAD.l || lx > PAD.l + cw) return null;
            const past = lookupTs < todayTs;
            const h = past ? priceOn(liveHistory, lookupTs) : null;
            const hy = h ? ty(Math.log10(h.price)) : null;
            return (
              <>
                <line x1={lx} x2={lx} y1={PAD.t} y2={PAD.t+ch}
                  stroke="#7dd3fc" strokeWidth="1" strokeDasharray="2,4" opacity="0.5"/>
                {h && hy >= PAD.t && hy <= PAD.t+ch && (() => {
                  const lw = String(fmtFull(h.price)).length*8+12;
                  const flip = lx > todayX - 130; // avoid TODAY pill collision
                  const rx = flip ? lx-8-lw : lx+8;
                  return (
                    <>
                      <circle cx={lx} cy={hy} r="4" fill="#7dd3fc" stroke="#020817" strokeWidth="2"/>
                      <rect x={rx} y={hy-9.5} width={lw} height="19" rx="3" fill="#020817" opacity="0.85"/>
                      <text x={rx+5} y={hy+4.5} fill="#7dd3fc" fontSize="13" fontWeight="700">{fmtFull(h.price)}</text>
                    </>
                  );
                })()}
              </>
            );
          })()}

          {/* Current price dot */}
          {priceY !== null && priceY >= PAD.t && priceY <= PAD.t+ch && (
            <>
              <circle cx={todayX} cy={priceY} r="5" fill="#facc15" stroke="#020817" strokeWidth="2"/>
              {/* Price label with dark background for readability over band lines */}
              <rect x={todayX+9} y={priceY-9.5} width={String(fmtFull(btcPrice)).length*8+12} height="19" rx="3" fill="#020817" opacity="0.85"/>
              <text x={todayX+14} y={priceY+4.5} fill="#facc15" fontSize="13" fontWeight="700">
                {fmtFull(btcPrice)}
              </text>
            </>
          )}

          {/* Y-axis labels */}
          {yLabels.map(v => {
            const y = ty(Math.log10(v));
            return y >= PAD.t && y <= PAD.t + ch ? (
              <text key={v} x={PAD.l-6} y={y+4} fill="#7aa5c8" fontSize="11" textAnchor="end">
                {v >= 1e6 ? "$"+v/1e6+"M" : v >= 1e3 ? "$"+v/1e3+"K" : "$"+v}
              </text>
            ) : null;
          })}

          {/* X-axis labels */}
          {xLabels.map(({yr,ts}) => (
            <text key={yr} x={tx(ts)} y={PAD.t+ch+18} fill="#7aa5c8" fontSize="11" textAnchor="middle">{yr}</text>
          ))}
        </svg>
      </div>
    </div>
  );
}

const TCOL = {ENTRY:"#22c55e", HOLD:"#facc15", OFF:"#ef4444", UNKNOWN:"#8aaac8"};

const LAB = {fontSize:10,color:"#5a8fc0",textTransform:"uppercase",letterSpacing:"0.12em",fontWeight:600};

const GST = {background:"transparent",border:"1px solid #162840",borderRadius:3,color:"#4a7a9b",
  fontSize:11,fontFamily:"inherit",fontWeight:600,letterSpacing:"0.1em",textTransform:"uppercase",
  padding:"4px 8px",cursor:"pointer"};
const isObj = o => o !== null && typeof o === "object" && !Array.isArray(o);
const rowsOf = v => (Array.isArray(v) ? v.filter(isObj) : []);
function useLocal(key, initial, fix) {
  const [v, setV] = useState(() => { try { const s = localStorage.getItem(key);
    return s === null ? initial : fix(JSON.parse(s)); } catch(_) { return initial; } });
  useEffect(() => { try { localStorage.setItem(key, JSON.stringify(v)); } catch(_) {} }, [key, v]);
  return [v, setV]; }
const nm = s => { if (s == null) return null;
  const n = parseFloat(String(s).replace(/[^0-9.\-]/g, "")); return isNaN(n) ? null : n; };
const md = s => String(s||"").slice(5,10).replace(/^0?(\d+)-0?(\d+)$/, "$1/$2") || null;
const sgn = v => (v >= 0 ? "+" : "") + Math.round(v);
// phase bounds read "through X", "A to B" or "from A"
const phBnd = s => { const x = String(s||""), m = x.match(/\d{4}-\d{2}-\d{2}/g) || [];
  return /^through/i.test(x) ? [null,m[0]] : /^from/i.test(x) ? [m[0],null] : [m[0],m[1]]; };

// ── What 200 LEAPS units cost, day by day. Model estimate from tools/leaps_cost.py, checked against the days both legs
// really traded. Numbers live in data/leaps-cost.json. ──
function LeapsCost({ lc }) {
  const [hv, setHv] = useState(null);
  const rows = (lc && Array.isArray(lc.series)) ? lc.series.filter(r => r && typeof r.cost === "number") : [];
  if (rows.length < 5) return null;
  const W = 720, H = 250, P = {l:46, r:10, t:14, b:22}, cw = W - P.l - P.r, ch = H - P.t - P.b;
  const top = Math.ceil(Math.max(...rows.map(r => r.cost)) / 25000) * 25000;
  const xAt = i => P.l + cw * i / (rows.length - 1), yAt = v => P.t + ch * (1 - v / top);
  const path = (k, a, b) => rows.slice(a, b).map((r, i) => r[k] == null ? "" :
    (i && rows[a+i-1][k] != null ? "L" : "M") + xAt(a+i).toFixed(1) + " " + yAt(r[k]).toFixed(1)).join("");
  const li = Math.max(0, rows.findIndex(r => r.d >= lc.long_first_trade));
  const usd = v => "$" + Math.round(v).toLocaleString("en-US"), k = v => "$" + Math.round(v/1000) + "k";
  const ref = isObj(lc.ref) ? lc.ref : {}, now = ref.today || rows[rows.length-1];
  const cards = [["TODAY","today"],["1 MONTH AGO","month_ago"],["2 MONTHS AGO","two_months_ago"],["LOW","low"]].filter(c => isObj(ref[c[1]]));
  const pick = e => { const b = e.currentTarget.getBoundingClientRect();
    const cx = (e.touches && e.touches[0] ? e.touches[0].clientX : e.clientX) - b.left;
    const i = Math.round((cx / b.width * W - P.l) / cw * (rows.length - 1));
    setHv(Math.min(rows.length - 1, Math.max(0, i))); };
  const h = hv == null ? null : rows[hv];
  const prints = Array.isArray(lc.prints) ? lc.prints.map(p => ({...p, i: rows.findIndex(r => r.d === p.d)})).filter(p => p.i >= 0) : [];
  const SC = {background:"#070f1f",border:"1px solid #0f2035",borderRadius:"6px",padding:"10px 12px"};
  return (
    <div style={{marginTop:16}}>
      <div style={{...HD,marginBottom:4}}>{"COST OF " + (lc.units||200) + " LEAPS UNITS, DAY BY DAY"}</div>
      <div style={{fontSize:11,color:"#7a9ab8",marginBottom:9}}>{String(lc.unit||"")}</div>
      <svg viewBox={"0 0 " + W + " " + H} style={{width:"100%",height:"auto",display:"block",touchAction:"pan-y"}}
        onMouseMove={pick} onMouseLeave={() => setHv(null)} onTouchStart={pick} onTouchMove={pick}>
        <rect x={P.l} y={P.t} width={cw} height={ch} fill="#070f1f" rx="2"/>
        {Array.from({length: top/25000 + 1}, (_, n) => n * 25000).map(v => <g key={v}>
          <line x1={P.l} x2={P.l+cw} y1={yAt(v)} y2={yAt(v)} stroke="#0f2035" strokeWidth="0.7"/>
          <text x={P.l-5} y={yAt(v)+3} fill="#7aa5c8" fontSize="9" textAnchor="end">{k(v)}</text></g>)}
        {li > 0 && <g><line x1={xAt(li)} x2={xAt(li)} y1={P.t} y2={P.t+ch} stroke="#facc15" strokeWidth="0.8"
          strokeDasharray="3 3" opacity="0.6"/>
          <text x={xAt(li)-4} y={P.t+10} fill="#facc15" fontSize="8" textAnchor="end">Dec 2028 $33 first traded</text></g>}
        {li > 0 && <path d={path("cost", 0, li+1)} fill="none" stroke="#22d3ee" strokeWidth="1.3" strokeDasharray="4 3" opacity="0.55"/>}
        <path d={path("cost", li, rows.length)} fill="none" stroke="#22d3ee" strokeWidth="1.6"/>
        <path d={path("avg10", 0, rows.length)} fill="none" stroke="#facc15" strokeWidth="1.1" opacity="0.8"/>
        {prints.map(p => <circle key={p.d} cx={xAt(p.i)} cy={yAt(p.cost)} r="2.6" fill="#f1f5f9"/>)}
        {h && <g><line x1={xAt(hv)} x2={xAt(hv)} y1={P.t} y2={P.t+ch} stroke="#e2e8f0" strokeWidth="0.6" opacity="0.5"/>
          <circle cx={xAt(hv)} cy={yAt(h.cost)} r="3" fill="#22d3ee"/></g>}
        <text x={P.l} y={H-6} fill="#7aa5c8" fontSize="9">{md(rows[0].d)}</text>
        <text x={P.l+cw} y={H-6} fill="#7aa5c8" fontSize="9" textAnchor="end">{md(rows[rows.length-1].d)}</text>
      </svg>
      <div style={{fontSize:11,color:"#b0c4d8",minHeight:16,marginTop:4}}>
        {h ? h.d + " · MSTX $" + h.mstx.toFixed(2) + " · unit $" + h.unit.toFixed(2) + " · " + (lc.units||200) + " units " + usd(h.cost)
           : "Cyan: model cost. Amber: 10-day average. White dots: days both legs really traded. Dashed: before the long leg existed."}</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(118px,1fr))",gap:"8px",marginTop:9}}>
        {cards.map(([t, key]) => { const r = ref[key], ch2 = now.cost / r.cost - 1;
          return <div key={key} style={SC}>
            <div style={{...LAB,marginBottom:5}}>{t}</div>
            <div style={{fontSize:18,fontWeight:700,color:key==="today"?"#22d3ee":"#e2e8f0"}}>{usd(r.cost)}</div>
            <div style={{fontSize:10,color:"#7a9ab8",marginTop:3}}>{md(r.d) + " · MSTX $" + r.mstx.toFixed(2)
              + (key==="today" ? "" : " · today is " + (ch2 >= 0 ? "+" : "") + Math.round(100*ch2) + "%")}</div>
          </div>; })}
      </div>
    </div>
  );
}

function PlaybookTab({ todayTs, tier, q }) {
  const [pb, setPb] = useState(null), [plg, setPlg] = useState(null), [lc, setLc] = useState(null);

  useEffect(() => {
    let on = true;
    const get = (f, ok) => fetch(f + "?t=" + Date.now(), {cache:"no-store"})
      .then(r => { if (!r.ok) throw 0; return r.json(); })
      .then(j => { if (!isObj(j)) throw 0; if (on) ok(j); })
      .catch(() => { if (on) setFailed(v => [...v, f]); });
    get("data/playbook.json", setPb);
    get("data/paper-ledger.json", setPlg);
    get("data/leaps-cost.json", setLc);
    return () => { on = false; };
  }, []);
  const inp = (pb && isObj(pb.inputs)) ? pb.inputs : {};
  const [tip, setTip] = useState(null), [hb, setHb] = useState(null);
  const [uSl, setUSl] = useLocal("bql_pb_mstx", 16.4, v => nm(v) == null ? 16.4 : nm(v));
  const d0 = new Date(todayTs).toISOString().slice(0,10);
  // one tooltip for the tab: hover, or tap on touch
  const tipAt = (t, e) => { const r = e.currentTarget.getBoundingClientRect();
    const h = Math.min(264, window.innerWidth - 16)/2;
    setTip({t, x:Math.min(Math.max(r.left + r.width/2, h + 8), window.innerWidth - h - 8),
      y:Math.max(r.top, 54)}); };
  const hit = (t, i) => !t ? {} : {onMouseEnter:e => { setHb(i); tipAt(t, e); },
    onMouseLeave:() => { setHb(null); setTip(null); },
    onTouchStart:e => { const on = tip && tip.t === t;
      setHb(on ? null : i); if (on) setTip(null); else tipAt(t, e); }};
  const tkr = tier.name.split(" ")[0];
  const AC = tier ? tier.color : "#8aaac8";

  const eff = id => { const r = inp[id]; return (r && typeof r.pass === "boolean") ? r.pass : null; };
  const hist = eff(HIST), cross = eff(CROSS);
  // above 85 both weekly inputs can pass and the word reads HOLD, never ENTRY
  const trig = (hist == null || cross == null) ? "UNKNOWN"
    : (cross === true && q != null && q <= 85) ? "ENTRY" : hist === true ? "HOLD" : "OFF";
  const cr = inp[CROSS] || {}, wkN = typeof cr.bars_since_cross === "number" ? cr.bars_since_cross
    : Math.round((Date.parse(cr.bar_date) - Date.parse(cr.cross_bar_date))/6048e5);

  const gen = String((pb && pb.generated_at) || "");
  const genAge = /^\d{4}-\d{2}-\d{2}T\d\d:\d\d/.test(gen)
    ? Math.floor((Date.now() - Date.parse(gen)) / 86400000) : null;
  const genTxt = genAge == null ? null : "REFRESHED " + md(gen.slice(0,10))
    + (genAge < 1 ? "" : " \u00b7 " + genAge + (genAge === 1 ? " DAY OLD" : " DAYS OLD"));
  // the phase holding today, else the first not yet past
  const phs = rowsOf(plg && plg.plan && plg.plan.phases);
  const ph = phs.find(x => { const b = phBnd(x.dates); return (!b[0]||b[0]<=d0) && (!b[1]||d0<=b[1]); })
    || phs.find(x => { const e = phBnd(x.dates)[1]; return !e || d0 <= e; }) || null;

  // the hero action reads in two beats
  const act = String((ph && ph.next_action) || ""), acD = (ph && ph.next_action_detail) || null;
  const stepsOf = x => (x && Array.isArray(x.next_action_steps))
    ? x.next_action_steps.filter(t => typeof t === "string" && t) : [];
  const actS = stepsOf(ph);
  const cut = (!acD && act.length > 110) ? act.indexOf(". ") : -1;
  const act1 = (cut > 0 ? act.slice(0, cut+1) : act) || "No plan phase on file.";
  const act2 = acD || (cut > 0 ? act.slice(cut+2) : null);
  // PHASE 1: the spreads that are on, from the ledger
  const ph1 = phs.find(x => String(x.id) === "1") || null;
  const p1 = rowsOf(ph1 && ph1.spreads).map(s => ({k:String(s.key||UNK), legs:s.legs||null,
    mid:nm(s.debit), contracts:nm(s.contracts), cost:nm(s.cost)}));
  const x2 = (v, s) => v == null ? UNK : v.toFixed(2) + (s||"");
  // Position values come from the ledger; unit prices come from today's calibrated curve.
  const curve = rowsOf(lc && lc.unit_at).filter(r => nm(r.mstx) != null && nm(r.unit) > 0);
  const uRows = rowsOf(ph1 && ph1.units_by_price).filter(r => nm(r.mstx) != null)
    .map(r => {
      const nearest = curve.reduce((best, row) => !best || Math.abs(nm(row.mstx)-nm(r.mstx)) < Math.abs(nm(best.mstx)-nm(r.mstx)) ? row : best, null);
      const unit = nearest ? nm(nearest.unit) : nm(r.unit), dollars = nm(r.dollars);
      return {S:nm(r.mstx), pv:dollars, up:unit,
        n:nearest && dollars != null ? dollars / (unit * 100) : nm(r.leaps)};

  const uMin = uRows.length ? Math.min(...uRows.map(r => r.S)) : 13;
  const uMax = uRows.length ? Math.max(...uRows.map(r => r.S)) : 19;
  const uV = Math.min(uMax, Math.max(uMin, nm(uSl) == null ? 16.4 : nm(uSl)));
  const uSel = uRows.reduce((a,r) => Math.abs(r.S-uV) < Math.abs(a-uV) ? r.S : a,
    uRows.length ? uRows[0].S : 13);
  const uSelR = uRows.find(r => r.S === uSel) || {};
  const uRead = "At " + String(+uSel.toFixed(2)) + " on settlement: position about "
    + (uSelR.pv == null ? UNK : "$" + Math.round(uSelR.pv).toLocaleString("en-US"))
    + ", unit " + x2(uSelR.up) + ", " + (uSelR.n == null ? UNK : uSelR.n.toFixed(0)) + " LEAPS";

  // TRIGGER: the weekly bars
  const hR = inp[HIST] || {};
  const bars = rowsOf(hR.histogram_last16).map(b => ({bar:String(b.bar||""), v:nm(b.hist)}))
    .filter(b => b.v != null);
  const xd0 = cr.cross_bar_date || null;
  const xIdx = bars.findIndex(b => b.bar === xd0);
  const rising = bars.length > 1 && bars[bars.length-1].v > bars[bars.length-2].v;
  const rise = (() => { let i = bars.length - 1;
    while (i > 0 && (rising ? bars[i].v > bars[i-1].v : bars[i].v <= bars[i-1].v)) i--;
    return bars.length ? bars[i].bar : null; })();
  const CW = 344, CH = 118, CP = {t:13, r:8, b:23, l:10};
  const cwd = CW - CP.l - CP.r, cht = CH - CP.t - CP.b;
  const vmax = Math.max(0, ...bars.map(b => b.v)), vmin = Math.min(0, ...bars.map(b => b.v));
  const vsp = (vmax - vmin) || 1;
  const cy = v => CP.t + cht*(vmax - v)/vsp, zy = cy(0);
  const bw = cwd/Math.max(1, bars.length), bwi = Math.max(2, bw*0.66);
  const bx = i => CP.l + i*bw + (bw - bwi)/2;
  const bTip = b => "week ending " + (md(b.bar)||b.bar) + " \u00b7 " + sgn(b.v)
    + (b.bar === xd0 ? " \u00b7 cross" : "");

  // ROUTES: the operator's own calculation
  const routes = rowsOf(plg && plg.plan && plg.plan.routes);
  const rNote = String((plg && plg.plan && plg.plan.routes_note) || "");
  const PNL = {background:tier?tier.darkBg:"#070f1f",border:"1px solid "+AC+"30",
    borderLeft:"3px solid "+AC,borderRadius:"6px",padding:"14px 16px",marginTop:11};
  const FT = {fontSize:10,color:GRY,letterSpacing:"0.04em",marginTop:9};
  return (
    <div>
      {failed.map(file => <div key={file} style={{...BODY,marginBottom:8}}>{file + " failed to load."}</div>)}
      {/* HERO */}
      <div style={{background:tier?tier.darkBg:"#070f1f",border:"1px solid "+AC+"25",
        borderLeft:"4px solid "+AC,borderRadius:"6px",padding:"16px 20px",
        boxShadow:"-4px 0 24px "+AC+"15, inset 1px 0 0 "+AC+"08"}}>
        <div style={{...ROW,justifyContent:"space-between",marginBottom:6}}>
          <span style={LAB}>{tkr + " · TODAY"}</span>
          {genTxt && <span style={{fontSize:10,letterSpacing:"0.06em",
            color:(todayTs-Date.parse(gen))/864e5 > 2 ? RD : genAge >= 1 ? "#facc15" : GRY}}>{genTxt}</span>}</div>
        <div style={{fontSize:"28px",fontWeight:700,color:TCOL[trig],lineHeight:1,letterSpacing:"0.02em"}}>
          {trig + (ph ? " \u00b7 PHASE " + ph.id : "")}</div>
        {actS.length > 0
          ? actS.map((t, i) => <div key={i} style={{fontSize:14,color:"#e2e8f0",lineHeight:1.5,
              marginTop:i ? 4 : 10}}>{t}</div>)

        {act2 && <div style={{fontSize:12,color:"#8aaac8",lineHeight:1.5,
          marginTop:6}}>{act2}</div>}
      </div>

      <div style={PNL}>
        <div style={{...HD,marginBottom:10}}>{(ph1 && ph1.panel_title) || "PHASE 1 \u00b7 WHAT IS ON"}</div>

            padding:"7px 0",borderTop:i?SEP:"none"}}>
            <span style={{fontSize:11,fontWeight:700,letterSpacing:"0.1em",color:AC,

            <span style={{fontSize:13,color:"#a0b8cc"}}>{r.legs||UNK}</span>

function BTCPowerLaw() {
  const [today, setToday] = useState(()=>new Date());   // rolled by the poller, so a page left open crosses midnight and month end
  const todayTs = today.getTime();


  // LADDER | MSTR | PLAYBOOK tab, persisted
  const [tab, setTab] = useState(() => {
    try { const s = localStorage.getItem("bql_tab");
      return (s === "playbook" || s === "mstr") ? s : "ladder"; } catch(_) { return "ladder"; } });
  useEffect(() => { try { localStorage.setItem("bql_tab", tab); } catch(_) {} }, [tab]);

  const [priceStr,  setPriceStr]  = useState("85000");
  const follow = useRef(true);   // false once the price is typed, stepped or preset
  const [livePrice, setLivePrice] = useState(null);
  const [liveFetch, setLiveFetch] = useState("fetching…");
  const [liveUpdatedAt, setLiveUpdatedAt] = useState(null);
  const [liveHistory, setLiveHistory] = useState(null);
  const [lookupDate, setLookupDate] = useState(lookupDefaultDate);
  // BTC or MSTR for the forward table and the lookup, remembered
  const [units, setUnits] = useLocal("bql_units", "btc", v => v === "mstr" ? "mstr" : "btc");
  const mu = useMstrUnits();

  // EMA model: halfLifeYears=0 means Kaim fixed model
  const [halfLifeYears, setHalfLifeYears] = useState(0);
  const { A: modelA, B: modelB } = useMemo(() => {
    if (halfLifeYears === 0) return { A: JV_A, B: JV_B };
    return fitEMA(halfLifeYears * 365);
  }, [halfLifeYears]);
  const isJV = halfLifeYears === 0;

  // Fetch live BTC price + history
  useEffect(()=>{
    let on = true, id = null;
    async function fetchPrice(){
      const apply = (p) => {
        if(!on) return;
        setLivePrice(p);
        if (follow.current) setPriceStr(Math.round(p).toString());
        setLiveFetch("live");
        setLiveUpdatedAt(new Date());
      };
      try {
        const res = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd");
        if(!res.ok) throw new Error();
        const j = await res.json();
        const p = j?.bitcoin?.usd;
        if(p) { apply(p); return; }
        throw new Error();
      } catch(_){}
      try { // fallback: Coinbase spot
        const res = await fetch("https://api.coinbase.com/v2/prices/BTC-USD/spot");
        if(!res.ok) throw new Error();
        const j = await res.json();
        const p = parseFloat(j?.data?.amount);
        if(p) { apply(p); return; }
        throw new Error();
      } catch(_){
        setLiveFetch("unavailable");
      }
    }
    let histDay = null;   // the UTC day of the last good history fetch
    async function fetchHistory(){
      try {
        const res = await fetch("https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=usd&days=365&interval=daily");
        if(!res.ok) throw new Error();
        const j = await res.json();
        if(on && j?.prices?.length > 100){
          // Merge: seed covers pre-2024, live covers last 365 days
          const liveStart = j.prices[0][0];
          const seedOld = SEED_PRICES.map(([ym,p])=>[new Date(ym+"-01").getTime(),p]).filter(([ts])=>ts < liveStart);
          setLiveHistory([...seedOld, ...j.prices]);
          histDay = new Date().getUTCDate();
        }
      } catch(_){ /* fall back to seed */ }
    }
    fetchPrice();
    fetchHistory();
    const nxt = () => msOpen(new Date()) ? 60000 : 300000;
    // a page left open rolls its clock every poll and refetches the daily history on a new UTC day (the monthly close lands there) and when it comes back into view
    const roll = () => { setToday(new Date()); if (new Date().getUTCDate() !== histDay) fetchHistory(); };
    const run = () => { if(!on) return; fetchPrice(); roll(); id = setTimeout(run, nxt()); };
    const onVis = () => { if (on && document.visibilityState === "visible") { fetchPrice(); roll(); } };
    document.addEventListener("visibilitychange", onVis);
    id = setTimeout(run, nxt());
    return () => { on = false; if(id) clearTimeout(id); document.removeEventListener("visibilitychange", onVis); };
  },[]);

  const price = parseFloat(priceStr.replace(/[^0-9.]/g,""))||0;
  const fv    = fairValueAt(todayTs, modelA, modelB);
  const q     = priceToQuantile(price, todayTs, modelA, modelB);
  // the band follows the monthly close; the live quantile is a touch until the next one
  const mc    = monthlyClose(liveHistory, todayTs);
  const qM    = mc ? priceToQuantile(mc.price, mc.ts, modelA, modelB) : q;
  const {tier, idx: tierIdx} = getTier(qM);
  const liveTier = getTier(q);
  const strikes = tierStrikes(tier, todayTs, modelA, modelB);

          {/* Structure — quantile-anchored strikes or margin framework */}
          {tier.kind === "pmcc" && strikes && (

          {/* FORWARD PROJECTION TABLE */}
      <ForwardTable todayTs={todayTs} units={units} setUnits={setUnits} mu={mu}

      {tab === "playbook" && <PlaybookTab todayTs={todayTs} tier={tier} q={q}/>}

      <div hidden={tab !== "mstr"}><MstrTab/></div>
    </div>

}


    const ssGet = k => { try { return sessionStorage.getItem(k); } catch(_) { return null; } };
    const ssSet = (k, v) => { try { sessionStorage.setItem(k, v); } catch(_) {} };

    function App() {
      const [unlocked, setUnlocked] = React.useState(() => ssGet('bql_ok') === '1');
      const [pin, setPin] = React.useState("");
      const [err, setErr] = React.useState(false);

      const fail = () => { setErr(true); setPin(""); setTimeout(() => setErr(false), 2000); };
      const attempt = () => {
        if (!(window.crypto && window.crypto.subtle)) { setErr(true); return; }
        crypto.subtle.digest("SHA-256", new TextEncoder().encode(pin)).then(h => {
          const hex = [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("");
          if (hex === "60cafa03272449d4129f58adaa38cc9604e1d4c9c74362084ac4fac09b4d6f0d") {
            ssSet('bql_ok','1'); setUnlocked(true);
          } else { fail(); }
        }).catch(fail);
      };

      if (unlocked) return <>
        <BTCPowerLaw />
      </>;

      return (
        <div style={{display:"flex",alignItems:"center",justifyContent:"center",
          minHeight:"100vh",background:"#020817",fontFamily:"var(--font, 'JetBrains Mono', monospace)"}}>
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:"11px",color:"#5a8fc0",textTransform:"uppercase",
              letterSpacing:"0.18em",marginBottom:"32px",fontWeight:600}}>BTC Quantile Ladder</div>
            <input type="password" maxLength={10} placeholder="····" value={pin}
              onChange={e => setPin(e.target.value)}
              onKeyDown={e => e.key === "Enter" && attempt()}
              style={{background:"#070f1f",border:"1px solid #0f2a42",borderRadius:"6px",
                color:"#facc15",fontSize:"20px",fontFamily:"inherit",padding:"12px 18px",
                width:"160px",outline:"none",textAlign:"center",letterSpacing:"0.3em"}}/>
            <div style={{marginTop:"16px"}}>
              <button onClick={attempt}
                style={{background:"#070f1f",border:"1px solid #1a3a5c",borderRadius:"6px",
                  color:"#8aaac8",fontSize:"11px",fontFamily:"inherit",padding:"10px 24px",
                  cursor:"pointer",letterSpacing:"0.1em",textTransform:"uppercase",fontWeight:600}}>
                Enter
              </button>
            </div>
            <div style={{color:"#ef4444",fontSize:"11px",marginTop:"12px",
              letterSpacing:"0.06em",opacity:err?1:0,transition:"opacity 0.2s"}}>
              incorrect passcode
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
  <script>
    function applyMobileStyles() {
      const mobile = window.innerWidth <= 700;
      const existing = document.getElementById('m');
      if (!mobile) {
        if (existing) existing.remove();
        return;
      }
      if (existing) return;
      const s = document.createElement('style');
      s.id = 'm';
      s.textContent = `
        /* Three Ladder stat cards stack on phones. */
        #root [style*="grid-template-columns: repeat(3,"] { grid-template-columns: 1fr !important; }
        /* Price lookup: 6-col → 3-col */
        #root [style*="repeat(6, 1fr)"] { grid-template-columns: repeat(3,1fr) !important; }
        /* Horizontal scroll for preset buttons */
        #root [style*="flex-wrap: wrap"][style*="gap: 4px"] { 
          flex-wrap: nowrap !important; overflow-x: auto !important; 
          -webkit-overflow-scrolling: touch !important; padding-bottom: 4px !important;
          scrollbar-width: none !important;
        }
        #root [style*="flex-wrap: wrap"][style*="gap: 4px"]::-webkit-scrollbar { display: none !important; }
        /* Header row: stack on mobile */
        #root [style*="justify-content: space-between"][style*="gap: 8px"] { flex-wrap: wrap !important; }
        /* Tier card: stack text above circles */
        #root [style*="justify-content: space-between"][style*="gap: 16px"] { 
          flex-direction: column !important; align-items: flex-start !important; 
        }
        /* Quantile rail: stack name over range, taller container */
        #root [style*="height: 40px"][style*="position: relative"] { height: 52px !important; }
        #root [style*="overflow: hidden"][style*="gap: 5px"][style*="position: absolute"] { flex-direction: column !important; gap: 1px !important; }
        #root [style*="overflow: hidden"][style*="gap: 5px"][style*="position: absolute"] > span { font-size: 8px !important; }
        /* Model selector: wrap */
        #root [style*="margin-left: 4px"][style*="gap: 8px"] { flex-wrap: wrap !important; }
        #root [style*="margin-left: 4px"][style*="gap: 8px"] > * { min-width: 0 !important; }
        /* Forward projection table: smaller font */
        #root [style*="grid-template-columns: 60px"] { font-size: 10px !important; }
        /* Instrument name: smaller on mobile */
        #root [style*="font-size: 28px"] { font-size: 22px !important; }
        /* General: tighter padding */
        #root > div > div { padding-left: 12px !important; padding-right: 12px !important; }
      `;
      document.head.appendChild(s);
    }
    // Run after React mounts content
    const _observer = new MutationObserver(() => applyMobileStyles());
    _observer.observe(document.getElementById('root'), {childList:true, subtree:false});
    window.addEventListener('resize', applyMobileStyles);
    // Also run once on load in case observer fires too early
    window.addEventListener('load', applyMobileStyles);
  </script>
