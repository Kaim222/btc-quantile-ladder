// ─────────────────────────────────────────────────────────────────────────────
// KAIM POWER LAW MODEL
//
// Model v2, fitted 2026-09-19 by tools/model_refit.py and recorded in data/ladder-model.json. Refit once a year.
//   centre line: log10(price) = 5.645315 * log10(days since 2009-01-03) - 16.430264
//   Least squares slope on every day from Jul 2010, with the intercept lowered so half of all days sit under the line
//   (bubbles pull a least squares line above the median). Scored on the median gap of price over the line in the two
//   years after each year-end fit 2014 to 2024, this had a mean gap of -0.002 log10 and a mean absolute gap of 0.237,
//   both the best tested. A clock started in Jan 2010 ran 0.11 to 0.14 log10 under the prices that followed. The
//   vintages overlap and come from one price path, so that is a tie-break on bias, not a significance test.
//   lines: offsets from the centre in log10, shaped c * exp(-age / T) with age in years since the clock start, so both
//   sides narrow with age and never cross. The scales are fitted by pinball loss. 15, 85 and 95 are nominal targets
//   (observed shares of all days are in data/ladder-model.json) and do not hold inside a single cycle. Lower T (20.8
//   years) is fitted on all days. Upper T cannot be pinned: all
//   days say 13 years, the four cycle highs say 6. The model uses their geometric mean, 8.9, as an open judgment.
//   Floor and Ceiling are envelopes of every close from 2014 to the fit date. They are not percentiles or support.
// Model v1 (the original, genesis clock, slope 5.82, straight-line decay frozen at page load) stays here for comparison.
// Open the page with ?model=v1 to see it. tools/ladder_model.py is the same arithmetic in Python.
// ─────────────────────────────────────────────────────────────────────────────

// Derive SEED_PRICES as ["YYYY-MM", price] pairs from BTC_HISTORY for chart merge
const SEED_PRICES = BTC_HISTORY.map(({days, price}) => {
  const d = new Date(GENESIS.getTime() + days * 86400000);
  const ym = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
  return [ym, price];
});

function daysFromGenesis(ts) {
  return (ts - GENESIS_MS) / 86400000;
}
function fairValueAt(ts, A=JV_A, B=JV_B) {
  const d = daysFromGenesis(ts) - CLOCK_SHIFT_DAYS;
  return d > 0 ? Math.pow(10, A * Math.log10(d) + B) : 0;
}

// Band offsets from the centre line in log10. exp = c * exp(-age / T), age in years since the model clock. const = c.
// lin is model v1 only: m * days + c with the decay frozen at page load, which it needed so its lines would not cross.
const TODAY_DAYS = (Date.now() - GENESIS_MS) / 86400000;
function bandOffset(b, ts) {
  if (b.kind === "const") return b.p[0];
  if (b.kind === "exp") return b.p[0] * Math.exp(-((ts - CLOCK_MS) / 86400000 / 365.25) / b.p[1]);
  if (b.kind !== "lin") throw new Error("unknown band kind " + b.kind);
  const days = (ts - GENESIS_MS) / 86400000;
  return b.p[0] * (b.p[0] < 0 ? Math.min(days, TODAY_DAYS) : days) + b.p[1];
}

const BAND_STYLE = { 99.9:{color:"#3b82f6",dash:"2,4",w:0.8,dim:true}, 95:{color:"#8b5cf6",dash:"2,4",w:0.8,dim:true}, 85:{color:"#22c55e",dash:"",w:1.4},
  50:{color:"#22d3ee",dash:"",w:1.4}, 15:{color:"#f97316",dash:"",w:1.4}, 0.1:{color:"#ef4444",dash:"",w:1.4} };
const BAND_DEFS = MODEL.bands.map(b => ({ ...b, ...BAND_STYLE[b.q] }));

// BANDS with offset computed at current time (for gauge/quantile calc)
const BANDS = BAND_DEFS.map(b => ({ ...b, offset: bandOffset(b, Date.now()) }));

function bandPriceAt(ts, bandDef, A=JV_A, B=JV_B) {
  const offset = bandOffset(bandDef, ts);
  return fairValueAt(ts, A, B) * Math.pow(10, offset);
}

function priceToQuantile(price, ts, A=JV_A, B=JV_B) {
  const fv = fairValueAt(ts, A, B);
  if (!fv || price <= 0) return 50;
  const res = Math.log10(price / fv);
  // Compute offsets fresh for the given timestamp (upper bands decay over time)
  const bands = BAND_DEFS.map(b => ({ ...b, offset: bandOffset(b, ts) }));
  // Interpolate between calibration points
  for (let i = 0; i < bands.length - 1; i++) {
    const hi = bands[i], lo = bands[i + 1];
    if (res <= hi.offset && res >= lo.offset) {
      const t = (res - lo.offset) / (hi.offset - lo.offset);
      return lo.q + t * (hi.q - lo.q);
    }
  }
  if (res > bands[0].offset) {
    // Above the top line — extrapolate
    const slope = (bands[0].q - bands[1].q) / (bands[0].offset - bands[1].offset);
    return Math.min(99.99, bands[0].q + slope * (res - bands[0].offset));
  }
  // Below the bottom line — extrapolate
  const slope = (bands[bands.length-2].q - bands[bands.length-1].q) /
                (bands[bands.length-2].offset - bands[bands.length-1].offset);
  return Math.max(0.01, bands[bands.length-1].q + slope * (res - bands[bands.length-1].offset));
}

// ─────────────────────────────────────────────────────────────────────────────
// INSTRUMENT LADDER
// ─────────────────────────────────────────────────────────────────────────────
// Quantile → price at any date (inverse of priceToQuantile; interpolates band offsets)
function quantileToPrice(qq, ts, A=JV_A, B=JV_B) {
  const fv = fairValueAt(ts, A, B);
  const bands = BAND_DEFS.map(b => ({ q: b.q, offset: bandOffset(b, ts) }));
  let offset;
  if (qq >= bands[0].q) {
    const s = (bands[0].offset - bands[1].offset) / (bands[0].q - bands[1].q);
    offset = bands[0].offset + s * (qq - bands[0].q);
  } else if (qq <= bands[bands.length-1].q) {
    const a = bands[bands.length-2], z = bands[bands.length-1];
    const s = (a.offset - z.offset) / (a.q - z.q);
    offset = z.offset + s * (qq - z.q);
  } else {
    for (let i = 0; i < bands.length - 1; i++) {
      const hi = bands[i], lo = bands[i+1];
      if (qq <= hi.q && qq >= lo.q) {
        const t = (qq - lo.q) / (hi.q - lo.q);
        offset = lo.offset + t * (hi.offset - lo.offset);
        break;
      }
    }
  }
  return fv * Math.pow(10, offset);
}

function addMonths(ts, mo) { const d = new Date(ts); d.setMonth(d.getMonth() + mo); return d.getTime(); }
function fmtMonth(ts) { return new Date(ts).toLocaleDateString("en-US", { month: "short", year: "numeric" }); }

// ─────────────────────────────────────────────────────────────────────────────
// INSTRUMENT LADDER — 4 bands, one position per band, quantile-anchored strikes
// Long  = band floor quantile projected at the long expiry
// Short = band ceiling quantile projected at the short expiry
//         (short strike doubles as the rotation trigger)
// ─────────────────────────────────────────────────────────────────────────────
// rotation happens on the monthly close (see monthlyClose below); there is no daily buffer

// The band is read on the monthly close. The lines get crossed about three times a year on the daily; a touch is not a rotation.
// liveHistory is [[ts, price], ...] daily (CoinGecko dates each point at 00:00 UTC, so the point on the 1st is the prior month's close).
function monthlyClose(liveHistory, nowTs) {
  if (!Array.isArray(liveHistory) || liveHistory.length < 2) return null;
  const n = new Date(nowTs), m0 = Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), 1);
  // the daily points sit at 00:00 UTC; the last element is the live price and never counts as a close
  const pt = liveHistory.slice(0, -1).find(p => Array.isArray(p) && p[0] >= m0 && p[0] < m0 + 3600000 && p[1] > 0);
  return pt ? { ts: m0 - 1, price: pt[1] } : null;    // no boundary point yet: the caller reads the live price and says so
}

function getTier(q) {
  const idx = LADDER.findIndex(t => q >= t.qMin && q < t.qMax);
  const i = idx >= 0 ? idx : (q >= LADDER[0].qMax ? 0 : LADDER.length - 1);
  return { tier: LADDER[i], idx: i };
}

// Strike computation for a pmcc tier at a given "now"
function tierStrikes(t, nowTs, A=JV_A, B=JV_B) {
  if (t.kind !== "pmcc") return null;
  const longTs  = addMonths(nowTs, t.longMo);
  const shortTs = nowTs + t.shortDays * 86400000;      // 90 days, the same clock the monitor's band push uses
  return {
    long:  { q: t.longQ,  ts: longTs,  price: quantileToPrice(t.longQ,  longTs,  A, B), mo: t.longMo },
    short: { q: t.shortQ, ts: shortTs, price: quantileToPrice(t.shortQ, shortTs, A, B), days: t.shortDays },
  };
}

// Margin framework math (per $1 equity): position = L, borrowed = L-1
function marginStats(m) {
  const carry = m.leverage * m.yield - (m.leverage - 1) * m.rate;           // net carry on equity
  const callDD = 1 - (m.leverage - 1) / (m.leverage * (1 - m.maint));      // drawdown to margin call
  return { carry, callDD, callPx: 100 * (1 - callDD) };
}

function fmt(n) {   // compact: axes, the slider rail and the forward table
  if (!Number.isFinite(n)) return UNK;
  if (n >= 1e6) return "$" + (n/1e6).toFixed(2) + "M";
  if (n >= 1e3) return "$" + Math.round(n/1e3) + "K";
  return "$" + Math.round(n);
}
function fmtFull(n) { return usd0(n); }

// ── BTC | MSTR for the ladder's two tables. The conversion is the fitted MSTR line,
// held at today's inputs: MSTR = BTC x BTC-per-share x target, target = the fitted STRC term plus
// the config slope. Helpers (msStrc, msQuote, msOpen) live with the MSTR tab below. ──
// most of the MSTR ladder lands between $100 and $10,000, where fmt's "$1K" hides the number
const msFmt = v => (v >= 1000 && v < 1e6) ? usd0(Math.round(v)) : fmt(v);
const UnitPick = ({units, setUnits, withMstx}) => (
  <span style={{display:"flex",alignItems:"center",gap:"6px"}}>

function useMstrUnits() {
  const [u, setU] = useState({bps:null, strc:null, fit:MS_FIT, slope:MS_FIT.b, now:null, mstxSnap:null, mstrSnap:null, dragK:null});
  useEffect(() => {
    let on = true;
    const num = x => (x != null && x !== "" && x !== "auto" && isFinite(Number(x))) ? Number(x) : null;
    const jf = url => fetch(url, {cache:"no-store"})
      .then(r => { if (!r.ok) throw 0; return r.json(); }).catch(() => null);
    const quote = k => msQuote({price: Number(k.price), ts: k.timeStamp,
      ext: k.extendedSession || null}, msOpen(new Date()));
    const refresh = () => {
    jf("data/mstr-config.json?t=" + Date.now()).then(c => {
      if (!on) return;
      const cfg = isObj(c) ? c : {};
      const sl = msFit(cfg).b, h = num(cfg.btc_held), sh = num(cfg.shares_m);
      if (sl != null) setU(v => ({...v, slope: sl, fit:msFit(cfg)}));
      if (h && sh) { setU(v => ({...v, bps: h / (sh * 1e6)})); return; }  // the file overrides
      jf("https://api.strategy.com/btc/bitcoinKpis").then(j => {
        if (!on) return; const k = j && j.results; if (!isObj(k)) return;
        const held = Number(String(k.btcHoldings).replace(/,/g, "")), sps = Number(k.satsPerShare);
        if (!(held > 100000) || !(sps > 0)) return;
        const shM = held / (sps / 1e8) / 1e6;
        setU(v => ({...v, bps: (h || held) / ((sh || shM) * 1e6)})); });
    });
    jf("https://api.strategy.com/btc/strcKpiData").then(j => { if (!on) return;
      const k = Array.isArray(j) ? j[0] : j; if (!isObj(k)) return;
      const q = quote(k); if (q) setU(v => ({...v, strc: q.px})); });
    // MSTX: the monitor's last matched MSTX and MSTR prices, and the measured yearly drag
    jf(MS_RAW + "mstr_state.json?t=" + Date.now()).then(j => { if (!on || !isObj(j)) return;
      if (Number(j.mstx) > 0 && Number(j.mstr) > 0) setU(v => ({...v, mstxSnap:Number(j.mstx), mstrSnap:Number(j.mstr)})); });
    jf("data/evidence.json?t=" + Date.now()).then(j => { if (!on || !isObj(j) || !isObj(j.mstx_drag)) return;
      if (Number(j.mstx_drag.k_1y) > 0) setU(v => ({...v, dragK:Number(j.mstx_drag.k_1y)})); });
    jf("https://api.strategy.com/btc/mstrKpiData").then(j => { if (!on) return;
      const k = Array.isArray(j) ? j[0] : j; if (!isObj(k)) return;
      const q = quote(k); if (q) setU(v => ({...v, now: q.px})); });
    };
    const visible = () => { if (document.visibilityState === "visible") refresh(); };
    refresh(); const timer = setInterval(refresh,600000); document.addEventListener("visibilitychange",visible);
    return () => { on = false; clearInterval(timer); document.removeEventListener("visibilitychange",visible); };
  }, []);
  const ready = u.bps != null && u.strc != null && u.slope != null;
  // the slope term rides the row's own BTC price, using the fitted Bitcoin slope
  const conv = b => (!ready || !(b > 0)) ? null
    : b * u.bps * msTarget(b,u.strc,u.fit);   // target mNAV capped at 2.0 for far-out BTC prices
  // projected MSTX at a band price on a date: MSTX now x (projected MSTR / MSTR now) squared, less the measured decay
  const convX = (b, ts) => { const m = conv(b), yrs = (ts - Date.now())/(365*86400000);
    if (!(m > 0) || !(u.mstxSnap > 0) || !(u.mstrSnap > 0) || !(yrs >= 0)) return null;
    return u.mstxSnap*Math.pow(m/u.mstrSnap, 2)*Math.exp(-(u.dragK > 0 ? u.dragK : 1.0)*yrs); };
  return {...u, ready, conv, convX};
}

function thirdFriday(year, month) { // month 0-11, returns UTC ts
  const first = new Date(Date.UTC(year, month, 1));
  const dow = first.getUTCDay();
  const firstFri = 1 + ((5 - dow + 7) % 7);
  return Date.UTC(year, month, firstFri + 14);
}
function nextOpex(ts, dir) { // dir +1 / -1: nearest monthly opex strictly beyond ts
  const d = new Date(ts);
  let y = d.getUTCFullYear(), m = d.getUTCMonth();
  for (let i = 0; i < 24; i++) {
    const tf = thirdFriday(y, m);
    if (dir > 0 && tf > ts) return tf;
    if (dir < 0 && tf < ts) return tf;
    m += dir;
    if (m > 11) { m = 0; y++; }
    if (m < 0)  { m = 11; y--; }
  }
  return ts;
}
const tsToDateStr = ts => new Date(ts).toISOString().slice(0, 10);

function priceOn(history, ts) {
  // nearest historical point within tolerance (10d daily era, 40d monthly seed era)
  if (!history || !history.length) return null;
  let best = null, bd = Infinity;
  for (const [t, p] of history) {
    const d = Math.abs(t - ts);
    if (d < bd) { bd = d; best = [t, p]; }
  }
  if (!best) return null;
  const tol = best[0] > Date.parse("2025-08-01") ? 10 : 40;
  return bd <= tol * 86400000 ? { ts: best[0], price: best[1] } : null;
}

function lookupDefaultDate() {
  try {
    const saved = localStorage.getItem("lookupDate");
    if (saved && Date.parse(saved + "T00:00:00Z") > Date.now()) return saved;
  } catch(_) {}
  return tsToDateStr(nextOpex(Date.now(), 1));
}

// ─────────────────────────────────────────────────────────────────────────────
// POWER LAW CHART (SVG)
// ─────────────────────────────────────────────────────────────────────────────
function PowerLawChart({ btcPrice, todayTs, liveHistory, lookupTs, modelA=JV_A, modelB=JV_B }) {

  // Chart dimensions
  const W = window.innerWidth < 560 ? 430 : 900, H = window.innerWidth < 560 ? 310 : 420, PAD = {t:30, r:20, b:40, l:window.innerWidth < 560 ? 46 : 65};
  const cw = W - PAD.l - PAD.r, ch = H - PAD.t - PAD.b;

  // Time range: 2011-01-01 to +5 years
  const tMin = new Date("2011-01-01").getTime();
  const tMax = new Date(new Date().getFullYear() + 5, 11, 31).getTime();

  // Price range in log scale — tighter ceiling to reduce dead space
  const pMin = Math.log10(0.3);     // $0.30
  const pMax = Math.log10(1000000); // $1M

  const tx = ts => PAD.l + cw * (ts - tMin) / (tMax - tMin);
  const ty = logP => PAD.t + ch * (1 - (logP - pMin) / (pMax - pMin));

  // Build band curves (monthly resolution)
  const months = [];
  {
    const d = new Date(2011, 0, 1);
    const end = new Date(new Date().getFullYear() + 5, 11, 31);
    while (d <= end) {
      months.push(d.getTime());
      d.setMonth(d.getMonth() + 1);
    }
  }

  // The ladder lines, read from LADDER: where the instrument changes
  const ladderLines = useMemo(() => LADDER.slice(0, -1).map(t => {
    let d = "";
    for (const ts of months) {
      const p = quantileToPrice(t.qMin, ts, modelA, modelB);
      if (!(p > 0)) continue;
      d += (d ? "L" : "M") + tx(ts).toFixed(1) + "," + ty(Math.log10(p)).toFixed(1);
    }
    return { q: t.qMin, d };
  }), [months, modelA, modelB]);

  // Band lines
  const bandLines = useMemo(() => {
    return BAND_DEFS.map(b => {
      let d = "";
      for (const ts of months) {
        const p = bandPriceAt(ts, b, modelA, modelB);
        if (p <= 0) continue;
        const x = tx(ts), y = ty(Math.log10(p));
        d += (d ? "L" : "M") + x.toFixed(1) + "," + y.toFixed(1);
      }
      return { ...b, d };
    });
  }, [months, modelA, modelB]);

  // Historical price line from seed + live data
  const pricePath = useMemo(() => {
    const pts = [];
    // Use BTC_HISTORY (monthly seed) for pre-live data
    for (const {days, price} of BTC_HISTORY) {
      const ts = GENESIS_MS + days * 86400000;
      if (ts >= tMin && ts <= tMax && price > 0) {
        pts.push([ts, price]);
      }
    }
    // Overlay live data — downsample daily to weekly to match seed density
    if (liveHistory) {
      const weekMs = 7 * 86400000;
      const buckets = new Map();
      for (const [ts, price] of liveHistory) {
        if (ts >= tMin && ts <= tMax && price > 0) {
          const weekKey = Math.floor(ts / weekMs);
          const existing = buckets.get(weekKey);
          // Keep the last data point in each week
          if (!existing || ts > existing[0]) buckets.set(weekKey, [ts, price]);
        }
      }
      for (const [, pt] of buckets) pts.push(pt);
    }
    // Sort and deduplicate: keep one point per ~7-day window
    pts.sort((a,b) => a[0] - b[0]);
    const deduped = [];
    for (const pt of pts) {
      if (deduped.length === 0 || pt[0] - deduped[deduped.length-1][0] > 5*86400000) {
        deduped.push(pt);
      }
    }
    // Build smooth SVG path using Catmull-Rom → cubic bezier conversion
    if (deduped.length < 2) return "";
    const points = deduped.map(([ts, price]) => [tx(ts), ty(Math.log10(price))]);
    let d = `M${points[0][0].toFixed(1)},${points[0][1].toFixed(1)}`;
    for (let i = 0; i < points.length - 1; i++) {
      const p0 = points[Math.max(0, i - 1)];
      const p1 = points[i];
      const p2 = points[i + 1];
      const p3 = points[Math.min(points.length - 1, i + 2)];
      // Catmull-Rom to cubic bezier control points (tension=0.5)
      const cp1x = p1[0] + (p2[0] - p0[0]) / 6;
      const cp1y = p1[1] + (p2[1] - p0[1]) / 6;
      const cp2x = p2[0] - (p3[0] - p1[0]) / 6;
      const cp2y = p2[1] - (p3[1] - p1[1]) / 6;
      d += ` C${cp1x.toFixed(1)},${cp1y.toFixed(1)} ${cp2x.toFixed(1)},${cp2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
    }
    return d;
  }, [liveHistory]);

  // Y-axis labels

        {[0,ser.length-1].map((i,k) => <text key={k} x={k ? P.l+cw : P.l} y={H-5} fill="#7aa5c8" fontSize={TYPE.label}

    {moreOpen && hist && rowsOf(hist.weekly).length > 10 && (() => {
      // Two years of mNAV (MSTR over its Bitcoin per share), split by bull and bear market. Built by mstr-mnav-model/build_mnav_history.py.
      const wk = rowsOf(hist.weekly), all = rowsOf(hist.all), era = rowsOf(hist.era), per = rowsOf(hist.periods);
      const eraOf = n => era.find(r => r.name === n) || {}, bullE = eraOf("bull"), bearE = eraOf("bear"), allE = eraOf("all");
      const x2h = v => nm(v) == null ? UNK : nm(v).toFixed(2), pc = v => nm(v) == null ? UNK : nm(v).toFixed(1)+"%";
      const avg = n => { const end = Date.parse(last.d), start = end-(n-1)*86400000;
        if (!ser.length || Date.parse(ser[0].d) > start) return null;
        const v = ser.filter(r => Date.parse(r.d) >= start && Date.parse(r.d) <= end).map(r => nm(r.mnav)).filter(x => x > 0);
        return v.length ? v.reduce((a,b) => a+b,0)/v.length : null; };
      const premNow = bps > 0 && nm(prices.btc) > 0 && nm(prices.mstr) > 0 ? nm(prices.mstr)/(bps*nm(prices.btc)) : nm(hist.now && hist.now.premium);
      const tgtNow = nm(prices.btc) > 0 && nm(prices.strc) > 0 ? msTarget(nm(prices.btc),nm(prices.strc),fit) : null;
      const W3 = narrow ? 440 : 880, H3 = narrow ? 270 : 210, P3 = {l:narrow ? 26 : 34,r:10,t:12,b:22}, cw3 = W3-P3.l-P3.r, ch3 = H3-P3.t-P3.b;
      const top3 = Math.max(2, Math.ceil(Math.max(...wk.flatMap(r => [nm(r.p) || 0,nm(r.a) || 0,nm(r.t) || 0])))), x3 = i => P3.l+cw3*i/(wk.length-1), y3 = v => P3.t+ch3*(1-v/top3), bw3 = cw3/(wk.length-1);
      const ln = k => wk.map((r,i) => nm(r[k]) == null ? "" : (i && nm(wk[i-1][k]) != null ? "L" : "M")+x3(i).toFixed(1)+","+y3(nm(r[k])).toFixed(1)).join(" ");
      const strcAt = wk.findIndex(r => nm(r.t) != null), bearShare = allE.days > 0 && bearE.days > 0 ? Math.round(bearE.days/allE.days*100) : null;
      const tbl = (caption, heads, rows) => <div style={{marginTop:14}}><div style={LAB}>{labTxt(caption)}</div>
        <div style={{overflowX:"auto"}}><div style={{display:"grid",minWidth:0,gridTemplateColumns:(narrow ? "0.8fr 0.6fr 1fr 1fr" : "1.5fr repeat("+(heads.length-1)+",minmax(0,1fr))"),marginTop:6}}>
          {heads.map(h => <div key={h} style={{...LAB,fontSize:TYPE.label,fontWeight:400,padding:narrow ? "4px 3px" : "4px 6px"}}>{labTxt(h)}</div>)}
          {rows.map((r,n) => r.map((v,i) => <div key={n+"-"+i} style={{padding:narrow ? "5px 3px" : "5px 6px",fontSize:TYPE.secondary,
            color:!i ? (v === "Bull" ? GRN : v === "Bear" ? RD : "#8aaac8") : "#d0dde8",borderBottom:SEP,whiteSpace:"nowrap"}}>{v}</div>))}</div></div></div>;
      return <div style={VIS_CARD}>

        <div style={{...BODY,lineHeight:1.5,marginTop:7}}><Sentences>{"Projected has "+(allE.days || UNK)+" days of history and "+(bearShare == null ? UNK : bearShare+"%")
          +" were bear market days. MSTR ran "+pc(bullE.bias_projected)+" above projected on bull days and "+pc(bearE.bias_projected)+" on bear days."}</Sentences></div>
        {tiles([["mNAV NOW",x2h(premNow),"projected "+x2h(tgtNow),"#f1f5f9"], ["30 DAY AVERAGE",x2h(avg(30)),"through "+mdy(last.d),AMB],
          ["90 DAY AVERAGE",x2h(avg(90)),"through "+mdy(last.d),AMB], ["1 YEAR AVERAGE",x2h(avg(365)),"two years "+x2h(hist.now && hist.now.avg_all),AMB]])}
        <svg viewBox={"0 0 "+W3+" "+H3} style={{width:"100%",height:"auto",minHeight:window.innerWidth < 560 ? 180 : 200,display:"block",marginTop:12}}>

          {Array.from({length:Math.min(top3, 12)+1}, (_, n) => n).map(v => <g key={v}>
            <line x1={P3.l} x2={P3.l+cw3} y1={y3(v)} y2={y3(v)} stroke={v === 1 ? "#2a4a6a" : "#0f2035"} strokeWidth="0.7"/>
            <text x={P3.l-5} y={y3(v)+3} fill="#7aa5c8" fontSize={TYPE.label} textAnchor="end">{v.toFixed(1)}</text></g>)}
          {strcAt > 0 && <g><line x1={x3(strcAt)} x2={x3(strcAt)} y1={P3.t} y2={P3.t+ch3} stroke="#22d3ee" strokeWidth="0.7" strokeDasharray="3,3" opacity="0.7"/>
            <text x={x3(strcAt)+4} y={P3.t+10} fill="#22d3ee" fontSize={TYPE.label}>STRC starts</text></g>}
          <path d={ln("a")} fill="none" stroke={AMB} strokeWidth="1.1" opacity="0.9"/>
          <path d={ln("t")} fill="none" stroke="#22d3ee" strokeWidth="1.3"/>
          <path d={ln("p")} fill="none" stroke="#f1f5f9" strokeWidth="1.2"/>
          {[0,wk.length-1].map((i,k) => <text key={k} x={k ? P3.l+cw3 : P3.l} y={H3-6} fill="#7aa5c8" fontSize={TYPE.label} textAnchor={k ? "end" : "start"}>{mdy(wk[i].d)}</text>)}
        </svg>
        <div style={FT}><More hide>{"That is why the best estimate carries the gap. Red shading means Bitcoin closed below its 200 day average. "
          + "mNAV has fallen over time in both kinds of market. Period medians follow. "+per.map(q => q.name+" "+x2h(q.median)).join(". ")+". So the bull and bear medians below are partly a before and after. "
          + "Early levels are approximate because the share count is scaled by one constant. Built through "+mdy(hist.as_of)+"."}</More></div>
        {tbl("TWO YEARS, "+mdy(hist.from)+" TO "+mdy(hist.as_of), ["MARKET","DAYS","MEDIAN mNAV","MIDDLE HALF"],
          all.map(r => [r.name === "bull" ? "Bull" : "Bear", String(r.days), x2h(r.median), x2h(r.low)+" to "+x2h(r.high)]))}
        {tbl("AVERAGE MISS SINCE STRC BEGAN", narrow ? ["MARKET","DAYS","PROJECTED","BEST EST."] : ["MARKET","DAYS","PROJECTED","BEST ESTIMATE"],
          [["Bull",bullE],["Bear",bearE],["All",allE]].map(([n,r]) => [n, String(r.scored ?? UNK), pc(r.err_projected), pc(r.err_best)]))}
        <div style={FT}><More hide>{"The miss measures the average distance from MSTR's close to the estimate. It is a share of the price. It covers days that have both estimates, given where Bitcoin and STRC actually went."}</More></div>
      </div>; })()}
  </div>;
}

function BTCPowerLaw() {
  const [today, setToday] = useState(()=>new Date());   // rolled by the poller, so a page left open crosses midnight and month end
  const todayTs = today.getTime();

  useEffect(() => { try { localStorage.setItem("bql_tab", tab); } catch(_) {} }, [tab]);

  const [priceStr,  setPriceStr]  = useState("85000");
  const follow = useRef(true);   // false once the price is typed, stepped or preset
  const [livePrice, setLivePrice] = useState(null);
  const [liveFetch, setLiveFetch] = useState("fetching…");

  // Fetch live BTC price + history
  useEffect(()=>{
    let on = true, id = null, pricePending = false;
    async function fetchPrice(){
      if (pricePending) return; pricePending = true;
      try {
      const apply = (p) => {
        if(!on) return;
        setLivePrice(p);
        if (follow.current) setPriceStr(Math.round(p).toString());
        setLiveFetch("live");
        setLiveUpdatedAt(new Date());
      };
      try {
        const res = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd");
        if(!res.ok) throw new Error();
        const j = await res.json();
        const p = j?.bitcoin?.usd;
        if(p) { apply(p); return; }
        throw new Error();
      } catch(_){}
      try { // fallback: Coinbase spot
        const res = await fetch("https://api.coinbase.com/v2/prices/BTC-USD/spot");
        if(!res.ok) throw new Error();
        const j = await res.json();
        const p = parseFloat(j?.data?.amount);
        if(p) { apply(p); return; }
        throw new Error();
      } catch(_){
        if (on) setLiveFetch("unavailable");
      }
      } finally { pricePending = false; }
    }
    let histDay = null;   // the UTC day of the last good history fetch
    async function fetchHistory(){
      try {
        const res = await fetch("https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=usd&days=365&interval=daily");
        if(!res.ok) throw new Error();
        const j = await res.json();
        if(on && j?.prices?.length > 100){
          // Merge: seed covers pre-2024, live covers last 365 days
          const liveStart = j.prices[0][0];
          const seedOld = SEED_PRICES.map(([ym,p])=>[new Date(ym+"-01").getTime(),p]).filter(([ts])=>ts < liveStart);
          setLiveHistory([...seedOld, ...j.prices]);
          histDay = new Date().getUTCDate();
        }
      } catch(_){ /* fall back to seed */ }
    }
    fetchPrice();
    fetchHistory();
    const nxt = () => msOpen(new Date()) ? 60000 : 300000;
    // a page left open rolls its clock every poll and refetches the daily history on a new UTC day (the monthly close lands there) and when it comes back into view
    const roll = () => { setToday(new Date()); if (new Date().getUTCDate() !== histDay) fetchHistory(); };
    const run = () => { if(!on) return; fetchPrice(); roll(); id = setTimeout(run, nxt()); };
    const onVis = () => { if (on && document.visibilityState === "visible") { fetchPrice(); roll(); } };
    document.addEventListener("visibilitychange", onVis);
    id = setTimeout(run, nxt());
    return () => { on = false; if(id) clearTimeout(id); document.removeEventListener("visibilitychange", onVis); };
  },[]);

  const price = parseFloat(priceStr.replace(/[^0-9.]/g,""))||0;
  const fv    = fairValueAt(todayTs, modelA, modelB);
  const q     = priceToQuantile(price, todayTs, modelA, modelB);
  // the band follows the monthly close; the live quantile is a touch until the next one
  const mc    = monthlyClose(liveHistory, todayTs);
  const qM    = mc ? priceToQuantile(mc.price, mc.ts, modelA, modelB) : q;
  const lockedTier = getTier(qM);
  const preview = !follow.current;

                      <span style={{fontSize:"10px",fontWeight:700,letterSpacing:width < 16 && window.innerWidth < 560 ? "0" : "0.08em",

                      {/* a phone box under 16 points wide holds the ticker only; the MSTR and STRC boxes still carry 10, 60 and 75, and the BAND rule below spells them out */}
                      {!(width < 16 && window.innerWidth < 560) && <span style={{fontSize:TYPE.label,color:active?t.color+"cc":t.color+"66",
                        whiteSpace:"nowrap"}}>{t.qMin.toFixed(0)}{" to "}{Math.min(100,t.qMax).toFixed(0)}</span>}
                    </div>

                {/* current quantile needle */}
                <div style={{position:"absolute",top:"0",bottom:"0",
                  left:`${Math.min(100,Math.max(0,q))}%`,width:"2px",marginLeft:"-1px",

                  left:`${Math.min(100,Math.max(0,q))}%`,transform:"translateX(-50%)",

                letterSpacing:"0.1em",fontWeight:600,marginBottom:"10px"}}>Structure</div>
              {[
                { leg:"LONG",  s:strikes.long,  qLab:"0.75 delta", px:"Chain strike below spot",

                    const v = tk === "MSTR" ? mu.conv(strikes.short.price) : tk === "MSTX" ? mu.convX(strikes.short.price, strikes.short.ts) : null;
                    return v > 0 ? " · " + tk + " " + (tk === "MSTX" ? usd2(v) : fmtFull(v)) : ""; })(),
                  sub:`${strikes.short.days} d · roll at expiry` },
              ].map(({leg,s,qLab,px,sub})=>(
                <div key={leg} style={{display:"flex",alignItems:"baseline",gap:"12px",flexWrap:"wrap",

              <div style={{

                <div style={{fontSize:"12px",color:"#7ab8d8",textTransform:"uppercase",
                  letterSpacing:"0.1em",fontWeight:600,marginBottom:"10px"}}>Margin Framework</div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))",gap:"10px"}}>
                  {[
                    { label:"Leverage",     val:`${tier.margin.leverage}×` },
                    { label:"Net carry",    val:`~${(ms.carry*100).toFixed(1)}%`, hint:"on equity" },

                    </div>

                </div>
              </div>
            );
          })()}
          <LadderRules tier={tier}/>
      </div>

          {/* FORWARD PROJECTION TABLE */}
      <ForwardTable todayTs={todayTs} units={units} setUnits={setUnits} mu={mu}
        modelA={modelA} modelB={modelB}/>

      {/* PRICE LOOKUP */}
      <PriceLookup btcPrice={price} liveHistory={liveHistory} dateStr={lookupDate}
        setDateStr={setLookupDate} units={units} setUnits={setUnits} mu={mu}
        modelA={modelA} modelB={modelB}/>

      {/* POWER LAW CHART */}
      <PowerLawChart btcPrice={price} todayTs={todayTs} liveHistory={liveHistory} lookupTs={lookupDate ? Date.parse(lookupDate + "T00:00:00Z") : null} modelA={modelA} modelB={modelB}/>

      <div style={{marginTop:"24px",paddingTop:"16px",borderTop:"1px solid #0a1628"}}>
        <div style={{fontSize:"10px",color:"#3a5a78",textAlign:"center",letterSpacing:"0.12em",textTransform:"uppercase",fontWeight:500}}>
          <span style={{display:"inline-block",whiteSpace:"nowrap",marginRight:12}}>Kaim Power Law Model</span><span style={{display:"inline-block",whiteSpace:"nowrap",marginRight:12}}>{"Model "+MODEL.name+" · A="+JV_A.toFixed(2)+" · B="+String(JV_B.toFixed(3)).replace("-","−")+" · clock "+mdy(MODEL.clock)}</span><span style={{display:"inline-block",whiteSpace:"nowrap",marginRight:12}}>Bands on the monthly close</span><span style={{display:"inline-block",whiteSpace:"nowrap"}}>12 month long · 3 month short</span>
        </div>
      </div>
      </>)}

      {tab === "playbook" && <PlaybookTab todayTs={todayTs} tier={tier} q={q}/>}

      <div hidden={tab !== "mstr"}><MstrTab liveBtc={liveFetch === "live" ? livePrice : null} modelA={modelA} modelB={modelB}/></div>
    </div>
  );
}


    const ssGet = k => { try { return sessionStorage.getItem(k); } catch(_) { return null; } };
    const ssSet = (k, v) => { try { sessionStorage.setItem(k, v); } catch(_) {} };

    function App() {
      const [unlocked, setUnlocked] = React.useState(() => ssGet('bql_ok') === '1');
      const [pin, setPin] = React.useState("");
      const [err, setErr] = React.useState(false);

      const fail = () => { setErr(true); setPin(""); setTimeout(() => setErr(false), 2000); };
      const attempt = () => {
        if (!(window.crypto && window.crypto.subtle)) { setErr(true); return; }
        crypto.subtle.digest("SHA-256", new TextEncoder().encode(pin)).then(h => {
          const hex = [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("");
          if (hex === "60cafa03272449d4129f58adaa38cc9604e1d4c9c74362084ac4fac09b4d6f0d") {
            ssSet('bql_ok','1'); setUnlocked(true);
          } else { fail(); }
        }).catch(fail);
      };

      if (unlocked) return <>
        <BTCPowerLaw />
      </>;

      return (
        <div style={{display:"flex",alignItems:"center",justifyContent:"center",
          minHeight:"100vh",background:"#020817",fontFamily:"var(--font, 'JetBrains Mono', monospace)"}}>
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:"11px",color:"#5a8fc0",textTransform:"uppercase",
              letterSpacing:"0.18em",marginBottom:"32px",fontWeight:600}}>BTC Quantile Ladder</div>
            <input aria-label="PIN" type="password" maxLength={10} placeholder="····" value={pin}
              onChange={e => setPin(e.target.value)}
              onKeyDown={e => e.key === "Enter" && attempt()}
              style={{background:"#070f1f",border:"1px solid #0f2a42",borderRadius:"6px",
                color:"#facc15",fontSize:"20px",fontFamily:"inherit",padding:"12px 18px",
                width:"160px",outline:"none",textAlign:"center",letterSpacing:"0.3em"}}/>
            <div style={{marginTop:"16px"}}>
              <button onClick={attempt}
                style={{background:"#070f1f",border:"1px solid #1a3a5c",borderRadius:"6px",
                  color:"#8aaac8",fontSize:"11px",fontFamily:"inherit",padding:"10px 24px",
                  cursor:"pointer",letterSpacing:"0.1em",textTransform:"uppercase",fontWeight:600}}>
                Enter
              </button>
            </div>
            <div style={{color:"#ef4444",fontSize:"11px",marginTop:"12px",
              letterSpacing:"0.06em",opacity:err?1:0,transition:"opacity 0.2s"}}>
              incorrect passcode
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
  <script>
    function applyMobileStyles() {
      const mobile = window.innerWidth < 560;
      const existing = document.getElementById('m');
      if (!mobile) {
        if (existing) existing.remove();
        return;
      }
      if (existing) return;
      const s = document.createElement('style');
      s.id = 'm';
      s.textContent = `
        /* Four Ladder stat cards: two by two on phones, as before 9/17. */
        #root [style*="grid-template-columns: repeat(4, 1fr)"] { grid-template-columns: repeat(2,1fr) !important; }
        /* Price lookup: 6-col → 3-col */
        #root [style*="repeat(6, 1fr)"] { grid-template-columns: repeat(3,1fr) !important; }
        /* Header row: stack on mobile */
        #root [style*="justify-content: space-between"][style*="gap: 8px"] { flex-wrap: wrap !important; }
        /* Tier card: stack its text on mobile */
        #root [style*="justify-content: space-between"][style*="gap: 16px"] { 
          flex-direction: column !important; align-items: flex-start !important; 
        }
        /* Quantile rail: stack name over range, taller container */
        #root [style*="height: 40px"][style*="position: relative"] { height: 52px !important; }
        #root [style*="overflow: hidden"][style*="gap: 5px"][style*="position: absolute"] { flex-direction: column !important; gap: 1px !important; }
        /* Model selector: wrap */
        #root [style*="margin-left: 4px"][style*="gap: 8px"] { flex-wrap: wrap !important; }
        #root [style*="margin-left: 4px"][style*="gap: 8px"] > * { min-width: 0 !important; }
        /* General: tighter padding */
        #root > div { padding-left: 12px !important; padding-right: 12px !important; }
      `;
      document.head.appendChild(s);
    }
    // Run after React mounts content
    const _observer = new MutationObserver(() => applyMobileStyles());
    _observer.observe(document.getElementById('root'), {childList:true, subtree:false});
    window.addEventListener('resize', applyMobileStyles);
    // Also run once on load in case observer fires too early
    window.addEventListener('load', applyMobileStyles);
  </script>
</body>
