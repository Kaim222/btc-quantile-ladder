// Derive SEED_PRICES as ["YYYY-MM", price] pairs from BTC_HISTORY for chart merge
const SEED_PRICES = BTC_HISTORY.map(({days, price}) => {
  const d = new Date(GENESIS.getTime() + days * 86400000);

// Fit EMA-weighted power law regression. halfLifeDays=Infinity → Kaim fixed.
function fitEMA(halfLifeDays) {
  if (!halfLifeDays || halfLifeDays >= 1e9) return { A: JV_A, B: JV_B };
  const todayDays = (Date.now() - GENESIS_MS) / 86400000;
  let sw=0, swx=0, swy=0, swxx=0, swxy=0;
  for (const {days, price} of BTC_HISTORY) {
    const age = todayDays - days;
    const w = Math.exp(-Math.LN2 * age / halfLifeDays);
    const x = Math.log10(days);
    const y = Math.log10(price);
    sw   += w;
    swx  += w * x;
    swy  += w * y;
    swxx += w * x * x;
    swxy += w * x * y;
  }
  const denom = sw * swxx - swx * swx;
  if (Math.abs(denom) < 1e-12) return { A: JV_A, B: JV_B };
  const A = (sw * swxy - swx * swy) / denom;
  const B = (swy - A * swx) / sw;
  return { A, B };
}

function daysFromGenesis(ts) {
  return (ts - GENESIS_MS) / 86400000;
}
function fairValueAt(ts, A=JV_A, B=JV_B) {
  const d = daysFromGenesis(ts);
  return d > 0 ? Math.pow(10, A * Math.log10(d) + B) : 0;
}

// Band offsets — upper bands decay linearly over time (empirical fit)
// offset(days) = m * days + c  for 99.9%, 95%, 85%
// constant for 50%, 15%, 0.1%
// Upper bands: cap decay at today's day count (matches Excel MIN(days,today) fix)
// Without this, 99.9th crosses below 95th at ~day 9578 and 85th hits 50th at ~day 9171
const TODAY_DAYS = (Date.now() - GENESIS_MS) / 86400000;
function bandOffset(mSlope, cIntercept, ts) {
  const days = (ts - GENESIS_MS) / 86400000;
  // For decaying bands (m < 0), cap at today's value so projections don't collapse
  const effectiveDays = mSlope < 0 ? Math.min(days, TODAY_DAYS) : days;
  return mSlope * effectiveDays + cIntercept;
}

const BAND_DEFS = [
  { q: 99.9, m: -0.0000756204, c:  0.7434,  label: "99.9%", color: "#3b82f6", dash: "2,4", w: 0.8, dim: true },

// BANDS with offset computed at current time (for gauge/quantile calc)
const BANDS = BAND_DEFS.map(b => ({ ...b, offset: bandOffset(b.m, b.c, Date.now()) }));

function bandPriceAt(ts, bandDef, A=JV_A, B=JV_B) {
  const offset = bandOffset(bandDef.m, bandDef.c, ts);
  return fairValueAt(ts, A, B) * Math.pow(10, offset);
}

function priceToQuantile(price, ts, A=JV_A, B=JV_B) {
  const fv = fairValueAt(ts, A, B);
  if (!fv || price <= 0) return 50;
  const res = Math.log10(price / fv);
  // Compute offsets fresh for the given timestamp (upper bands decay over time)
  const bands = BAND_DEFS.map(b => ({ ...b, offset: bandOffset(b.m, b.c, ts) }));
  // Interpolate between calibration points
  for (let i = 0; i < bands.length - 1; i++) {
    const hi = bands[i], lo = bands[i + 1];
    if (res <= hi.offset && res >= lo.offset) {
      const t = (res - lo.offset) / (hi.offset - lo.offset);
      return lo.q + t * (hi.q - lo.q);
    }
  }
  if (res > bands[0].offset) {
    // Above 99.9th — extrapolate
    const slope = (bands[0].q - bands[1].q) / (bands[0].offset - bands[1].offset);
    return Math.min(99.99, bands[0].q + slope * (res - bands[0].offset));
  }
  // Below 0.1st — extrapolate
  const slope = (bands[bands.length-2].q - bands[bands.length-1].q) /
                (bands[bands.length-2].offset - bands[bands.length-1].offset);
  return Math.max(0.01, bands[bands.length-1].q + slope * (res - bands[bands.length-1].offset));
}

// ─────────────────────────────────────────────────────────────────────────────
// INSTRUMENT LADDER
// ─────────────────────────────────────────────────────────────────────────────
// Quantile → price at any date (inverse of priceToQuantile; interpolates band offsets)
function quantileToPrice(qq, ts, A=JV_A, B=JV_B) {
  const fv = fairValueAt(ts, A, B);
  const bands = BAND_DEFS.map(b => ({ q: b.q, offset: bandOffset(b.m, b.c, ts) }));
  let offset;
  if (qq >= bands[0].q) {
    const s = (bands[0].offset - bands[1].offset) / (bands[0].q - bands[1].q);
    offset = bands[0].offset + s * (qq - bands[0].q);
  } else if (qq <= bands[bands.length-1].q) {
    const a = bands[bands.length-2], z = bands[bands.length-1];
    const s = (a.offset - z.offset) / (a.q - z.q);
    offset = z.offset + s * (qq - z.q);
  } else {
    for (let i = 0; i < bands.length - 1; i++) {
      const hi = bands[i], lo = bands[i+1];
      if (qq <= hi.q && qq >= lo.q) {
        const t = (qq - lo.q) / (hi.q - lo.q);
        offset = lo.offset + t * (hi.offset - lo.offset);
        break;
      }
    }
  }
  return fv * Math.pow(10, offset);
}

function getTier(q) {
  const idx = LADDER.findIndex(t => q >= t.qMin && q < t.qMax);
  const i = idx >= 0 ? idx : (q >= LADDER[0].qMax ? 0 : LADDER.length - 1);
  return { tier: LADDER[i], idx: i };
}

// Strike computation for a pmcc tier at a given "now"
function tierStrikes(t, nowTs, A=JV_A, B=JV_B) {
  if (t.kind !== "pmcc") return null;
  const longTs  = addMonths(nowTs, t.longMo);
  const shortTs = addMonths(nowTs, t.shortMo);
  return {
    long:  { q: t.longQ,  ts: longTs,  price: quantileToPrice(t.longQ,  longTs,  A, B), mo: t.longMo },
    short: { q: t.shortQ, ts: shortTs, price: quantileToPrice(t.shortQ, shortTs, A, B), mo: t.shortMo },
  };
}

// Margin framework math (per $1 equity): position = L, borrowed = L-1
function marginStats(m) {
  const carry = m.leverage * m.yield - (m.leverage - 1) * m.rate;           // net carry on equity
  const callDD = 1 - (m.leverage - 1) / (m.leverage * (1 - m.maint));      // drawdown to margin call
  return { carry, callDD, callPx: 100 * (1 - callDD) };
}

              {c.label}
            </div>
          ))}
          {/* rows */}
          {displayBands.map(q=>{
            const band = BANDS.find(b=>b.q===q);
            const isFV = q===50;
            const rowColor = band.color;
            return [
              <div key={q+"label"} style={{padding:"5px 6px",borderBottom:"1px solid #070f1f",
                color:rowColor,fontWeight:700,fontSize:"11px"}}>{band.label}</div>,
              ...cols.map(c=>{
                const p = bandPriceAt(c.ts, band, modelA, modelB);
                const isPast = c.label==="1yr ago"||c.label==="6mo ago";
                return (
                  <div key={q+c.label} style={{padding:"5px 6px",borderBottom:"1px solid #070f1f",
                    textAlign:"center",
                    color: isPast?"#3a5a70" : isFV?"#38bdf8":"#7a9ab8",
                    background: isFV&&!isPast?"#061628":"transparent",
                    fontWeight: isFV&&!isPast?600:400}}>
                    {fmt(p)}
                  </div>
                );
              })
            ];
          })}
        </div>
      </div>
    </div>
  );
}

function thirdFriday(year, month) { // month 0-11, returns UTC ts
  const first = new Date(Date.UTC(year, month, 1));
  const dow = first.getUTCDay();
  const firstFri = 1 + ((5 - dow + 7) % 7);
  return Date.UTC(year, month, firstFri + 14);
}
function isThirdFriday(ts) {
  const d = new Date(ts);
  return thirdFriday(d.getUTCFullYear(), d.getUTCMonth()) === ts;
}
function nextOpex(ts, dir) { // dir +1 / -1: nearest monthly opex strictly beyond ts
  const d = new Date(ts);
  let y = d.getUTCFullYear(), m = d.getUTCMonth();
  for (let i = 0; i < 24; i++) {
    const tf = thirdFriday(y, m);
    if (dir > 0 && tf > ts) return tf;
    if (dir < 0 && tf < ts) return tf;
    m += dir;
    if (m > 11) { m = 0; y++; }
    if (m < 0)  { m = 11; y--; }
  }
  return ts;
}
const tsToDateStr = ts => new Date(ts).toISOString().slice(0, 10);

function priceOn(history, ts) {
  // nearest historical point within tolerance (10d daily era, 40d monthly seed era)
  if (!history || !history.length) return null;
  let best = null, bd = Infinity;
  for (const [t, p] of history) {
    const d = Math.abs(t - ts);
    if (d < bd) { bd = d; best = [t, p]; }
  }
  if (!best) return null;
  const tol = best[0] > Date.parse("2025-08-01") ? 10 : 40;
  return bd <= tol * 86400000 ? { ts: best[0], price: best[1] } : null;
}

function lookupDefaultDate() {
  try {
    const saved = localStorage.getItem("lookupDate");
    if (saved && Date.parse(saved + "T00:00:00Z") > Date.now()) return saved;
  } catch(_) {}
  return tsToDateStr(nextOpex(Date.now(), 1));
}

// ─────────────────────────────────────────────────────────────────────────────
// POWER LAW CHART (SVG)
// ─────────────────────────────────────────────────────────────────────────────
function PowerLawChart({ btcPrice, todayTs, liveHistory, lookupTs, modelA=JV_A, modelB=JV_B }) {
  const canvasRef = useRef(null);

  // Chart dimensions
  const W = 900, H = 420, PAD = {t:30, r:20, b:40, l:65};
  const cw = W - PAD.l - PAD.r, ch = H - PAD.t - PAD.b;

  // Time range: 2011-01-01 to +5 years
  const tMin = new Date("2011-01-01").getTime();
  const tMax = new Date(new Date().getFullYear() + 5, 11, 31).getTime();

  // Price range in log scale — tighter ceiling to reduce dead space
  const pMin = Math.log10(0.3);     // $0.30
  const pMax = Math.log10(1000000); // $1M

  const tx = ts => PAD.l + cw * (ts - tMin) / (tMax - tMin);
  const ty = logP => PAD.t + ch * (1 - (logP - pMin) / (pMax - pMin));

  // Build band curves (monthly resolution)
  const months = [];
  {
    const d = new Date(2011, 0, 1);
    const end = new Date(new Date().getFullYear() + 5, 11, 31);
    while (d <= end) {
      months.push(d.getTime());
      d.setMonth(d.getMonth() + 1);
    }
  }

  // Band fill areas (between adjacent bands)
  const bandFills = useMemo(() => {
    const fills = [];
    const bandPairs = [
      { upper: BAND_DEFS[2], lower: BAND_DEFS[3], color: "#22d3ee", opacity: 0.07 },  // 50-85  IBIT
      { upper: BAND_DEFS[3], lower: BAND_DEFS[4], color: "#f97316", opacity: 0.07 },  // 15-50  MSTR
      { upper: BAND_DEFS[4], lower: BAND_DEFS[5], color: "#ef4444", opacity: 0.07 },  // 0.1-15 MSTX
      { upper: BAND_DEFS[1], lower: BAND_DEFS[2], color: "#22c55e", opacity: 0.05 },  // 85-95  STRC
    ];
    for (const {upper, lower, color, opacity} of bandPairs) {
      let pathUp = "", pathDn = "";
      for (let i = 0; i < months.length; i++) {
        const ts = months[i];
        const pU = bandPriceAt(ts, upper, modelA, modelB);
        const pL = bandPriceAt(ts, lower, modelA, modelB);
        if (pU <= 0 || pL <= 0) continue;
        const x = tx(ts);
        const yU = ty(Math.log10(Math.min(pU, 1e6)));
        const yL = ty(Math.log10(pL));
        pathUp += (pathUp ? "L" : "M") + x.toFixed(1) + "," + yU.toFixed(1);
        pathDn = x.toFixed(1) + "," + yL.toFixed(1) + (pathDn ? "L" : "") + pathDn;
      }
      fills.push({ d: pathUp + "L" + pathDn + "Z", color, opacity });
    }
    return fills;
  }, [months, modelA, modelB]);

  // Band lines
  const bandLines = useMemo(() => {
    return BAND_DEFS.map(b => {
      let d = "";
      for (const ts of months) {
        const p = bandPriceAt(ts, b, modelA, modelB);
        if (p <= 0) continue;
        const x = tx(ts), y = ty(Math.log10(p));
        d += (d ? "L" : "M") + x.toFixed(1) + "," + y.toFixed(1);
      }
      return { ...b, d };
    });
  }, [months, modelA, modelB]);

  // Historical price line from seed + live data
  const pricePath = useMemo(() => {
    const pts = [];
    // Use BTC_HISTORY (monthly seed) for pre-live data
    for (const {days, price} of BTC_HISTORY) {
      const ts = GENESIS_MS + days * 86400000;
      if (ts >= tMin && ts <= tMax && price > 0) {
        pts.push([ts, price]);
      }
    }
    // Overlay live data — downsample daily to weekly to match seed density
    if (liveHistory) {
      const weekMs = 7 * 86400000;
      const buckets = new Map();
      for (const [ts, price] of liveHistory) {
        if (ts >= tMin && ts <= tMax && price > 0) {
          const weekKey = Math.floor(ts / weekMs);
          const existing = buckets.get(weekKey);
          // Keep the last data point in each week
          if (!existing || ts > existing[0]) buckets.set(weekKey, [ts, price]);
        }
      }
      for (const [, pt] of buckets) pts.push(pt);
    }
    // Sort and deduplicate: keep one point per ~7-day window
    pts.sort((a,b) => a[0] - b[0]);
    const deduped = [];
    for (const pt of pts) {
      if (deduped.length === 0 || pt[0] - deduped[deduped.length-1][0] > 5*86400000) {
        deduped.push(pt);
      }
    }
    // Build smooth SVG path using Catmull-Rom → cubic bezier conversion
    if (deduped.length < 2) return "";
    const points = deduped.map(([ts, price]) => [tx(ts), ty(Math.log10(price))]);
    let d = `M${points[0][0].toFixed(1)},${points[0][1].toFixed(1)}`;
    for (let i = 0; i < points.length - 1; i++) {
      const p0 = points[Math.max(0, i - 1)];
      const p1 = points[i];
      const p2 = points[i + 1];
      const p3 = points[Math.min(points.length - 1, i + 2)];
      // Catmull-Rom to cubic bezier control points (tension=0.5)
      const cp1x = p1[0] + (p2[0] - p0[0]) / 6;
      const cp1y = p1[1] + (p2[1] - p0[1]) / 6;
      const cp2x = p2[0] - (p3[0] - p1[0]) / 6;
      const cp2y = p2[1] - (p3[1] - p1[1]) / 6;
      d += ` C${cp1x.toFixed(1)},${cp1y.toFixed(1)} ${cp2x.toFixed(1)},${cp2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
    }
    return d;
  }, [liveHistory]);

  // Y-axis labels
  const yLabels = [1, 10, 100, 1000, 10000, 100000, 1000000];

  // X-axis labels
  const xLabels = [];
  for (let yr = 2012; yr <= new Date().getFullYear() + 5; yr += 2) {
    const ts = new Date(yr, 0, 1).getTime();
    if (ts >= tMin && ts <= tMax) xLabels.push({ yr, ts });
  }

  // Today marker
  const todayX = tx(todayTs);
  const priceY = btcPrice > 0 ? ty(Math.log10(btcPrice)) : null;

  return (
    <div style={{background:"#040c1a",border:"1px solid #0a1628",borderRadius:"6px",padding:"16px 18px",marginTop:"14px"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"10px"}}>
        <div style={{fontSize:"11px",color:"#5a8fc0",textTransform:"uppercase",letterSpacing:"0.12em",fontWeight:600}}>
          Power Law Bands
        </div>
        {/* Legend */}
        <div style={{display:"flex",gap:"10px",flexWrap:"wrap",alignItems:"center"}}>
          <div style={{display:"flex",alignItems:"center",gap:"5px"}}>
            <div style={{width:"14px",height:"2.5px",background:"#f1f5f9",borderRadius:"1px"}}/>
            <span style={{fontSize:"11px",color:"#8aaac8",fontWeight:700}}>BTC</span>
          </div>
          {[...BAND_DEFS].reverse().map(b => (
            <div key={b.q} style={{display:"flex",alignItems:"center",gap:"5px"}}>
              <div style={{width:"14px",height:"2.5px",background:b.color,borderRadius:"1px",opacity:0.9}}/>
              <span style={{fontSize:"11px",color:b.color,fontWeight:700}}>{b.label}</span>
            </div>
          ))}
        </div>
      </div>
      <div style={{overflowX:"auto"}}>
        <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",maxWidth:`${W}px`,height:"auto",display:"block"}}>
          {/* Background */}
          <rect x={PAD.l} y={PAD.t} width={cw} height={ch} fill="#070f1f" rx="2"/>

          {/* Grid lines */}
          {yLabels.map(v => {
            const y = ty(Math.log10(v));
            return y >= PAD.t && y <= PAD.t + ch ? (
              <line key={v} x1={PAD.l} x2={PAD.l+cw} y1={y} y2={y} stroke="#0d1e30" strokeWidth="0.5"/>
            ) : null;
          })}

          {/* Band fills */}
          {bandFills.map((f,i) => (
            <path key={i} d={f.d} fill={f.color} opacity={f.opacity}/>
          ))}

          {/* Band lines */}
          {bandLines.map(b => (
            <path key={b.q} d={b.d} fill="none" stroke={b.color} strokeWidth={b.w} opacity={b.dim ? 0.35 : 0.9}
              strokeDasharray={b.dash} opacity={0.7}/>
          ))}

          {/* Historical price line */}
          <path d={pricePath} fill="none" stroke="#f1f5f9" strokeWidth="1.2" opacity="0.85"/>

          {/* Today vertical line */}
          <line x1={todayX} x2={todayX} y1={PAD.t} y2={PAD.t+ch}
            stroke="#22d3ee" strokeWidth="0.5" strokeDasharray="3,3" opacity="0.4"/>
          <text x={todayX} y={PAD.t-6} fill="#22d3ee" fontSize="11" textAnchor="middle" opacity="0.7">TODAY</text>

          {/* Lookup-date marker */}
          {lookupTs && Math.abs(lookupTs - todayTs) > 86400000 && (() => {
            const lx = tx(lookupTs);
            if (lx < PAD.l || lx > PAD.l + cw) return null;
            const past = lookupTs < todayTs;
            const h = past ? priceOn(liveHistory, lookupTs) : null;
            const hy = h ? ty(Math.log10(h.price)) : null;
            return (
              <>
                <line x1={lx} x2={lx} y1={PAD.t} y2={PAD.t+ch}
                  stroke="#7dd3fc" strokeWidth="1" strokeDasharray="2,4" opacity="0.5"/>
                {h && hy >= PAD.t && hy <= PAD.t+ch && (() => {
                  const lw = String(fmtFull(h.price)).length*8+12;
                  const flip = lx > todayX - 130; // avoid TODAY pill collision
                  const rx = flip ? lx-8-lw : lx+8;
                  return (
                    <>
                      <circle cx={lx} cy={hy} r="4" fill="#7dd3fc" stroke="#020817" strokeWidth="2"/>
                      <rect x={rx} y={hy-9.5} width={lw} height="19" rx="3" fill="#020817" opacity="0.85"/>
                      <text x={rx+5} y={hy+4.5} fill="#7dd3fc" fontSize="13" fontWeight="700">{fmtFull(h.price)}</text>
                    </>
                  );
                })()}
              </>
            );
          })()}

          {/* Current price dot */}
          {priceY !== null && priceY >= PAD.t && priceY <= PAD.t+ch && (
            <>
              <circle cx={todayX} cy={priceY} r="5" fill="#facc15" stroke="#020817" strokeWidth="2"/>
              {/* Price label with dark background for readability over band lines */}
              <rect x={todayX+9} y={priceY-9.5} width={String(fmtFull(btcPrice)).length*8+12} height="19" rx="3" fill="#020817" opacity="0.85"/>
              <text x={todayX+14} y={priceY+4.5} fill="#facc15" fontSize="13" fontWeight="700">
                {fmtFull(btcPrice)}
              </text>
            </>
          )}

          {/* Y-axis labels */}
          {yLabels.map(v => {
            const y = ty(Math.log10(v));
            return y >= PAD.t && y <= PAD.t + ch ? (
              <text key={v} x={PAD.l-6} y={y+4} fill="#7aa5c8" fontSize="11" textAnchor="end">
                {v >= 1e6 ? "$"+v/1e6+"M" : v >= 1e3 ? "$"+v/1e3+"K" : "$"+v}
              </text>
            ) : null;
          })}

          {/* X-axis labels */}
          {xLabels.map(({yr,ts}) => (
            <text key={yr} x={tx(ts)} y={PAD.t+ch+18} fill="#7aa5c8" fontSize="11" textAnchor="middle">{yr}</text>
          ))}
        </svg>
      </div>
    </div>
  );
}

const isObj = o => o !== null && typeof o === "object" && !Array.isArray(o);
const rowsOf = v => (Array.isArray(v) ? v.filter(isObj) : []);
function useLocal(key, initial, fix) {
  const [v, setV] = useState(() => { try { const s = localStorage.getItem(key);
    return s === null ? initial : fix(JSON.parse(s)); } catch(_) { return initial; } });
  useEffect(() => { try { localStorage.setItem(key, JSON.stringify(v)); } catch(_) {} }, [key, v]);
  return [v, setV]; }
const nm = s => { if (s == null) return null;

// ── MSTR. Fair value off the STRC-linked mNAV rule, the projection against the tape,
// the cheap episodes, and what the backtest says. Numbers live in data/mstr-model.json. ──
const MS_SL = [[0.0125, "measured: 0.0125 per $2,500"], [0.025, "sheet: 0.025 per $2,500"]];
const MS_MO = ["","Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MS_FLD = [["btc","BTC PRICE"],["mstr","MSTR"],["mstx","MSTX"],["strc","STRC"],
  ["held","BTC HELD"],["sh","SHARES (M)"]];
// the STRC-linked base, a step down for every 2.5 of STRC
const msStrc = s => s >= 97.5 ? 0.90
  : s >= 95 ? 0.875 + (s - 95) * 0.01
  : s >= 92.5 ? 0.85 + (s - 92.5) * 0.01
  : s >= 87.5 ? 0.825 + (s - 87.5) * 0.005
  : s >= 82.5 ? 0.80 + (s - 82.5) * 0.005
  : Math.max(0.775, 0.775 + (s - 77.5) * 0.005);
const msCol = g => g == null ? "#8aaac8" : g < -4 ? GRN : g > 4 ? RD : "#8aaac8";
const msRet = v => v == null ? "#8aaac8" : v > 0 ? GRN : v < 0 ? RD : "#8aaac8";
const msPct = (v, d) => v == null ? UNK : (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(d == null ? 1 : d) + "%";
const msUsd = (v, d) => v == null ? UNK : "$" + v.toFixed(d == null ? 2 : d);
const msNum = (v, d) => v == null ? UNK : v.toFixed(d == null ? 2 : d);
const msMon = s => { const p = String(s||"").split("-");
  return p.length < 2 ? String(s||"") : MS_MO[+p[1]] + " " + String(p[0]).slice(2); };

function MstrTab({ btcPrice, priceStr, livePrice }) {
  const [dat, setDat] = useState(null), [bad, setBad] = useState(false);
  const [f, setF] = useState({btc:"", mstr:"", mstx:"", strc:"", held:"845050", sh:"450.112"});
  const [slope, setSlope] = useState(0.0125);
  const [seed, setSeed] = useState(false);
  const [hov, setHov] = useState(null);
  const [cfg, setCfg] = useState(null);
  const [live, setLive] = useState(null);
  const [post, setPost] = useState(null);
  useEffect(() => {
    let on = true;
    fetch("data/mstr-model.json?t=" + Date.now(), {cache:"no-store"})
      .then(r => { if (!r.ok) throw 0; return r.json(); })
      .then(j => { if (!on) return; if (isObj(j)) setDat(j); else setBad(true); })
      .catch(() => { if (on) setBad(true); });
    fetch("data/mstr-config.json?t=" + Date.now(), {cache:"no-store"})
      .then(r => { if (!r.ok) throw 0; return r.json(); })
      .then(c => { if (!on || !isObj(c)) return;
        const num = x => (x != null && x !== "" && x !== "auto" && isFinite(Number(x))) ? String(x) : null;
        setF(v => ({...v, held: num(c.btc_held) || v.held, sh: num(c.shares_m) || v.sh}));
        if (c.btc_slope_per_2500 != null) setSlope(Number(c.btc_slope_per_2500));
        setCfg(c);
        if (num(c.btc_held) && num(c.shares_m)) return;   // manual override in the file wins
        fetch("https://api.strategy.com/btc/bitcoinKpis", {cache:"no-store"})
          .then(r => { if (!r.ok) throw 0; return r.json(); })
          .then(j => { if (!on) return; const k = j && j.results; if (!isObj(k)) return;
            const held = Number(String(k.btcHoldings).replace(/,/g, "")), sps = Number(k.satsPerShare);
            if (!(held > 100000) || !(sps > 0)) return;
            const sh = held / (sps / 1e8) / 1e6;
            setF(v => ({...v, held: num(c.btc_held) || String(held), sh: num(c.shares_m) || sh.toFixed(3)}));
            setLive({held, sh, mnavEV: k.mNav, ts: k.msTimestamp, post: k.extendedSession || null}); })
          .catch(() => {});
        fetch("https://api.strategy.com/btc/mstrKpiData", {cache:"no-store"})
          .then(r => { if (!r.ok) throw 0; return r.json(); })
          .then(j => { if (!on) return; const k = Array.isArray(j) ? j[0] : j; if (!isObj(k)) return;
            setPost({price: Number(k.price), ts: k.timeStamp, ext: k.extendedSession || null}); })
          .catch(() => {}); })
      .catch(() => {});
    return () => { on = false; };
  }, []);
  const ser = rowsOf(dat && dat.series);
  const last = ser.length ? ser[ser.length - 1] : null;
  useEffect(() => {
    if (seed || !last) return;
    const s = v => v == null ? "" : String(v);
    setF(v => ({...v, btc:s(last.btc), mstr:s(last.mstr), mstx:s(last.mstx), strc:s(last.strc)}));
    setSeed(true);
  }, [seed, last]);

  if (!dat) return (
    <div style={TBL}><div style={BODY}>
      {bad ? "data/mstr-model.json did not load. The tab needs that file."
        : "Loading the MSTR model."}</div></div>);

  // FAIR VALUE NOW
  const g = k => nm(f[k]);
  const held = g("held"), shM = g("sh"), btcI = g("btc"), mstrI = g("mstr");
  const mstxI = g("mstx"), strcI = g("strc");
  const bps = (held == null || !shM) ? null : held / (shM * 1e6);
  const mnav = (bps == null || !btcI || !mstrI) ? null : mstrI / (btcI * bps);
  const tgt = (strcI == null || btcI == null) ? null : msStrc(strcI) + slope * (btcI - 75000) / 2500;
  const proj = (bps == null || btcI == null || tgt == null) ? null : bps * btcI * tgt;
  const gapN = (!proj || mstrI == null) ? null : (mstrI / proj - 1) * 100;
  const pMstx = (mstxI == null || proj == null || !mstrI) ? null : mstxI * (1 + 2.0 * (proj / mstrI - 1));
  const gapW = gapN == null ? UNK : gapN < -4 ? "cheap" : gapN > 4 ? "rich" : "in line";
  // the ladder's render seed, 85000, is never a price
  const own = String(priceStr||"").trim() !== "85000" && typeof btcPrice === "number" && btcPrice > 0;
  const liveBtc = (typeof livePrice === "number" && livePrice > 0) ? livePrice : own ? btcPrice : null;

  // CHART: MSTR against the projection, the gap under it
  const W = 880, PH = 252, GH = 128, P = {t:16, r:14, b:24, l:48};
  const cw = W - P.l - P.r, hP = PH - P.t - P.b, hG = GH - P.t - P.b;
  const n = ser.length;
  const xAt = i => P.l + (n < 2 ? cw/2 : cw * i / (n - 1));
  const pv = [];
  for (const r of ser) { const a = nm(r.mstr), b = nm(r.proj);
    if (a != null) pv.push(a); if (b != null) pv.push(b); }
  const lo = pv.length ? Math.min(...pv) : 0, hiV = pv.length ? Math.max(...pv) : 1;
  const padY = (hiV - lo) * 0.08 || 1;
  const y0 = Math.max(0, lo - padY), y1 = hiV + padY;
  const yAt = v => P.t + hP * (1 - (v - y0) / ((y1 - y0) || 1));
  const gvs = ser.map(r => nm(r.gap)).filter(v => v != null);
  const gA = gvs.length ? Math.max(8, Math.ceil(Math.max(...gvs.map(v => Math.abs(v))) / 5) * 5) : 8;
  // square root on the gap axis, sign kept, so the ±4% band stays readable next to a 40% gap
  const gAt = v => { const c = Math.max(-gA, Math.min(gA, v));
    return P.t + hG * (1 - (Math.sign(c) * Math.sqrt(Math.abs(c) / gA) + 1) / 2); };
  const line = (k, fy) => { let d = "";
    for (let i = 0; i < n; i++) { const v = nm(ser[i][k]);
      if (v == null) continue;
      d += (d ? "L" : "M") + xAt(i).toFixed(1) + "," + fy(v).toFixed(1); }
    return d; };
  const ix = {}; ser.forEach((r, i) => { ix[r.d] = i; });
  const eps = rowsOf(dat.episodes);
  const shade = eps.map(e => { const a = ix[e.start], b = ix[e.end];
    return (a == null || b == null) ? null
      : {k:String(e.start), x:xAt(a), w:Math.max(2, xAt(b) - xAt(a))}; }).filter(Boolean);
  const xT = []; for (let k = 0; k < 6; k++) xT.push(n < 2 ? 0 : Math.round(k * (n - 1) / 5));
  const yT = [0,1,2,3,4].map(k => y0 + k * (y1 - y0) / 4);
  const onMove = e => { const r = e.currentTarget.getBoundingClientRect();
    const t = e.touches && e.touches[0];
    const cx = t ? t.clientX : e.clientX;
    if (!r.width || cx == null || n < 1) return;
    const i = Math.round(((cx - r.left) / r.width * W - P.l) / (cw || 1) * (n - 1));
    setHov(Math.min(n - 1, Math.max(0, i))); };
  const hitP = {onMouseMove:onMove, onMouseLeave:() => setHov(null),
    onTouchStart:onMove, onTouchMove:onMove, style:{width:"100%",maxWidth:W+"px",height:"auto",
      display:"block",cursor:"crosshair",touchAction:"pan-y"}};
  const cur = ser[hov == null ? n - 1 : hov] || {};
  const cGap = nm(cur.gap);
  const read = !cur.d ? UNK : cur.d + " · MSTR " + msUsd(nm(cur.mstr))
    + " · projected " + msUsd(nm(cur.proj)) + " · gap " + msPct(cGap);

  // TABLES
  const fac = isObj(dat.factors) ? dat.factors : {};
  const bB = isObj(fac.mnav_beta_btc) ? fac.mnav_beta_btc : {};
  const bQ = isObj(fac.mnav_beta_qqq) ? fac.mnav_beta_qqq : {};
  const qd = isObj(fac.qqq_days_6m) ? fac.qqq_days_6m : {};
  const bt = isObj(dat.backtest) ? dat.backtest : {};
  const cp = isObj(bt.cheap_4pct) ? bt.cheap_4pct : {};
  const sw = isObj(bt.slope_sweep_h5) ? bt.slope_sweep_h5 : {};
  const reg = isObj(dat.regime) ? dat.regime : {};
  const regR = rowsOf(reg.rows);
  const hdr = hs => hs.map((h, i) =>
    <div key={h} style={{...LAB,padding:"4px 6px",textAlign:i?"right":"left"}}>{h}</div>);
  const cel = (v, i, r, c) => <div key={r + "-" + i} style={{padding:"5px 6px",fontSize:12,
    borderBottom:"1px solid #070f1f",textAlign:i?"right":"left",whiteSpace:"nowrap",
    background:r%2?"transparent":"#050d1c",color:c||(i?"#d0dde8":"#8aaac8"),
    fontWeight:i?600:400}}>{v}</div>;
  const SC = {background:"#070f1f",border:"1px solid #0f2035",borderRadius:"6px",padding:"12px 14px"};
  const SV = {fontSize:22,fontWeight:700,letterSpacing:"-0.01em"};
  const SH = {fontSize:10,color:"#7a9ab8",marginTop:3};
  const FT = {fontSize:10,color:GRY,letterSpacing:"0.04em",marginTop:9};
  const cards = [["BTC PER SHARE", msNum(bps, 6), "held over shares", "#facc15"],
    ["mNAV", msNum(mnav, 4), "MSTR over BTC per share", "#22d3ee"],
    ["TARGET mNAV", msNum(tgt, 4), "STRC rule plus BTC slope", "#22d3ee"],
    ["PROJECTED MSTR", msUsd(proj), "fair value at these inputs", "#facc15"],
    ["GAP", msPct(gapN), gapW, msCol(gapN)],
    ["PROJECTED MSTX", msUsd(pMstx), "same-day, 2x", msCol(gapN)]];

  return (
    <div>
      {/* FAIR VALUE NOW */}
      <div style={{background:"#070f1f",border:"1px solid #0f2035",borderLeft:"4px solid #facc15",

        <div style={{...ROW,justifyContent:"space-between",marginBottom:10}}>

          <span style={{fontSize:10,color:GRY,letterSpacing:"0.06em"}}>
            {"MODEL AS OF " + (dat.as_of || UNK)}</span></div>

            </div>))}
        </div>

        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(132px,1fr))",

              <div style={{...LAB,marginBottom:6}}>{h}</div>
              <div style={{...SV,color:c}}>{v}</div>

        </div>
        <div style={{fontSize:11,color:"#b0c4d8",lineHeight:1.5,marginTop:12}}>
          MSTX and MSTR quotes are the last regular-session trade; after hours BTC keeps moving
          and the gap here is not real until the next print.{" "}{live ? "Holdings " + live.held.toLocaleString() + " BTC and " + live.sh.toFixed(3) + "M assumed diluted shares are live from strategy.com" + (live.ts ? " (" + new Date(live.ts).toLocaleString() + ")" : "") + ". " : "Holdings and shares come from strategy.com when it answers, else from the config file. "}{post && post.ext && post.ext.price ? "MSTR " + post.ext.sessionType + " $" + Number(post.ext.price).toFixed(2) + " at " + post.ext.timeStamp + " (" + (post.ext.priceVarPerc ? (post.ext.negative ? "-" : "+") + post.ext.priceVarPerc + "%" : "") + " vs the close). " : ""}Slope and thresholds come from data/mstr-config.json{cfg && cfg.updated ? " (updated " + cfg.updated + ")" : ""}, the same file the gap monitor reads. <a href="https://github.com/Kaim222/btc-quantile-ladder/edit/main/data/mstr-config.json" target="_blank" rel="noopener" style={{color:"inherit"}}>Edit it on GitHub</a> and both update.</div>
        <div style={FT}>{"Target rule: " + ((dat.model && dat.model.target_rule) || UNK)
          + (dat.model && dat.model.btc_per_share_note

      {/* PROJECTED VS ACTUAL */}

        <div style={{...ROW,justifyContent:"space-between",marginBottom:4}}>
          <span style={HD}>PROJECTED VS ACTUAL</span>

            <span style={{...ROW,gap:5}}>
              <span style={{width:14,height:2.5,background:"#facc15",borderRadius:1}}/>

            <span style={{...ROW,gap:5}}>
              <span style={{width:14,height:0,borderTop:"2px dashed #22d3ee"}}/>

          </span></div>
        <div style={{fontSize:11,color:"#b0c4d8",marginBottom:8,minHeight:"16px"}}>{read}</div>
        <div style={{overflowX:"auto"}}>
          <svg viewBox={"0 0 " + W + " " + PH} {...hitP}>
            <rect x={P.l} y={P.t} width={cw} height={hP} fill="#070f1f" rx="2"/>
            {shade.map(s => <rect key={s.k} x={s.x} y={P.t} width={s.w} height={hP}
              fill="#22c55e" opacity="0.09"/>)}
            {yT.map(v => <line key={v} x1={P.l} x2={P.l+cw} y1={yAt(v)} y2={yAt(v)}
              stroke="#0d1e30" strokeWidth="0.5"/>)}
            <path d={line("proj", yAt)} fill="none" stroke="#22d3ee" strokeWidth="1.4"
              strokeDasharray="4,3" opacity="0.85"/>
            <path d={line("mstr", yAt)} fill="none" stroke="#facc15" strokeWidth="1.4" opacity="0.95"/>
            {hov != null && nm(cur.mstr) != null && (
              <g>
                <line x1={xAt(hov)} x2={xAt(hov)} y1={P.t} y2={P.t+hP} stroke="#7dd3fc"
                  strokeWidth="0.7" strokeDasharray="3,3" opacity="0.6"/>
                <circle cx={xAt(hov)} cy={yAt(nm(cur.mstr))} r="3.2" fill="#facc15"
                  stroke="#020817" strokeWidth="1.5"/>
                {nm(cur.proj) != null && <circle cx={xAt(hov)} cy={yAt(nm(cur.proj))} r="3.2"
                  fill="#22d3ee" stroke="#020817" strokeWidth="1.5"/>}
              </g>)}
            {yT.map(v => <text key={"l"+v} x={P.l-6} y={yAt(v)+4} fill="#7aa5c8" fontSize="10"
              textAnchor="end">{"$" + Math.round(v)}</text>)}
            {xT.map((i, k) => <text key={"x"+k} x={xAt(i)} y={P.t+hP+16} fill="#7aa5c8" fontSize="10"
              textAnchor={k === 0 ? "start" : k === 5 ? "end" : "middle"}>{msMon(ser[i] && ser[i].d)}</text>)}
          </svg>
          <svg viewBox={"0 0 " + W + " " + GH} {...hitP}>
            <rect x={P.l} y={P.t} width={cw} height={hG} fill="#070f1f" rx="2"/>
            {shade.map(s => <rect key={s.k} x={s.x} y={P.t} width={s.w} height={hG}
              fill="#22c55e" opacity="0.09"/>)}
            {[[4, RD],[-4, GRN]].map(([v, c]) => (
              <g key={v}>
                <line x1={P.l} x2={P.l+cw} y1={gAt(v)} y2={gAt(v)} stroke={c} strokeWidth="0.7"
                  strokeDasharray="3,3" opacity="0.5"/>
                <text x={P.l-6} y={gAt(v)+3.5} fill={c} fontSize="9" textAnchor="end"
                  opacity="0.8">{(v > 0 ? "+" : "−") + "4%"}</text>
              </g>))}
            <line x1={P.l} x2={P.l+cw} y1={gAt(0)} y2={gAt(0)} stroke="#5a7fa0" strokeWidth="0.7"/>
            <text x={P.l-6} y={gAt(0)+3.5} fill="#7aa5c8" fontSize="9" textAnchor="end">0</text>
            {[gA, -gA].map(v => <text key={v} x={P.l-6} y={gAt(v) + (v > 0 ? 8 : 0)} fill="#5a7fa0"
              fontSize="9" textAnchor="end">{(v > 0 ? "+" : "−") + gA + "%"}</text>)}
            <path d={line("gap", gAt)} fill="none" stroke="#e2e8f0" strokeWidth="1.2" opacity="0.85"/>
            {hov != null && cGap != null && (
              <g>
                <line x1={xAt(hov)} x2={xAt(hov)} y1={P.t} y2={P.t+hG} stroke="#7dd3fc"
                  strokeWidth="0.7" strokeDasharray="3,3" opacity="0.6"/>
                <circle cx={xAt(hov)} cy={gAt(cGap)} r="3.2" fill={msCol(cGap)}
                  stroke="#020817" strokeWidth="1.5"/>
              </g>)}
            <text x={P.l} y={P.t+hG+16} fill="#5a7fa0" fontSize="9">
              {"GAP, PERCENT · GREEN BANDS ARE THE CHEAP EPISODES"}</text>
          </svg>
        </div>
        <div style={FT}>{n + " daily rows from " + (ser.length ? ser[0].d : UNK) + " to "
          + (last ? last.d : UNK) + ". Hover or tap the chart for a day. The gap axis is square-root "
          + "scaled, so the 4% lines stay apart next to a 40% gap."}</div>
      </div>

      {/* CHEAP EPISODES */}
      <div style={TBL}>
        <div style={{...HD,marginBottom:10}}>CHEAP EPISODES · GAP UNDER −4%</div>
        <div style={{overflowX:"auto"}}><div style={{display:"grid",
          gridTemplateColumns:"196px repeat(10,minmax(58px,1fr))",minWidth:"812px"}}>
          {hdr(["EPISODE","WORST","GAP","MSTR","PROJ","5D MSTR","5D BTC","5D GAP",
            "10D MSTR","10D BTC","10D GAP"])}
          {eps.map((e, r) => [String(e.start) + " to " + String(e.end), md(e.worst_date) || e.worst_date,
            msPct(nm(e.worst_gap)), msUsd(nm(e.mstr_at_worst)), msUsd(nm(e.proj_at_worst)),
            msPct(nm(e.mstr_5d)), msPct(nm(e.btc_5d)), msPct(nm(e.gap_5d)),
            msPct(nm(e.mstr_10d)), msPct(nm(e.btc_10d)), msPct(nm(e.gap_10d))]
            .map((v, i) => cel(v, i, r,
              i === 2 ? msCol(nm(e.worst_gap)) : i === 5 ? msRet(nm(e.mstr_5d))
                : i === 8 ? msRet(nm(e.mstr_10d)) : null)))}
        </div></div>
        {!eps.length && <div style={{...BODY,paddingTop:7}}>No episodes in the file.</div>}
        <div style={FT}>{"5D and 10D are trading days after the worst day of the episode. "
          + "Days in episode: " + eps.map(e => e.days).join(", ") + "."}</div>
      </div>

      {/* WHAT MOVES mNAV */}
      <div style={{...TBL,display:"flex",gap:"14px",flexWrap:"wrap"}}>
        <div style={{flex:"1 1 260px",minWidth:0}}>
          <div style={{...HD,marginBottom:10}}>WHAT MOVES mNAV · BETA</div>
          <div style={{overflowX:"auto"}}><div style={{display:"grid",
            gridTemplateColumns:"1fr 62px 62px 62px",minWidth:"260px"}}>
            {hdr(["","2Y","6M","3M"])}
            {[["Beta to BTC", bB],["Beta to QQQ", bQ]].map(([lab, o], r) =>
              [lab, msNum(nm(o["2y"])), msNum(nm(o["6m"])), msNum(nm(o["3m"]))]
                .map((v, i) => cel(v, i, r, i ? "#22d3ee" : null)))}
          </div></div>
          <div style={FT}>Daily mNAV change against the daily move in each, over each window.</div>
        </div>
        <div style={{flex:"1 1 300px",minWidth:0}}>
          <div style={{...HD,marginBottom:10}}>QQQ DAYS · LAST 6 MONTHS</div>
          <div style={{overflowX:"auto"}}><div style={{display:"grid",
            gridTemplateColumns:"1fr 58px 96px 88px",minWidth:"300px"}}>
            {hdr(["QQQ DAY","DAYS","MEAN mNAV","SHARE UP"])}
            {["red","flat","green"].map((k, r) => { const o = isObj(qd[k]) ? qd[k] : {};
              return [k, nm(o.n) == null ? UNK : String(nm(o.n)), msPct(nm(o.mean), 2),
                nm(o.up_share) == null ? UNK : nm(o.up_share).toFixed(0) + "%"]
                .map((v, i) => cel(v, i, r,
                  i === 2 ? (nm(o.mean) == null ? null : nm(o.mean) >= 0 ? GRN : RD) : null)); })}
          </div></div>

        <div style={{...HD,marginBottom:8}}>BACKTEST, 9/16/2026</div>
        <div style={{fontSize:13,color:"#b0c4d8",lineHeight:1.5}}>
          {"Window: " + (bt.window || UNK) + "."}</div>
        <div style={{overflowX:"auto",marginTop:10}}><div style={{display:"grid",
          gridTemplateColumns:"1fr repeat(5,minmax(62px,1fr))",minWidth:"430px"}}>
          {hdr(["CHEAP BY 4%","EPISODES","1D","3D","5D","5D HIT"])}
          {[[(nm(cp.days) == null ? UNK : nm(cp.days) + " days"),

        </div></div>

          {hdr(["BTC SLOPE","5-DAY RETURN"])}
          {["0","0.0125","0.025","0.05"].map((k, r) =>

        </div></div>
        {regR.length > 0 && <>

          <div style={{overflowX:"auto"}}><div style={{display:"grid",

              msPct(nm(r.mstr_5d)), msPct(nm(r.btc_5d)),

                border: s.label==="vs fair value" ? `1px solid ${parseFloat(devPct)>0?"#2d0808":"#0a2518"}` : s.label==="quantile" ? `1px solid ${tier.color}30` : "1px solid #0f2035",
                borderRadius:"6px",padding:"14px 16px",
                boxShadow: s.label==="quantile" ? `0 0 20px ${tier.color}11` : "none"}}>
                <div style={{fontSize:"10px",color:"#5a8fc0",textTransform:"uppercase",
                  letterSpacing:"0.12em",marginBottom:"6px",fontWeight:600}}>{s.label}</div>
                <div style={{fontSize:"22px",fontWeight:700,color:s.color,letterSpacing:"-0.01em"}}>{s.value}</div>
              </div>
            ))}
          </div>

          {/* Tier card */}
          <div style={{background:tier.darkBg,border:`1px solid ${tier.color}25`,
            borderLeft:`4px solid ${tier.color}`,borderRadius:"6px",padding:"16px 20px",
            boxShadow:`-4px 0 24px ${tier.color}15, inset 1px 0 0 ${tier.color}08`}}>
            <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:"16px",flexWrap:"wrap"}}>
              <div style={{flex:1}}>
                <div style={{fontSize:"10px",color:"#5a8fc0",textTransform:"uppercase",
                  letterSpacing:"0.12em",marginBottom:"6px",fontWeight:600}}>Active Instrument</div>
                <div style={{fontSize:"28px",fontWeight:700,color:tier.color,
                  lineHeight:1,letterSpacing:"0.02em"}}>{displayName(tier.name)}</div>
                {tier.typeNote && (
                  <div style={{display:"inline-flex",alignItems:"center",gap:"6px",marginTop:"5px",marginBottom:"5px"}}>
                    {tier.typeNote.split(" · ").map((note, i) => (
                      <span key={i} style={{
                        fontSize:"11px", fontWeight:600, letterSpacing:"0.07em",
                        textTransform:"uppercase", color:tier.color,
                        background:tier.color+"18", border:`1px solid ${tier.color}40`,
                        borderRadius:"3px", padding:"2px 6px"
                      }}>{note}</span>
                    ))}
                  </div>
                )}
                <div style={{fontSize:"13px",color:"#b0c4d8",marginTop:"3px"}}>{tier.desc}</div>
                <div style={{fontSize:"12px",color:"#7aaac8",marginTop:"4px"}}>
                  Max interest rate: <span style={{color:"#d0dde8",fontWeight:600}}>{tier.debt}</span>
                </div>
                <div style={{marginTop:"10px",display:"flex",gap:"14px",flexWrap:"wrap",alignItems:"center"}}>
                  {rotateUp && (
                    <span style={{fontSize:"12px",color:"#8aaac8"}}>
                      ↑ <span style={{color:rotateUp.t.color,fontWeight:700}}>{rotateUp.t.name}</span>
                      {" at "}<span style={{color:"#d0dde8",fontWeight:600}}>{rotateUp.q.toFixed(0)}q</span>
                      {" · "}<span style={{color:"#d0dde8"}}>{fmt(quantileToPrice(rotateUp.q, todayTs, modelA, modelB))}</span>
                    </span>
                  )}
                  {rotateDown && (
                    <span style={{fontSize:"12px",color:"#8aaac8"}}>
                      ↓ <span style={{color:rotateDown.t.color,fontWeight:700}}>{rotateDown.t.name}</span>
                      {" at "}<span style={{color:"#d0dde8",fontWeight:600}}>{rotateDown.q.toFixed(0)}q</span>
                      {" · "}<span style={{color:"#d0dde8"}}>{fmt(quantileToPrice(rotateDown.q, todayTs, modelA, modelB))}</span>
                    </span>
                  )}
                  {inBuffer && (
                    <span style={{fontSize:"12px",color:"#eab308"}}>
                      ±{HYST.toFixed(0)}q buffer
                    </span>
                  )}
                </div>
              </div>
              </div>
            <div style={{marginTop:"14px"}}>
              <div style={{position:"relative",height:"40px"}}>
                {LADDER.map(t=>{
                  const left = t.qMin, width = Math.min(100,t.qMax) - t.qMin;
                  const active = t.name === tier.name;
                  return (
                    <div key={t.name} style={{position:"absolute",top:"6px",bottom:"6px",
                      left:`${left}%`,width:`calc(${width}% - 2px)`,
                      background:active?t.color+"30":t.color+"0d",
                      border:`1px solid ${active?t.color:t.color+"40"}`,
                      borderRadius:"4px",overflow:"hidden",
                      boxShadow:active?`0 0 12px ${t.color}44`:"none",
                      display:"flex",alignItems:"center",justifyContent:"center",gap:"5px"}}>
                      <span style={{fontSize:"10px",fontWeight:700,letterSpacing:"0.08em",
                        color:active?t.color:t.color+"99",whiteSpace:"nowrap"}}>{t.name.split(" ")[0]}</span>
                      <span style={{fontSize:"9px",color:active?t.color+"cc":t.color+"66",
                        whiteSpace:"nowrap"}}>{t.qMin.toFixed(0)}–{Math.min(100,t.qMax).toFixed(0)}</span>
                    </div>
                  );
                })}
                {/* current quantile needle */}
                <div style={{position:"absolute",top:"0",bottom:"0",
                  left:`${Math.min(100,Math.max(0,q))}%`,width:"2px",marginLeft:"-1px",
                  background:tier.color,boxShadow:`0 0 6px ${tier.color}`,borderRadius:"1px",
                  transition:"left 0.4s cubic-bezier(0.4,0,0.2,1)"}}/>
                <div style={{position:"absolute",top:"-3px",
                  left:`${Math.min(100,Math.max(0,q))}%`,transform:"translateX(-50%)",
                  width:0,height:0,borderLeft:"4px solid transparent",borderRight:"4px solid transparent",
                  borderTop:`5px solid ${tier.color}`,
                  transition:"left 0.4s cubic-bezier(0.4,0,0.2,1)"}}/>
              </div>
            </div>
          </div>

          {/* Structure — quantile-anchored strikes or margin framework */}
          {tier.kind === "pmcc" && strikes && (
            <div style={{
              background:tier.darkBg,
              border:`1px solid ${tier.color}30`,
              borderLeft:`3px solid ${tier.color}`,
              borderRadius:"6px",padding:"14px 16px"}}>
              <div style={{fontSize:"12px",color:"#7ab8d8",textTransform:"uppercase",
                letterSpacing:"0.1em",fontWeight:600,marginBottom:"10px"}}>Structure</div>
              {[
                { leg:"LONG",  s:strikes.long,  sub:`band floor · ~${strikes.long.mo} mo` },
                { leg:"SHORT", s:strikes.short, sub:`band ceiling · ~${strikes.short.mo} mo · rotation trigger` },
              ].map(({leg,s,sub})=>(
                <div key={leg} style={{display:"flex",alignItems:"baseline",gap:"12px",flexWrap:"wrap",
                  padding:"7px 0",borderTop:leg==="SHORT"?"1px solid #ffffff10":"none"}}>
                  <span style={{fontSize:"11px",fontWeight:700,letterSpacing:"0.1em",color:tier.color,
                    width:"46px"}}>{leg}</span>
                  <span style={{fontSize:"15px",fontWeight:700,color:"#f1f5f9"}}>{s.q}q</span>
                  <span style={{fontSize:"13px",color:"#a0b8cc"}}>{fmtMonth(s.ts)}
                    <span style={{fontSize:"11px",color:"#5a7fa0",marginLeft:"6px"}}>{Math.round((s.ts-todayTs)/86400000)}d</span>
                  </span>
                  <span style={{fontSize:"15px",fontWeight:700,color:tier.color}}>≈ {fmtFull(s.price)}</span>
                  <span style={{fontSize:"10px",color:"#5a7fa0",letterSpacing:"0.05em",textTransform:"uppercase"}}>{sub}</span>
                </div>
              ))}
            </div>
          )}
          {tier.kind === "margin" && (() => {
            const ms = marginStats(tier.margin);
            return (
              <div style={{
                background:tier.darkBg,
                border:`1px solid ${tier.color}30`,
                borderLeft:`3px solid ${tier.color}`,
                borderRadius:"6px",padding:"14px 16px"}}>
                <div style={{fontSize:"12px",color:"#7ab8d8",textTransform:"uppercase",
                  letterSpacing:"0.1em",fontWeight:600,marginBottom:"10px"}}>Margin Framework</div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))",gap:"10px"}}>
                  {[
                    { label:"Leverage",     val:`${tier.margin.leverage}×` },
                    { label:"Net carry",    val:`~${(ms.carry*100).toFixed(1)}%`, hint:"on equity" },
                    { label:"Margin call",  val:`−${(ms.callDD*100).toFixed(0)}%`, hint:`STRC ≈ $${ms.callPx.toFixed(0)}` },
                    { label:"Maintenance",  val:`${(tier.margin.maint*100).toFixed(0)}%` },
                  ].map(x=>(
                    <div key={x.label}>
                      <div style={{fontSize:"10px",color:"#5a8fc0",textTransform:"uppercase",
                        letterSpacing:"0.1em",marginBottom:"3px",fontWeight:600}}>{x.label}</div>
                      <div style={{fontSize:"18px",fontWeight:700,color:tier.color}}>{x.val}</div>
                      {x.hint && <div style={{fontSize:"10px",color:"#7a9ab8"}}>{x.hint}</div>}
                    </div>
                  ))}
                </div>
              </div>
            );
          })()}
      </div>

          {/* FORWARD PROJECTION TABLE */}
      <ForwardTable todayTs={todayTs} modelA={modelA} modelB={modelB}/>

      {/* PRICE LOOKUP */}
      <PriceLookup btcPrice={price} liveHistory={liveHistory} dateStr={lookupDate} setDateStr={setLookupDate} modelA={modelA} modelB={modelB}/>

      {/* POWER LAW CHART */}
      <PowerLawChart btcPrice={price} todayTs={todayTs} liveHistory={liveHistory} lookupTs={lookupDate ? Date.parse(lookupDate + "T00:00:00Z") : null} modelA={modelA} modelB={modelB}/>

      <div style={{marginTop:"24px",paddingTop:"16px",borderTop:"1px solid #0a1628"}}>
        <div style={{fontSize:"10px",color:"#3a5a78",textAlign:"center",letterSpacing:"0.12em",textTransform:"uppercase",fontWeight:500}}>
          Kaim Power Law Model  ·  A=5.82  ·  B=−17.029  ·  v2 — quantile-anchored PMCC ladder
        </div>
      </div>
      </>)}

      {tab === "playbook" && <PlaybookTab todayTs={todayTs} btcPrice={price} priceStr={priceStr}
        livePrice={livePrice} modelA={modelA} modelB={modelB}/>}

      {tab === "mstr" && <MstrTab btcPrice={price} priceStr={priceStr} livePrice={livePrice}/>}
    </div>
  );
}


    function App() {
      const [unlocked, setUnlocked] = React.useState(() => sessionStorage.getItem('bql_ok') === '1');
      const [pin, setPin] = React.useState("");
      const [err, setErr] = React.useState(false);

      const attempt = () => {
        crypto.subtle.digest("SHA-256", new TextEncoder().encode(pin)).then(h => {
          const hex = [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("");
          if (hex === "60cafa03272449d4129f58adaa38cc9604e1d4c9c74362084ac4fac09b4d6f0d") {
            sessionStorage.setItem('bql_ok','1'); setUnlocked(true);
          } else {
            setErr(true); setPin(""); setTimeout(() => setErr(false), 2000);
          }
        });
      };

      if (unlocked) return <>
        <BTCPowerLaw />
      </>;

      return (
        <div style={{display:"flex",alignItems:"center",justifyContent:"center",
          minHeight:"100vh",background:"#020817",fontFamily:"var(--font, 'JetBrains Mono', monospace)"}}>
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:"11px",color:"#5a8fc0",textTransform:"uppercase",
              letterSpacing:"0.18em",marginBottom:"32px",fontWeight:600}}>BTC Quantile Ladder</div>
            <input type="password" maxLength={10} placeholder="····" value={pin}
              onChange={e => setPin(e.target.value)}
              onKeyDown={e => e.key === "Enter" && attempt()}
              style={{background:"#070f1f",border:"1px solid #0f2a42",borderRadius:"6px",
                color:"#facc15",fontSize:"20px",fontFamily:"inherit",padding:"12px 18px",
                width:"160px",outline:"none",textAlign:"center",letterSpacing:"0.3em"}}/>
            <div style={{marginTop:"16px"}}>
              <button onClick={attempt}
                style={{background:"#070f1f",border:"1px solid #1a3a5c",borderRadius:"6px",
                  color:"#8aaac8",fontSize:"11px",fontFamily:"inherit",padding:"10px 24px",
                  cursor:"pointer",letterSpacing:"0.1em",textTransform:"uppercase",fontWeight:600}}>
                Enter
              </button>
            </div>
            <div style={{color:"#ef4444",fontSize:"11px",marginTop:"12px",
              letterSpacing:"0.06em",opacity:err?1:0,transition:"opacity 0.2s"}}>
              incorrect passcode
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
  <script>
    function applyMobileStyles() {
      const mobile = window.innerWidth <= 700;
      const existing = document.getElementById('m');
      if (!mobile) {
        if (existing) existing.remove();
        return;
      }
      if (existing) return;
      const s = document.createElement('style');
      s.id = 'm';
      s.textContent = `
        /* Stat cards: 4-col → 2-col */
        #root [style*="repeat(4, 1fr)"] { grid-template-columns: repeat(2,1fr) !important; }
        /* Price lookup: 6-col → 3-col */
        #root [style*="repeat(6, 1fr)"] { grid-template-columns: repeat(3,1fr) !important; }
        /* Income/margin grids: 5-col → 2-col + last full-width */
        #root [style*="repeat(5, 1fr)"] { grid-template-columns: repeat(2,1fr) !important; }
        #root [style*="repeat(5, 1fr)"] > *:nth-child(5) { grid-column: 1 / -1 !important; }
        /* Horizontal scroll for preset buttons */
        #root [style*="flex-wrap: wrap"][style*="gap: 4px"] { 
          flex-wrap: nowrap !important; overflow-x: auto !important; 
          -webkit-overflow-scrolling: touch !important; padding-bottom: 4px !important;
          scrollbar-width: none !important;
        }
        #root [style*="flex-wrap: wrap"][style*="gap: 4px"]::-webkit-scrollbar { display: none !important; }
        /* Header row: stack on mobile */
        #root [style*="justify-content: space-between"][style*="gap: 8px"] { flex-wrap: wrap !important; }
        /* Tier card: stack text above circles */
        #root [style*="justify-content: space-between"][style*="gap: 16px"] { 
          flex-direction: column !important; align-items: flex-start !important; 
        }
        /* Quantile rail: stack name over range, taller container */
        #root [style*="height: 40px"][style*="position: relative"] { height: 52px !important; }
        #root [style*="overflow: hidden"][style*="gap: 5px"][style*="position: absolute"] { flex-direction: column !important; gap: 1px !important; }
        #root [style*="overflow: hidden"][style*="gap: 5px"][style*="position: absolute"] > span { font-size: 8px !important; }
        /* Band dial: slightly smaller on mobile, keep two-line text proportions */
        #root [style*="width: 68px"][style*="height: 68px"] { width: 58px !important; height: 58px !important; }
        #root [style*="width: 68px"][style*="height: 68px"] > div:first-child { font-size: 13px !important; }
        #root [style*="width: 68px"][style*="height: 68px"] > div:last-child { font-size: 8px !important; }
        /* Model selector: wrap */
        #root [style*="margin-left: 4px"][style*="gap: 8px"] { flex-wrap: wrap !important; }
        #root [style*="margin-left: 4px"][style*="gap: 8px"] > * { min-width: 0 !important; }
        /* Forward projection table: smaller font */
        #root [style*="gridTemplateColumns"][style*="60px"] { font-size: 10px !important; }
        /* Instrument name: smaller on mobile */
        #root [style*="font-size: 28px"] { font-size: 22px !important; }
        /* General: tighter padding */
        #root > div > div { padding-left: 12px !important; padding-right: 12px !important; }
      `;
      document.head.appendChild(s);
    }
    // Run after React mounts content
    const _observer = new MutationObserver(() => applyMobileStyles());
    _observer.observe(document.getElementById('root'), {childList:true, subtree:false});
    window.addEventListener('resize', applyMobileStyles);
    // Also run once on load in case observer fires too early
    window.addEventListener('load', applyMobileStyles);
  </script>
</body>
